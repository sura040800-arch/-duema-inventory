name: Update Duel Masters Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install playwright
          playwright install chromium

      - name: Scrape official card list
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urljoin
          import json
          import os
          import re
          import time
          import sys

          BASE = "https://dm.takaratomy.co.jp"
          URL = BASE + "/card/"

          def get_cards(page):
              cards = []

              links = page.locator(
                  '#cardlist a[href*="/card/detail/"]'
              )

              count = links.count()

              seen = set()

              for i in range(count):
                  a = links.nth(i)

                  href = a.get_attribute("href")

                  if not href:
                      continue

                  full_url = urljoin(BASE, href)

                  m = re.search(
                      r"[?&]id=([^&]+)",
                      full_url
                  )

                  if not m:
                      continue

                  card_id = m.group(1)

                  if card_id in seen:
                      continue

                  seen.add(card_id)

                  text = a.inner_text().strip()

                  number = ""

                  # テキストからカード番号を探す
                  nm = re.search(
                      r"\b(dm\d+[a-z0-9-]*[-_][A-Za-z0-9]+)\b",
                      text,
                      re.I
                  )

                  if nm:
                      number = nm.group(1)

                  # img altからも探す
                  if not number:
                      img = a.locator("img")

                      if img.count() > 0:
                          alt = img.first.get_attribute("alt") or ""

                          nm = re.search(
                              r"\b(dm\d+[a-z0-9-]*[-_][A-Za-z0-9]+)\b",
                              alt,
                              re.I
                          )

                          if nm:
                              number = nm.group(1)

                  cards.append({
                      "id": card_id,
                      "name": text,
                      "number": number,
                      "url": full_url
                  })

              return cards

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page(
                  viewport={
                      "width": 1280,
                      "height": 1000
                  }
              )

              print("公式カード検索を開いています...")
              page.goto(
                  URL,
                  wait_until="networkidle",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              print("URL:", page.url)

              # --------------------------------
              # 1ページ目
              # --------------------------------

              cards = get_cards(page)

              print("")
              print("1ページ目カード数:", len(cards))

              if not cards:
                  print("ERROR: 1ページ目からカードを取得できませんでした")
                  browser.close()
                  sys.exit(1)

              print(
                  "1ページ目:",
                  [x["id"] for x in cards[:5]]
              )

              all_cards = []
              seen_ids = set()

              for card in cards:
                  if card["id"] not in seen_ids:
                      seen_ids.add(card["id"])
                      all_cards.append(card)

              # --------------------------------
              # 最終ページ番号を取得
              # --------------------------------

              page_numbers = []

              paginator = page.locator(
                  "#cardlist .wp-pagenavia a"
              )

              for i in range(paginator.count()):

                  a = paginator.nth(i)

                  data_page = a.get_attribute(
                      "data-page"
                  )

                  if data_page and data_page.isdigit():
                      page_numbers.append(
                          int(data_page)
                      )

              if not page_numbers:
                  print(
                      "ERROR: ページ番号を取得できませんでした"
                  )

                  browser.close()
                  sys.exit(1)

              last_page = max(page_numbers)

              print("")
              print(
                  "検出したページ番号:",
                  sorted(set(page_numbers))
              )

              print(
                  "最終ページ:",
                  last_page
              )

              # --------------------------------
              # 2ページ目以降
              # --------------------------------

              for target_page in range(
                  2,
                  last_page + 1
              ):

                  print("")
                  print(
                      f"========== "
                      f"{target_page}/{last_page} "
                      f"=========="
                  )

                  # フォームのpagenumを変更
                  page.locator(
                      '#search_cond input[name="pagenum"]'
                  ).fill(str(target_page))

                  # JavaScriptと同じくフォームを送信
                  #
                  # 公式JS:
                  # $form.submit();

                  with page.expect_navigation(
                      wait_until="networkidle",
                      timeout=60000
                  ):
                      page.locator(
                          "#search_cond"
                      ).evaluate(
                          "form => form.submit()"
                      )

                  page.wait_for_timeout(1000)

                  current_cards = get_cards(page)

                  print(
                      "取得カード:",
                      len(current_cards)
                  )

                  if not current_cards:

                      print(
                          "ERROR: "
                          f"{target_page}ページから "
                          "カードを取得できませんでした"
                      )

                      browser.close()
                      sys.exit(1)

                  new_count = 0

                  for card in current_cards:

                      if card["id"] not in seen_ids:

                          seen_ids.add(
                              card["id"]
                          )

                          all_cards.append(card)

                          new_count += 1

                  print(
                      "新規:",
                      new_count
                  )

                  print(
                      "累計:",
                      len(all_cards)
                  )

                  # 同じページが返っていないか確認
                  if target_page == 2:

                      first_ids = [
                          x["id"]
                          for x in all_cards[:50]
                      ]

                      second_ids = [
                          x["id"]
                          for x in current_cards[:50]
                      ]

                      if first_ids == second_ids:

                          print(
                              "ERROR: "
                              "ページ1とページ2が同じです"
                          )

                          browser.close()
                          sys.exit(1)

                  time.sleep(0.5)

              browser.close()

          # --------------------------------
          # 最終チェック
          # --------------------------------

          print("")
          print("==============================")
          print("全ページ取得完了")
          print("総カード数:", len(all_cards))
          print("==============================")

          if len(all_cards) < 1000:

              print(
                  "ERROR: "
                  "カード数が少なすぎます"
              )

              sys.exit(1)

          # --------------------------------
          # 保存
          # --------------------------------

          all_cards.sort(
              key=lambda x: (
                  x.get("number", ""),
                  x.get("id", "")
              )
          )

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              "data/cards.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  all_cards,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "data/cards.json を更新しました"
          )

          PY

      - name: Commit cards.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cards.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update Duel Masters card data"
            git push
          fi
