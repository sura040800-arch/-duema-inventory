name: Test Duel Masters Direct Pagination

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Test direct pagination
        run: |
          python - <<'PY'
          import json
          import re
          from urllib.parse import quote

          from playwright.sync_api import sync_playwright


          BASE = "https://dm.takaratomy.co.jp/card/"


          def make_url(page_number):

              state = {
                  "suggest": "on",
                  "keyword_type": [
                      "card_name",
                      "card_ruby",
                      "card_text"
                  ],
                  "culture_cond": [
                      "単色",
                      "多色"
                  ],
                  "pagenum": str(page_number),
                  "samename": "show",
                  "sort": "release_new"
              }

              value = json.dumps(
                  state,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

              return BASE + "?v=" + quote(
                  value,
                  safe=""
              )


          def get_card_ids(page):

              links = page.locator(
                  'a[href*="/card/detail/?id="]'
              ).all()

              ids = []

              for link in links:

                  href = link.get_attribute("href")

                  if not href:
                      continue

                  match = re.search(
                      r'id=([^&"]+)',
                      href
                  )

                  if match:
                      ids.append(
                          match.group(1)
                      )

              return list(
                  dict.fromkeys(ids)
              )


          with sync_playwright() as p:

              print("Chromiumを起動します")

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 390,
                      "height": 844
                  },
                  user_agent=(
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                      "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                      "Version/18.0 Mobile/15E148 Safari/604.1"
                  )
              )

              page = context.new_page()


              # =====================================
              # 1ページ目
              # =====================================

              url1 = make_url(1)

              print("")
              print("================================")
              print("1ページ目を開きます")
              print("================================")
              print(url1)

              page.goto(
                  url1,
                  wait_until="networkidle",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              ids1 = get_card_ids(page)

              print("")
              print("===== 1ページ目 =====")
              print("URL:", page.url)
              print("カード:", len(ids1), "枚")
              print("先頭:", ids1[:5])
              print("末尾:", ids1[-5:])


              if len(ids1) == 0:
                  raise RuntimeError(
                      "1ページ目のカードを取得できませんでした。"
                  )


              # =====================================
              # 2ページ目
              # =====================================

              url2 = make_url(2)

              print("")
              print("================================")
              print("2ページ目を開きます")
              print("================================")
              print(url2)

              page.goto(
                  url2,
                  wait_until="networkidle",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              ids2 = get_card_ids(page)

              print("")
              print("===== 2ページ目 =====")
              print("URL:", page.url)
              print("カード:", len(ids2), "枚")
              print("先頭:", ids2[:5])
              print("末尾:", ids2[-5:])


              # =====================================
              # 比較
              # =====================================

              same = ids1 == ids2

              print("")
              print("================================")
              print("結果")
              print("================================")

              print(
                  "1ページ目と2ページ目が同じ:",
                  same
              )

              if not same:

                  print("")
                  print("SUCCESS!")
                  print(
                      "ブラウザでpagenum=2が正常に機能しました！"
                  )

              else:

                  print("")
                  print(
                      "pagenum=2でも同じカードが返りました。"
                  )

                  print("")
                  print(
                      "別の取得方法が必要です。"
                  )

                  raise RuntimeError(
                      "1ページ目と2ページ目が同じです。"
                  )


              browser.close()

          PY
