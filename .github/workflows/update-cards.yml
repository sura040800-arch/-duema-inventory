name: Debug Duel Masters Page Request

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          pip install requests

      - name: Inspect search.js
        run: |
          python - <<'PY'
          import requests
          import re

          JS_URL = "https://www.takaratomy.co.jp/common/2025/js/search.js"

          print("=" * 80)
          print("search.js を取得します")
          print("=" * 80)

          r = requests.get(
              JS_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
              timeout=30
          )

          print("HTTP:", r.status_code)
          print("文字数:", len(r.text))

          js = r.text
          lines = js.splitlines()

          print("\n")
          print("=" * 80)
          print("【先頭150行】")
          print("=" * 80)

          for i, line in enumerate(lines[:150], 1):
              print(f"{i:04d}: {line}")

          patterns = [
              "research",
              "$.ajax",
              "$.get",
              "$.post",
              "getJSON",
              "fetch(",
              "XMLHttpRequest",
              "pagenum",
              "data-page",
              ".page",
              "history.pushState",
              "history.replaceState",
              "param_json",
              "location.search",
              "非同期",
              "ページ取得",
          ]

          print("\n")
          print("=" * 80)
          print("【重要キーワード周辺】")
          print("=" * 80)

          found_ranges = []

          for pattern in patterns:
              for i, line in enumerate(lines):
                  if pattern.lower() in line.lower():
                      start = max(0, i - 15)
                      end = min(len(lines), i + 16)

                      # 重複表示を避ける
                      already = False
                      for a, b in found_ranges:
                          if start >= a and end <= b:
                              already = True
                              break

                      if already:
                          continue

                      found_ranges.append((start, end))

                      print("\n" + "-" * 80)
                      print(f"KEYWORD: {pattern}")
                      print(f"LINES: {start + 1} - {end}")
                      print("-" * 80)

                      for j in range(start, end):
                          print(f"{j + 1:04d}: {lines[j]}")

          print("\n")
          print("=" * 80)
          print("【ページ関連の行だけ】")
          print("=" * 80)

          page_patterns = [
              "data-page",
              "pagenum",
              "research(",
              "$.ajax",
              "$.get(",
              "$.post(",
              "fetch(",
              "非同期",
              "ページ取得",
          ]

          for i, line in enumerate(lines, 1):
              if any(p.lower() in line.lower() for p in page_patterns):
                  print(f"{i:04d}: {line}")

          print("\n")
          print("=" * 80)
          print("調査終了")
          print("=" * 80)
          PY
