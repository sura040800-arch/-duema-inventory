name: Update Duel Masters Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Scrape official card list
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          import json
          import re
          import sys
          import time
          from pathlib import Path

          URL = "https://dm.takaratomy.co.jp/card/"
          OUT = Path("data/cards.json")

          def extract_cards(html):
              soup = BeautifulSoup(html, "html.parser")

              result = []

              for a in soup.select('a[href*="/card/detail/?id="]'):
                  href = a.get("href", "")

                  m = re.search(
                      r"[?&]id=([^&]+)",
                      href
                  )

                  if not m:
                      continue

                  card_id = m.group(1)

                  # カード名候補
                  name = a.get_text(
                      " ",
                      strip=True
                  )

                  if not name:
                      name = a.get(
                          "title",
                          ""
                      ).strip()

                  if not name:
                      name = a.get(
                          "aria-label",
                          ""
                      ).strip()

                  # 画像のalt
                  if not name:
                      img = a.find("img")

                      if img:
                          name = (
                              img.get("alt", "")
                              .strip()
                          )

                  # 親要素から名前を探す
                  if not name:
                      parent = a.parent

                      if parent:
                          text = parent.get_text(
                              " ",
                              strip=True
                          )

                          if text:
                              name = text

                  # それでも空ならIDを仮名にする
                  if not name:
                      name = card_id

                  detail_url = (
                      "https://dm.takaratomy.co.jp"
                      f"/card/detail/?id={card_id}"
                  )

                  result.append({
                      "id": card_id,
                      "name": name,
                      "number": card_id,
                      "url": detail_url
                  })

              # ID重複除去
              unique = {}

              for card in result:
                  unique[card["id"]] = card

              return list(unique.values())

          print("")
          print("================================")
          print("デュエマ公式カード取得開始")
          print("================================")
          print("")

          all_cards = {}
          page_number = 1
          max_pages = 600

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page()

              print("公式カード検索を開いています...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(4000)

              while page_number <= max_pages:

                  print("")
                  print(
                      "=============================="
                  )
                  print(
                      f"{page_number}ページ目を取得"
                  )
                  print(
                      "=============================="
                  )

                  html = page.content()

                  cards = extract_cards(html)

                  print(
                      "このページ:",
                      len(cards),
                      "枚"
                  )

                  if len(cards) == 0:
                      print(
                          "カードが0枚になったので終了します"
                      )
                      break

                  before = len(all_cards)

                  for card in cards:
                      all_cards[
                          card["id"]
                      ] = card

                  added = (
                      len(all_cards) - before
                  )

                  print(
                      "新規追加:",
                      added,
                      "枚"
                  )

                  print(
                      "現在の総カード数:",
                      len(all_cards)
                  )

                  # ページ2以降へ
                  next_page = page_number + 1

                  print(
                      f"{next_page}ページ目へ移動..."
                  )

                  selector = (
                      '#cardlist .wp-pagenavi '
                      f'a[data-page="{next_page}"]'
                  )

                  button = page.locator(
                      selector
                  )

                  if button.count() == 0:
                      print(
                          "次ページボタンが見つかりません"
                      )
                      print(
                          "取得を終了します"
                      )
                      break

                  old_ids = {
                      card["id"]
                      for card in cards
                  }

                  # 成功した公式JSクリック方式
                  result = page.evaluate(
                      """
                      (pageNumber) => {

                          const el =
                              document.querySelector(
                                  '#cardlist .wp-pagenavi ' +
                                  'a[data-page="' +
                                  pageNumber +
                                  '"]'
                              );

                          if (!el) {
                              return "NOT_FOUND";
                          }

                          if (!window.jQuery) {
                              return "NO_JQUERY";
                          }

                          window.jQuery(el).trigger(
                              "click"
                          );

                          return "CLICK_OK";
                      }
                      """,
                      next_page
                  )

                  print(
                      "クリック結果:",
                      result
                  )

                  if result != "CLICK_OK":
                      print(
                          "ページ移動失敗"
                      )
                      break

                  changed = False

                  for wait_sec in range(1, 16):

                      time.sleep(1)

                      new_cards = extract_cards(
                          page.content()
                      )

                      new_ids = {
                          card["id"]
                          for card in new_cards
                      }

                      if (
                          new_cards
                          and new_ids != old_ids
                      ):
                          changed = True
                          break

                  if not changed:
                      print(
                          "ページ内容が変化しませんでした"
                      )
                      break

                  page_number = next_page

                  # サーバーに負荷をかけすぎない
                  time.sleep(0.5)

              browser.close()

          print("")
          print("================================")
          print("取得終了")
          print("================================")
          print(
              "総カード数:",
              len(all_cards)
          )
          print(
              "取得ページ数:",
              page_number
          )

          # 十分な枚数が取れていなければ既存ファイルを触らない
          if len(all_cards) < 20000:
              print("")
              print(
                  "ERROR: 取得枚数が少なすぎます"
              )
              print(
                  "既存の cards.json は変更しません"
              )
              sys.exit(1)

          # 安全のためIDでソート
          cards_list = sorted(
              all_cards.values(),
              key=lambda x: x["id"]
          )

          OUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          temp = OUT.with_suffix(
              ".json.tmp"
          )

          temp.write_text(
              json.dumps(
                  cards_list,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          temp.replace(OUT)

          print("")
          print(
              "cards.json を更新しました"
          )
          print(
              "保存枚数:",
              len(cards_list)
          )
          print("")
          PY

      - name: Commit cards.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cards.json

          if git diff --cached --quiet; then
            echo "カード情報に変更はありません"
          else
            git commit -m "Update Duel Masters card data"
            git push
          fi
