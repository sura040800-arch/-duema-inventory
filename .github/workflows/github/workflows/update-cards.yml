name: Update Duel Masters Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Scrape official cards
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          BASE = "https://dm.takaratomy.co.jp"
          SEARCH = BASE + "/card/"
          OUT = "data/cards.json"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; DuelMastersInventory/1.0)"
          })

          def get_links(page):
              params = {
                  "v": json.dumps({
                      "suggest": "on",
                      "pagenum": str(page),
                      "sort": "release_new"
                  }, ensure_ascii=False, separators=(",", ":"))
              }

              r = session.get(SEARCH, params=params, timeout=30)
              r.raise_for_status()

              soup = BeautifulSoup(r.text, "html.parser")
              links = set()

              for a in soup.find_all("a", href=True):
                  href = a["href"]
                  if "/card/detail/" in href and "id=" in href:
                      links.add(urljoin(BASE, href))

              return links

          print("公式カード一覧を取得中...")

          all_links = set()
          previous = set()
          empty_count = 0

          for page in range(1, 601):
              try:
                  links = get_links(page)
                  print(f"ページ {page}: {len(links)}件")

                  if not links:
                      empty_count += 1
                      if empty_count >= 3:
                          break
                  else:
                      empty_count = 0

                  before = len(all_links)
                  all_links.update(links)

                  if len(all_links) == before and links == previous:
                      break

                  previous = links
                  time.sleep(0.15)

              except Exception as e:
                  print(f"ページ {page} エラー: {e}")
                  continue

          print(f"詳細ページ数: {len(all_links)}")

          def scrape(url):
              try:
                  r = session.get(url, timeout=30)
                  r.raise_for_status()

                  soup = BeautifulSoup(r.text, "html.parser")

                  h1 = soup.find("h1")
                  if not h1:
                      return None

                  title = h1.get_text(" ", strip=True)

                  number_match = re.search(r"\(([^)]+)\)", title)
                  number = number_match.group(1) if number_match else ""

                  name = re.sub(r"\s*\([^)]*\)\s*$", "", title).strip()

                  id_match = re.search(r"[?&]id=([^&]+)", url)
                  card_id = id_match.group(1) if id_match else url

                  text = soup.get_text(" ", strip=True)

                  def field(label):
                      m = re.search(
                          re.escape(label) + r"\s*([^|]+?)(?=\s+(?:カードの種類|文明|レアリティ|パワー|コスト|マナ|種族|イラストレーター)\s|$)",
                          text
                      )
                      return m.group(1).strip() if m else ""

                  civilization = ""
                  rarity = ""
                  cost = ""

                  m = re.search(r"文明\s+(.+?)\s+レアリティ\s+", text)
                  if m:
                      civilization = m.group(1).strip()

                  m = re.search(r"レアリティ\s+(.+?)\s+パワー\s+", text)
                  if m:
                      rarity = m.group(1).strip()

                  m = re.search(r"コスト\s+(.+?)\s+マナ\s+", text)
                  if m:
                      cost = m.group(1).strip()

                  return {
                      "id": card_id,
                      "name": name,
                      "number": number,
                      "civilization": civilization,
                      "rarity": rarity,
                      "cost": cost
                  }

              except Exception as e:
                  print("詳細取得失敗:", url, e)
                  return None

          cards = []

          with ThreadPoolExecutor(max_workers=10) as executor:
              futures = [executor.submit(scrape, u) for u in all_links]

              for i, future in enumerate(as_completed(futures), 1):
                  card = future.result()

                  if card:
                      cards.append(card)

                  if i % 100 == 0:
                      print(f"詳細取得: {i}/{len(futures)}")

          unique = {}

          for card in cards:
              unique[card["id"]] = card

          cards = list(unique.values())

          cards.sort(key=lambda x: x["number"])

          print(f"取得完了: {len(cards)}枚")

          if len(cards) < 1000:
              raise RuntimeError(
                  f"取得枚数が少なすぎます: {len(cards)}枚。"
                  "公式サイトの仕様変更などの可能性があります。"
              )

          with open(OUT, "w", encoding="utf-8") as f:
              json.dump(cards, f, ensure_ascii=False, indent=2)

          print(f"{OUT} を更新しました")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          git diff --cached --quiet || git commit -m "Update Duel Masters card data"
          git push
