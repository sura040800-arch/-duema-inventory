<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>デュエマ コレクション</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f2f3f5;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:28px 20px 30px;
}

header h1{
  margin:0 0 20px;
  font-size:28px;
}

#search{
  width:100%;
  padding:17px 18px;
  font-size:20px;
  border-radius:16px;
  border:2px solid #ddd;
  outline:none;
}

main{
  max-width:760px;
  margin:auto;
  padding:16px;
}

.tabs{
  display:flex;
  gap:14px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  border:0;
  border-radius:16px;
  padding:18px 10px;
  font-size:20px;
  font-weight:bold;
  background:#e5e7eb;
}

.tab.active{
  background:#111827;
  color:white;
}

.status{
  color:#6b7280;
  margin:12px 4px;
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 8px #00000012;
}

.card-img{
  display:block;
  width:220px;
  max-width:100%;
  margin:0 auto 16px;
  border-radius:10px;
  box-shadow:0 2px 8px #0002;
}

.card h3{
  margin:0 0 8px;
  font-size:19px;
}

.info{
  color:#6b7280;
  font-size:14px;
  line-height:1.6;
}

.qty{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
}

.qty button{
  width:42px;
  height:42px;
  border:0;
  border-radius:10px;
  font-size:22px;
  background:#e5e7eb;
}

.qty span{
  min-width:35px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.hidden{
  display:none;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:40px 10px;
}

.deck{
  background:white;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
}

.deck button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  margin:4px;
  font-size:15px;
}

.primary{
  background:#111827;
  color:white;
}
</style>
</head>

<body>

<header>
  <h1>デュエマ コレクション</h1>

  <input
    id="search"
    type="search"
    placeholder="カード名・カード番号で検索"
    autocomplete="off"
  >
</header>

<main>

  <div class="tabs">
    <button id="invTab" class="tab active">
      📦 所持カード
    </button>

    <button id="deckTab" class="tab">
      🃏 デッキ
    </button>
  </div>

  <div id="status" class="status">
    カードデータを読み込み中...
  </div>

  <section id="inventoryView">
    <div id="cards"></div>
  </section>

  <section id="deckView" class="hidden">

    <div class="deck">
      <button class="primary" onclick="addDeck()">
        ＋ デッキを追加
      </button>
    </div>

    <div id="decks"></div>

  </section>

</main>

<script>
"use strict";

let cards = [];

let owned =
  JSON.parse(
    localStorage.getItem("duema_owned") || "{}"
  );

let decks =
  JSON.parse(
    localStorage.getItem("duema_decks") || "[]"
  );

const search =
  document.getElementById("search");

const cardsBox =
  document.getElementById("cards");

const statusBox =
  document.getElementById("status");

const inventoryView =
  document.getElementById("inventoryView");

const deckView =
  document.getElementById("deckView");

const invTab =
  document.getElementById("invTab");

const deckTab =
  document.getElementById("deckTab");


function saveOwned(){

  localStorage.setItem(
    "duema_owned",
    JSON.stringify(owned)
  );

}


function saveDecks(){

  localStorage.setItem(
    "duema_decks",
    JSON.stringify(decks)
  );

}


function getId(card){

  return (
    card.id ||
    card.card_id ||
    card.cardId ||
    card.number ||
    ""
  );

}


function getName(card){

  return (
    card.name ||
    card.card_name ||
    card.title ||
    getId(card)
  );

}


function getType(card){

  return card.type || card.card_type || "";

}


function getCivilization(card){

  return (
    card.civilization ||
    card.civ ||
    ""
  );

}


function getRarity(card){

  return card.rarity || "";

}


function getPower(card){

  return card.power || "";

}


function getCost(card){

  return card.cost ?? "";

}


function normalizeCard(card){

  return {

    ...card,

    _id:String(getId(card)),

    _name:String(getName(card)),

    _type:String(getType(card)),

    _civilization:String(
      getCivilization(card)
    ),

    _rarity:String(
      getRarity(card)
    ),

    _power:String(
      getPower(card)
    ),

    _cost:String(
      getCost(card)
    )

  };

}


async function loadCards(){

  try{

    statusBox.textContent =
      "カードデータを読み込み中...";

    const response =
      await fetch(
        "./data/cards.json?" + Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }

    const data =
      await response.json();

    if(Array.isArray(data)){

      cards = data;

    }else if(
      Array.isArray(data.cards)
    ){

      cards = data.cards;

    }else{

      throw new Error(
        "カードデータの形式が違います"
      );

    }

    cards =
      cards.map(normalizeCard);

    statusBox.textContent =
      "カード " +
      cards.length.toLocaleString() +
      " 枚を読み込みました";

    renderCards();

  }catch(error){

    console.error(error);

    statusBox.innerHTML =
      "カードデータを読み込めませんでした。<br>" +
      "ページを再読み込みしてください。";

    cardsBox.innerHTML = `
      <div class="empty">
        データ読み込みエラー<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


function renderCards(){

  const keyword =
    search.value
      .trim()
      .toLowerCase();

  let result = cards;

  if(keyword){

    result =
      cards.filter(card => {

        return (

          card._name
            .toLowerCase()
            .includes(keyword)

          ||

          card._id
            .toLowerCase()
            .includes(keyword)

        );

      });

  }else{

    result =
      cards.filter(
        card =>
          (owned[card._id] || 0) > 0
      );

  }

  result =
    result.slice(0,200);


  if(result.length === 0){

    cardsBox.innerHTML = `

      <div class="empty">

        ${
          keyword
          ? "検索結果がありません"
          : "所持カードがありません"
        }

      </div>

    `;

    return;

  }


  cardsBox.innerHTML =

    result.map(card => {

      const id =
        card._id;

      const count =
        owned[id] || 0;

      const imageUrl =
        "https://dm.takaratomy.co.jp/wp-content/card/cardimage/"
        +
        encodeURIComponent(id)
        +
        ".jpg";


      return `

        <div class="card">

          <img
            class="card-img"
            src="${imageUrl}"
            alt="${escapeHtml(card._name)}"
            loading="lazy"
            onerror="this.style.display='none'"
          >

          <h3>
            ${escapeHtml(card._name)}
          </h3>

          <div class="info">

            カード番号：
            ${escapeHtml(id)}

            ${
              card._type
              ? "<br>種類：" +
                escapeHtml(card._type)
              : ""
            }

            ${
              card._civilization
              ? "<br>文明：" +
                escapeHtml(
                  card._civilization
                )
              : ""
            }

            ${
              card._rarity
              ? "<br>レアリティ：" +
                escapeHtml(
                  card._rarity
                )
              : ""
            }

            ${
              card._power
              ? "<br>パワー：" +
                escapeHtml(
                  card._power
                )
              : ""
            }

            ${
              card._cost
              ? "<br>コスト：" +
                escapeHtml(
                  card._cost
                )
              : ""
            }

          </div>


          <div class="qty">

            <button
              onclick="changeOwned(
                '${encodeURIComponent(id)}',
                -1
              )"
            >
              −
            </button>

            <span>
              ${count}
            </span>

            <button
              onclick="changeOwned(
                '${encodeURIComponent(id)}',
                1
              )"
            >
              ＋
            </button>

          </div>

        </div>

      `;

    }).join("");

}


function changeOwned(
  encodedId,
  amount
){

  const id =
    decodeURIComponent(encodedId);

  owned[id] =
    Math.max(
      0,
      (owned[id] || 0) + amount
    );


  if(owned[id] === 0){

    delete owned[id];

  }


  saveOwned();

  renderCards();

}


search.addEventListener(
  "input",
  renderCards
);


invTab.addEventListener(
  "click",
  () => {

    invTab.classList.add(
      "active"
    );

    deckTab.classList.remove(
      "active"
    );

    inventoryView.classList.remove(
      "hidden"
    );

    deckView.classList.add(
      "hidden"
    );

    renderCards();

  }
);


deckTab.addEventListener(
  "click",
  () => {

    deckTab.classList.add(
      "active"
    );

    invTab.classList.remove(
      "active"
    );

    deckView.classList.remove(
      "hidden"
    );

    inventoryView.classList.add(
      "hidden"
    );

    renderDecks();

  }
);


function addDeck(){

  const name =
    prompt(
      "デッキ名を入力してください"
    );

  if(!name) return;


  decks.push({

    id:
      Date.now().toString(),

    name:name,

    cards:{}

  });


  saveDecks();

  renderDecks();

}


function renderDecks(){

  const box =
    document.getElementById(
      "decks"
    );


  if(decks.length === 0){

    box.innerHTML = `

      <div class="empty">
        デッキがありません
      </div>

    `;

    return;

  }


  box.innerHTML =

    decks.map(deck => `

      <div class="deck">

        <h3>
          ${escapeHtml(deck.name)}
        </h3>

        <div class="info">
          デッキカード登録機能は順次追加予定
        </div>

        <br>

        <button
          onclick="renameDeck('${deck.id}')"
        >
          名前変更
        </button>

        <button
          onclick="deleteDeck('${deck.id}')"
        >
          削除
        </button>

      </div>

    `).join("");

}


function renameDeck(id){

  const deck =
    decks.find(
      x => x.id === id
    );

  if(!deck) return;


  const name =
    prompt(
      "デッキ名",
      deck.name
    );

  if(!name) return;


  deck.name = name;

  saveDecks();

  renderDecks();

}


function deleteDeck(id){

  if(
    !confirm(
      "このデッキを削除しますか？"
    )
  ){

    return;

  }


  decks =
    decks.filter(
      x => x.id !== id
    );

  saveDecks();

  renderDecks();

}


renderDecks();

loadCards();

</script>

</body>
</html>
