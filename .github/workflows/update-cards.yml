name: Test Duel Masters Page 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Test official pagination
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          import re
          import sys

          URL = "https://dm.takaratomy.co.jp/card/"

          def get_ids(html):
              soup = BeautifulSoup(html, "html.parser")

              ids = []

              for a in soup.select(
                  'a[href*="/card/detail/?id="]'
              ):
                  href = a.get("href", "")

                  m = re.search(
                      r"[?&]id=([^&]+)",
                      href
                  )

                  if m:
                      card_id = m.group(1)

                      if card_id not in ids:
                          ids.append(card_id)

              return ids

          print("公式カード検索を開きます...")

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page()

              print("1ページ目を読み込み中...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              ids1 = get_ids(
                  page.content()
              )

              print("")
              print("==============================")
              print("1ページ目")
              print("==============================")
              print("URL:", page.url)
              print("カード数:", len(ids1))
              print("先頭5枚:", ids1[:5])
              print("最後5枚:", ids1[-5:])

              if len(ids1) == 0:
                  print("ERROR: 1ページ目のカードが取れません")
                  sys.exit(1)

              # 公式JSと同じ方法
              print("")
              print("2ページ目へ移動します...")
              print("公式JSと同じく pagenum=2 をセットして")
              print("search_cond を submit します。")

              result = page.evaluate("""
              () => {
                  const form =
                      document.querySelector(
                          'form#search_cond'
                      );

                  if (!form) {
                      return {
                          ok: false,
                          error: "search_cond form not found"
                      };
                  }

                  const input =
                      form.querySelector(
                          'input[name="pagenum"]'
                      );

                  if (!input) {
                      return {
                          ok: false,
                          error: "pagenum input not found"
                      };
                  }

                  input.value = "2";

                  return {
                      ok: true,
                      method: form.method,
                      action: form.action,
                      pagenum: input.value
                  };
              }
              """)

              print("")
              print("フォーム情報:", result)

              if not result.get("ok"):
                  print("ERROR:", result.get("error"))
                  sys.exit(1)

              print("")
              print("フォームを送信します...")

              # JavaScriptの form.submit() と同じ
              page.evaluate("""
              () => {
                  const form =
                      document.querySelector(
                          'form#search_cond'
                      );

                  HTMLFormElement.prototype.submit.call(
                      form
                  );
              }
              """)

              page.wait_for_timeout(5000)

              ids2 = get_ids(
                  page.content()
              )

              print("")
              print("==============================")
              print("2ページ目")
              print("==============================")
              print("URL:", page.url)
              print("カード数:", len(ids2))
              print("先頭5枚:", ids2[:5])
              print("最後5枚:", ids2[-5:])

              print("")
              print("==============================")
              print("比較")
              print("==============================")

              print(
                  "1ページ目と2ページ目が同じ:",
                  ids1 == ids2
              )

              if ids1 == ids2:
                  print(
                      "ERROR: ページが変わっていません"
                  )
                  sys.exit(1)

              if len(ids2) == 0:
                  print(
                      "ERROR: 2ページ目のカードが0枚です"
                  )
                  sys.exit(1)

              print("")
              print("SUCCESS!")
              print("2ページ目の取得に成功しました。")

              browser.close()

          PY
