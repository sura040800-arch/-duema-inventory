name: Update Duel Masters Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install playwright
          playwright install chromium

      - name: Scrape official card list
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urljoin
          import json
          import os
          import re
          import sys
          import time

          BASE = "https://dm.takaratomy.co.jp"
          START_URL = BASE + "/card/"

          def get_cards(page):
              cards = []
              seen = set()

              links = page.locator(
                  '#cardlist a[href*="/card/detail/"]'
              )

              for i in range(links.count()):
                  a = links.nth(i)

                  href = a.get_attribute("href")

                  if not href:
                      continue

                  url = urljoin(BASE, href)

                  match = re.search(
                      r"[?&]id=([^&]+)",
                      url
                  )

                  if not match:
                      continue

                  card_id = match.group(1)

                  if card_id in seen:
                      continue

                  seen.add(card_id)

                  name = a.inner_text().strip()

                  cards.append({
                      "id": card_id,
                      "name": name,
                      "number": "",
                      "url": url
                  })

              return cards

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page(
                  viewport={
                      "width": 1280,
                      "height": 1000
                  }
              )

              print("公式カード検索を開いています...")
              print("URL:", START_URL)

              page.goto(
                  START_URL,
                  wait_until="networkidle",
                  timeout=60000
              )

              page.wait_for_timeout(2000)

              # =========================
              # 1ページ目
              # =========================

              first = get_cards(page)

              print("")
              print(
                  "1ページ目カード数:",
                  len(first)
              )

              print(
                  "1ページ目:",
                  [x["id"] for x in first[:5]]
              )

              if len(first) == 0:
                  print(
                      "ERROR: 1ページ目のカード取得に失敗"
                  )
                  browser.close()
                  sys.exit(1)

              all_cards = []
              seen_ids = set()

              for card in first:
                  if card["id"] not in seen_ids:
                      seen_ids.add(card["id"])
                      all_cards.append(card)

              previous_ids = [
                  card["id"]
                  for card in first
              ]

              # =========================
              # 2ページ目以降
              # =========================

              for page_number in range(2, 501):

                  print("")
                  print(
                      "=============================="
                  )
                  print(
                      f"{page_number}ページ目を取得"
                  )
                  print(
                      "=============================="
                  )

                  # hidden input の値を変更して
                  # 公式サイトと同じフォームPOSTを行う
                  try:

                      with page.expect_navigation(
                          wait_until="networkidle",
                          timeout=60000
                      ):

                          page.evaluate(
                              """
                              (pageNumber) => {

                                  const form =
                                      document.querySelector(
                                          '#search_cond'
                                      );

                                  if (!form) {
                                      throw new Error(
                                          'search form not found'
                                      );
                                  }

                                  const input =
                                      form.querySelector(
                                          'input[name="pagenum"]'
                                      );

                                  if (!input) {
                                      throw new Error(
                                          'pagenum input not found'
                                      );
                                  }

                                  input.value =
                                      String(pageNumber);

                                  HTMLFormElement.prototype.submit.call(
                                      form
                                  );
                              }
                              """,
                              page_number
                          )

                      )

                  except Exception as e:

                      print(
                          "ページ遷移待機:",
                          str(e)
                      )

                      page.wait_for_timeout(3000)

                  page.wait_for_timeout(1500)

                  current = get_cards(page)

                  print(
                      f"{page_number}ページ目カード数:",
                      len(current)
                  )

                  if len(current) == 0:

                      print(
                          "カードが取得できなくなったので終了"
                      )

                      break

                  current_ids = [
                      card["id"]
                      for card in current
                  ]

                  print(
                      "先頭3枚:",
                      current_ids[:3]
                  )

                  # 同じカードが返ったら終了
                  if current_ids == previous_ids:

                      print(
                          "前ページと同じカードが返りました。"
                      )
                      print(
                          "ページ取得を終了します。"
                      )

                      break

                  new_count = 0

                  for card in current:

                      if card["id"] not in seen_ids:

                          seen_ids.add(card["id"])
                          all_cards.append(card)
                          new_count += 1

                  print(
                      "今回の新規カード:",
                      new_count
                  )

                  print(
                      "累計カード数:",
                      len(all_cards)
                  )

                  if new_count == 0:

                      print(
                          "新しいカードがないため終了"
                      )

                      break

                  previous_ids = current_ids

                  time.sleep(0.5)

              browser.close()

          # =========================
          # 最終確認
          # =========================

          print("")
          print(
              "================================"
          )
          print(
              "最終取得カード数:",
              len(all_cards)
          )
          print(
              "================================"
          )

          # 少なすぎる場合は保存しない
          if len(all_cards) < 1000:

              print(
                  "ERROR: 取得枚数が少なすぎます。"
              )

              print(
                  "data/cards.json は変更しません。"
              )

              sys.exit(1)

          # =========================
          # 保存
          # =========================

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              "data/cards.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  all_cards,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "data/cards.json を更新しました。"
          )

          PY

      - name: Commit cards.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cards.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update Duel Masters card data"
            git push
          fi
