name: デュエマカード読みルビ再照合

on:
  workflow_dispatch:
  schedule:
    - cron: "15 19 * * *"
  push:
    paths:
      - "ruby_update.py"
      - "merge_ruby_updates.py"
      - ".github/workflows/update-ruby.yml"

permissions:
  contents: write

concurrency:
  group: duelmasters-ruby-update
  cancel-in-progress: false

jobs:
  update-ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install requests beautifulsoup4 playwright pykakasi
      - name: Recheck card ruby
        env:
          PYTHONUNBUFFERED: "1"
        run: python ruby_update.py
      - name: Merge ruby updates and commit safely
        run: |
          cp data/cards.json /tmp/ruby_updated_cards.json
          cp data/ruby_recheck_cursor.json /tmp/ruby_recheck_cursor.json 2>/dev/null || true
          cp data/ruby_recheck_started /tmp/ruby_recheck_started 2>/dev/null || true
          cp data/ruby_recheck_stats.json /tmp/ruby_recheck_stats.json 2>/dev/null || true

          for attempt in 1 2 3 4 5; do
            echo "最新mainへルビ情報を統合: 試行 $attempt"
            git fetch origin main
            git reset --hard origin/main

            if [ -f /tmp/ruby_recheck_cursor.json ]; then
              mkdir -p data
              cp /tmp/ruby_recheck_cursor.json data/ruby_recheck_cursor.json
            fi
            if [ -f /tmp/ruby_recheck_started ]; then
              mkdir -p data
              cp /tmp/ruby_recheck_started data/ruby_recheck_started
            fi
            if [ -f /tmp/ruby_recheck_stats.json ]; then
              mkdir -p data
              cp /tmp/ruby_recheck_stats.json data/ruby_recheck_stats.json
            fi

            python merge_ruby_updates.py /tmp/ruby_updated_cards.json data/cards.json
            git add data/cards.json data/ruby_recheck_cursor.json data/ruby_recheck_started data/ruby_recheck_stats.json

            if git diff --cached --quiet; then
              echo "ルビに変更なし"
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "自動更新: カード名ルビ再照合"

            if git push origin HEAD:main; then
              echo "ルビ更新をmainへ保存しました"
              exit 0
            fi
            echo "push競合。最新mainから統合し直します: $attempt"
            sleep 3
          done

          echo "5回再試行してもpushできませんでした"
          exit 1
