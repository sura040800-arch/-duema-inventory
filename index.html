<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<title>デュエマ コレクション</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#eef0f2;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif
}

body{
  overflow-x:hidden
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

.hidden{
  display:none!important
}

/* =========================
   通常画面
========================= */

header{
  background:#11151b;
  color:#fff;
  padding:7px 10px;
  position:sticky;
  top:0;
  z-index:30
}

h1{
  font-size:14px;
  line-height:1;
  margin:0 0 6px;
  font-weight:800
}

.headrow{
  display:flex;
  gap:6px
}

.search{
  flex:1;
  min-width:0;
  border:0;
  border-radius:9px;
  padding:8px 10px;
  background:#fff;
  color:#111
}

.settingsBtn{
  width:38px;
  border:0;
  border-radius:9px;
  background:#e7e9ec;
  color:#111;
  font-size:18px
}

main{
  max-width:760px;
  margin:auto
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5px;
  padding:7px;
  background:#eef0f2
}

.tab{
  border:0;
  border-radius:9px;
  padding:9px 4px;
  background:#dfe3e7;
  color:#111;
  font-weight:800;
  font-size:12px
}

.tab.active{
  background:#11151b;
  color:#fff
}

.status{
  font-size:11px;
  color:#6b7280;
  padding:3px 9px 7px
}

.inventory{
  padding:0 8px 15px
}

.cardList{
  display:grid;
  gap:7px
}

.card{
  display:flex;
  align-items:center;
  gap:9px;
  background:#fff;
  border-radius:12px;
  padding:8px;
  box-shadow:0 1px 6px #0000000d;
  position:relative
}

.card-img{
  width:66px;
  height:92px;
  object-fit:contain;
  background:#eee;
  border-radius:5px;
  flex:none
}

.card-info{
  min-width:0;
  flex:1
}

.card h3{
  font-size:14px;
  margin:0 0 3px;
  line-height:1.25
}

.card-number{
  font-size:10px;
  color:#6b7280;
  margin-bottom:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.meta,.small{
  font-size:10px;
  color:#6b7280;
  line-height:1.45
}

.qty{
  display:flex;
  align-items:center;
  gap:3px;
  flex:none
}

.qty button{
  width:33px;
  height:33px;
  border:0;
  border-radius:8px;
  background:#e5e7eb;
  font-size:20px;
  color:#1677e8
}

.qty b{
  min-width:20px;
  text-align:center
}

.fav{
  position:absolute;
  right:5px;
  top:4px;
  width:29px;
  height:29px;
  border:0;
  border-radius:50%;
  background:#ffffffdd;
  font-size:19px
}

/* =========================
   デッキ画面
========================= */

#deckView{
  min-height:calc(100vh - 80px)
}

.deckShell{
  background:#e8eaec;
  min-height:calc(100vh - 80px);
  padding-bottom:80px
}

/* 上部 */
.deckHeader{
  background:#070a0f;
  color:#fff;
  padding:8px 8px 0;
  position:sticky;
  top:0;
  z-index:20
}

.deckHeaderRow{
  display:flex;
  align-items:center;
  gap:6px;
  height:35px
}

.deckIconBtn{
  width:35px;
  height:35px;
  border:0;
  border-radius:7px;
  background:#20252c;
  color:#fff;
  font-size:24px;
  flex:none
}

.deckTitle{
  font-size:15px;
  font-weight:900;
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.deckHeaderBtn{
  border:0;
  background:transparent;
  color:#fff;
  font-weight:800;
  font-size:12px;
  padding:7px 5px
}

/* メイン/GR/超次元 */
.deckCounts{
  display:flex;
  gap:3px;
  margin-top:6px
}

.deckCountTab{
  flex:1;
  border:0;
  border-radius:7px 7px 0 0;
  padding:9px 3px 8px;
  background:#dce0e4;
  color:#111;
  font-size:12px;
  font-weight:900
}

.deckCountTab.active{
  background:#fff
}

.deckCountTab small{
  font-size:10px;
  font-weight:700
}

/* フォーマット */
.deckToolbar{
  display:flex;
  gap:6px;
  padding:6px;
  background:#fff;
  border-bottom:1px solid #d5d8dc;
  position:sticky;
  top:91px;
  z-index:15
}

.formatBtn{
  border:1px solid #cbd0d5;
  background:#fff;
  border-radius:8px;
  padding:6px 9px;
  font-size:11px;
  font-weight:800
}

.formatBtn.active{
  background:#11151b;
  color:#fff
}

.analyzeBtn{
  margin-left:auto;
  border:0;
  border-radius:8px;
  background:#3ba9ca;
  color:#fff;
  padding:6px 11px;
  font-size:11px;
  font-weight:800
}

/* =========================
   デッキ内カード
========================= */

.deckArea{
  background:#fff;
  padding:7px 8px 10px;
  border-bottom:5px solid #d4d7da;
  overflow:hidden
}

.deckSectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:2px 3px 6px;
  font-size:11px;
  font-weight:900
}

.deckHint{
  font-size:9px;
  color:#8a9198;
  font-weight:500
}

/*
  ★重要
  画面端からカードを離す
*/
.cardGrid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:4px;
  padding:0 2px
}

.deckTile{
  position:relative;
  min-width:0;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  border-radius:4px;
  overflow:visible
}

.deckTile img{
  display:block;
  width:100%;
  aspect-ratio:.68;
  object-fit:cover;
  border-radius:4px;
  background:#ddd;
  box-shadow:0 1px 3px #0004;
  pointer-events:none
}

/* 画像がないカード */
.deckTile.noImage{
  background:#dfe2e5;
  aspect-ratio:.68;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  box-shadow:0 1px 3px #0003
}

.deckTile.noImage::after{
  content:"画像なし";
  color:#858c93;
  font-size:9px;
  font-weight:700
}

.deckTile.noImage img{
  display:none
}

.deckTile .num{
  position:absolute;
  right:2px;
  bottom:2px;
  min-width:19px;
  height:19px;
  border-radius:10px;
  background:#111e;
  color:#fff;
  font-size:10px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 4px;
  pointer-events:none
}

/* スワイプ中 */
.deckTile.swiping{
  opacity:.75;
  transform:scale(.96);
  transition:transform .08s,opacity .08s
}

.emptyDeck{
  padding:28px 10px;
  text-align:center;
  color:#8b9299;
  font-size:12px
}

.swipeNote{
  background:#11151b;
  color:#fff;
  padding:6px 8px;
  text-align:center;
  font-size:9px
}

/* =========================
   絞り込み
========================= */

.sectionSwitch{
  display:flex;
  gap:4px;
  padding:5px;
  background:#edf0f2
}

.sectionSwitch button{
  flex:1;
  border:0;
  border-radius:7px;
  background:#d8dde1;
  padding:7px 2px;
  font-size:10px;
  font-weight:900
}

.sectionSwitch button.active{
  background:#11151b;
  color:#fff
}

/* =========================
   カード検索
========================= */

.picker{
  padding:7px 7px 0
}

.pickerSearch{
  display:flex;
  gap:5px
}

.pickerSearch input{
  flex:1;
  min-width:0;
  border:0;
  border-radius:9px;
  padding:10px 11px;
  background:#fff;
  box-shadow:0 1px 4px #0001
}

.pickerSearch button{
  width:42px;
  border:0;
  border-radius:9px;
  background:#3ba9ca;
  color:#fff;
  font-size:18px
}

.pickerFilters{
  display:flex;
  gap:5px;
  overflow:auto;
  padding:6px 0
}

.chip{
  white-space:nowrap;
  border:0;
  border-radius:999px;
  background:#d9dde1;
  padding:6px 9px;
  font-size:10px;
  font-weight:800
}

.chip.active{
  background:#11151b;
  color:#fff
}

.pickerGrid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:4px;
  padding:0 2px 10px
}

.pickTile{
  position:relative;
  touch-action:manipulation
}

.pickTile img{
  display:block;
  width:100%;
  aspect-ratio:.68;
  object-fit:cover;
  border-radius:3px;
  background:#ddd
}

.pickTile.noImage{
  aspect-ratio:.68;
  background:#dfe2e5;
  border-radius:3px;
  display:flex;
  align-items:center;
  justify-content:center
}

.pickTile.noImage::after{
  content:"画像なし";
  color:#858c93;
  font-size:9px;
  font-weight:700
}

.pickTile.noImage img{
  display:none
}

.pickTile .owned{
  position:absolute;
  left:2px;
  bottom:2px;
  background:#111d;
  color:#fff;
  border-radius:8px;
  padding:2px 4px;
  font-size:8px;
  font-weight:800
}

.pickTile .plus{
  position:absolute;
  right:2px;
  top:2px;
  background:#18a05e;
  color:#fff;
  width:22px;
  height:22px;
  border:0;
  border-radius:50%;
  font-size:14px;
  line-height:22px;
  padding:0;
  z-index:2
}

.pickerStatus{
  font-size:9px;
  color:#777;
  padding:0 2px 5px
}

/* =========================
   デッキ一覧
========================= */

.deckList{
  padding:9px
}

.deckListTop{
  background:#fff;
  border-radius:12px;
  padding:10px;
  margin-bottom:8px
}

.btn{
  border:0;
  border-radius:9px;
  background:#11151b;
  color:#fff;
  padding:9px 11px;
  font-weight:800
}

.deckItem{
  background:#fff;
  border-radius:12px;
  padding:11px;
  margin-bottom:8px;
  box-shadow:0 1px 5px #0001
}

.deckItemRow{
  display:flex;
  align-items:center;
  gap:7px
}

.deckItemName{
  font-weight:900;
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.deckItemCount{
  font-size:11px;
  color:#687078
}

.deckItemActions{
  display:flex;
  gap:5px;
  margin-top:8px
}

.deckItemActions button{
  flex:1
}

/* =========================
   シート
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  display:none;
  align-items:flex-end
}

.overlay.open{
  display:flex
}

.sheet{
  width:100%;
  max-height:88vh;
  overflow:auto;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:16px 14px calc(22px + env(safe-area-inset-bottom))
}

.sheetHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px
}

.sheetHead h2{
  font-size:18px;
  margin:0
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#eef0f2;
  font-size:20px
}

.field{
  margin:12px 0
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:5px
}

.field select,
.field input{
  width:100%;
  padding:10px;
  border:1px solid #d0d4d8;
  border-radius:9px;
  background:#fff
}

.checkrow{
  display:flex;
  gap:8px;
  align-items:center;
  padding:8px 0;
  font-size:12px
}

.sheetActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:14px
}

.sheetActions button{
  border:0;
  border-radius:10px;
  padding:11px;
  font-weight:800
}

.apply{
  background:#11151b;
  color:#fff
}

.reset{
  background:#e5e7eb
}

.analysisGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.analysisBox{
  background:#f1f3f4;
  border-radius:10px;
  padding:10px
}

.analysisBox b{
  display:block;
  font-size:18px
}

.analysisBox span{
  font-size:10px;
  color:#687078
}

.colorRow{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px
}

.colorTag{
  padding:5px 8px;
  border-radius:999px;
  background:#fff;
  border:1px solid #ddd;
  font-size:10px
}

@media(min-width:600px){

.cardGrid,
.pickerGrid{
  grid-template-columns:repeat(8,minmax(0,1fr))
}

}
</style>
</head>

<body>

<header id="mainHeader">

<h1>デュエマ コレクション</h1>

<div class="headrow">

<input
id="search"
class="search"
placeholder="カード名・番号・種族で検索">

<button
id="settings"
class="settingsBtn">
⚙️
</button>

</div>

</header>

<main>

<div class="tabs" id="mainTabs">

<button class="tab active" id="invTab">
📦 所持カード
</button>

<button class="tab" id="favTab">
⭐ お気に入り
</button>

<button class="tab" id="deckTab">
🃏 デッキ
</button>

</div>

<div id="invView" class="inventory">

<div class="status" id="status">
カードデータを読み込み中…
</div>

<div id="cards" class="cardList"></div>

</div>

<div id="favView" class="inventory hidden">

<div class="status" id="favStatus"></div>

<div id="favorites" class="cardList"></div>

</div>

<div id="deckView" class="hidden">

<div id="deckListView"></div>

<div id="deckEditorView" class="hidden"></div>

</div>

</main>


<!-- 設定 -->

<div class="overlay" id="overlay">

<div class="sheet">

<div class="sheetHead">

<h2>⚙️ 絞り込み・並び替え</h2>

<button
class="close"
id="closeSettings">
×
</button>

</div>

<div class="field">

<label>並び順</label>

<select id="sort">

<option value="default">
おすすめ順
</option>

<option value="name">
名前順
</option>

<option value="cost">
コスト順
</option>

<option value="power">
パワー順
</option>

<option value="civilization">
文明順
</option>

<option value="race">
種族順
</option>

<option value="rarity">
レアリティ順
</option>

<option value="number">
カード番号順
</option>

</select>

</div>

<div class="field">

<label>文明</label>

<select id="civilization">

<option value="">
すべて
</option>

</select>

</div>

<div class="field">

<label>種族</label>

<input
id="raceFilter"
list="raceList"
placeholder="例：ドラゴン">

<datalist id="raceList"></datalist>

</div>

<div class="field">

<label>カードタイプ</label>

<select id="type">

<option value="">
すべて
</option>

</select>

</div>

<div class="field">

<label>レアリティ</label>

<select id="rarity">

<option value="">
すべて
</option>

</select>

</div>

<label class="checkrow">

<input
type="checkbox"
id="ownedOnly">

所持カードだけ表示

</label>

<label class="checkrow">

<input
type="checkbox"
id="unownedOnly">

未所持カードだけ表示

</label>

<div class="sheetActions">

<button
class="reset"
id="resetSettings">
リセット
</button>

<button
class="apply"
id="applySettings">
適用
</button>

</div>

</div>

</div>


<!-- 分析 -->

<div
class="overlay"
id="analysisOverlay">

<div class="sheet">

<div class="sheetHead">

<h2>📊 デッキ分析</h2>

<button
class="close"
id="closeAnalysis">
×
</button>

</div>

<div id="analysisContent"></div>

</div>

</div>


<script>

/* =========================
   状態
========================= */

const state={

cards:[],

owned:
JSON.parse(
localStorage.getItem('duema_owned_v3')||'{}'
),

favorites:
JSON.parse(
localStorage.getItem('duema_favorites_v1')||'{}'
),

decks:
JSON.parse(
localStorage.getItem('duema_decks_v3')||'[]'
),

activeDeck:null,

deckSearch:'',

deckFilter:'all',

deckSection:'main'

};

const setting={

sort:'default',

civilization:'',

race:'',

type:'',

rarity:'',

ownedOnly:false,

unownedOnly:false

};

const $=id=>
document.getElementById(id);

const esc=s=>
String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);

const faces=c=>
Array.isArray(c.sides)&&c.sides.length
?c.sides
:[c];

function values(c,key){

return faces(c).flatMap(f=>{

let v=f[key];

if(
v===undefined||
v===null||
v===''
)
return [];

return Array.isArray(v)
?v
:[v];

}).map(String);

}

function splitValues(v){

return String(v||'')
.split(/[／\/・,、]+/)
.map(s=>s.trim())
.filter(Boolean);

}

function civilizations(c){

return [
...new Set(
values(c,'civilization')
.flatMap(splitValues)
)
];

}

function races(c){

return [
...new Set(
values(c,'race')
.flatMap(splitValues)
)
];

}

function types(c){

return [
...new Set(
values(c,'type')
.flatMap(splitValues)
)
];

}

function rarities(c){

return [
...new Set(
values(c,'rarity')
)
];

}

function firstValue(c,key){

return values(c,key)[0]||'';

}

function cardName(c){

return c.name||
c._name||
c.cardName||
'';

}

function cardNumber(c){

return c.number||
c.id||
'';

}

function idOf(c){

return c.id||
c.number||
'';

}

/*
  公式画像URL
*/

function cardImage(c){

const id=idOf(c);

return id
?
'https://dm.takaratomy.co.jp/wp-content/card/cardimage/'
+encodeURIComponent(id)+'.jpg'
:'';

}

function searchText(c){

return [

cardName(c),

cardNumber(c),

...civilizations(c),

...races(c),

...types(c),

...rarities(c)

]
.join(' ')
.toLowerCase();

}

function costNum(c){

const n=parseInt(
firstValue(c,'cost'),
10
);

return Number.isFinite(n)
?n
:999;

}

function powerNum(c){

const s=
firstValue(c,'power')
.replace(/[^0-9]/g,'');

const n=Number(s);

return Number.isFinite(n)
?n
:-1;

}

function civRank(c){

const o=[
'光',
'水',
'闇',
'火',
'自然',
'ゼロ'
];

const xs=
civilizations(c);

const i=
o.indexOf(xs[0]);

return i<0
?99
:i;

}

function save(){

localStorage.setItem(
'duema_owned_v3',
JSON.stringify(state.owned)
);

localStorage.setItem(
'duema_favorites_v1',
JSON.stringify(state.favorites)
);

localStorage.setItem(
'duema_decks_v3',
JSON.stringify(state.decks)
);

}

function isFav(c){

return !!state.favorites[idOf(c)];

}

function toggleFav(id){

state.favorites[id]=
!state.favorites[id];

if(!state.favorites[id])
delete state.favorites[id];

save();

renderCurrent();

}


/* =========================
   所持カード
========================= */

function filteredCards(
base=state.cards
){

const q=
$('search')
.value
.trim()
.toLowerCase();

let list=
base.filter(c=>{

if(
q &&
!searchText(c).includes(q)
)
return false;

if(
setting.civilization &&
!civilizations(c).some(
x=>x===setting.civilization
)
)
return false;

if(
setting.race &&
!races(c).some(
x=>x
.toLowerCase()
.includes(setting.race)
)
)
return false;

if(
setting.type &&
!types(c).some(
x=>x===setting.type
)
)
return false;

if(
setting.rarity &&
!rarities(c).some(
x=>x===setting.rarity
)
)
return false;

const n=
state.owned[idOf(c)]||0;

if(
setting.ownedOnly &&
n<=0
)
return false;

if(
setting.unownedOnly &&
n>0
)
return false;

return true;

});

list.sort((a,b)=>{

switch(setting.sort){

case'name':
return cardName(a)
.localeCompare(
cardName(b),
'ja'
);

case'cost':
return costNum(a)-costNum(b)||
cardName(a)
.localeCompare(
cardName(b),
'ja'
);

case'power':
return powerNum(a)-powerNum(b)||
cardName(a)
.localeCompare(
cardName(b),
'ja'
);

case'civilization':
return civRank(a)-civRank(b)||
civilizations(a)
.join()
.localeCompare(
civilizations(b)
.join(),
'ja'
);

case'race':
return races(a)
.join()
.localeCompare(
races(b)
.join(),
'ja'
);

case'rarity':
return rarities(a)
.join()
.localeCompare(
rarities(b)
.join(),
'ja'
);

case'number':
return cardNumber(a)
.localeCompare(
cardNumber(b),
'ja'
);

default:
return 0;

}

});

return list;

}

/* =========================
   改良版スワイプ
========================= */

let startX=0;
let startY=0;
let currentX=0;
let swiping=false;

$('deckEditorView')
.querySelectorAll('[data-swipe-id]')
.forEach(tile=>{

tile.addEventListener(
'touchstart',
e=>{

if(!e.touches.length)
return;

startX=
e.touches[0].clientX;

startY=
e.touches[0].clientY;

currentX=
startX;

swiping=false;

},
{
passive:true
}
);


tile.addEventListener(
'touchmove',
e=>{

if(!e.touches.length)
return;

currentX=
e.touches[0].clientX;

const currentY=
e.touches[0].clientY;

const dx=
currentX-startX;

const dy=
currentY-startY;

if(
Math.abs(dx)>12 &&
Math.abs(dx)>Math.abs(dy)
){

swiping=true;

tile.classList.add(
'swiping'
);

}

},
{
passive:true
}
);


tile.addEventListener(
'touchend',
e=>{

const dx=
currentX-startX;

const dy=
e.changedTouches[0].clientY-startY;

tile.classList.remove(
'swiping'
);

if(
Math.abs(dx)>=45 &&
Math.abs(dx)>Math.abs(dy)
){

/*
右 = ＋
左 = −
*/

changeDeckQty(
tile.dataset.swipeId,
dx>0?1:-1
);

}

startX=0;
startY=0;
currentX=0;
swiping=false;

},
{
passive:true
}
);


/* タップ */

tile.addEventListener(
'click',
()=>{

if(!swiping){

openCardDetail(
tile.dataset.swipeId
);

}

}
);

});

}

function addToDeck(id){

const d=
state.decks[state.activeDeck];

ensureDeck(d);

const a=
arrForSection(d);

const max=
maxForSection();

if(
totalArr(a)>=max
){

alert(
`${sectionLabel()}は${max}枚までです。`
);

return;

}

const x=
a.find(
x=>x.id===id
);

if(x){

if(
state.deckSection==='main' &&
x.need>=4
){

alert(
'同じカードは通常4枚までです。'
);

return;

}

x.need++;

}else{

a.push({
id:id,
need:1
});

}

save();

renderDeckEditor();

}


/* =========================
   枚数変更
========================= */

function changeDeckQty(
id,
delta
){

const d=
state.decks[state.activeDeck];

ensureDeck(d);

const a=
arrForSection(d);

const x=
a.find(
x=>x.id===id
);

if(!x)
return;

if(
delta>0 &&
state.deckSection==='main' &&
x.need>=4
){

alert(
'同じカードは通常4枚までです。'
);

return;

}

if(
delta>0 &&
totalArr(a)>=maxForSection()
)
return;

x.need+=delta;

if(x.need<=0){

const i=
a.indexOf(x);

a.splice(i,1);

}

save();

renderDeckEditor();

}

src="${cardImage(c)}"
style="
display:block;
width:min(62vw,260px);
max-height:58vh;
object-fit:contain;
margin:0 auto 10px;
border-radius:7px
"
referrerpolicy="no-referrer"
onerror="this.style.visibility='hidden'">

<div
style="
text-align:center;
color:#666;
font-size:11px;
margin-bottom:10px
">

${esc(cardNumber(c))}

<br>

${esc(
civilizations(c).join(' / ')
)}

　

${esc(
races(c).join(' / ')
)}

</div>

<div
style="
display:flex;
align-items:center;
justify-content:center;
gap:12px
">

<button
class="btn"
id="detailMinus">
−
</button>

<b style="font-size:20px">
${n}
</b>

<button
class="btn"
id="detailPlus">
＋
</button>

</div>

</div>

`;

$('analysisOverlay')
.classList
.add('open');

$('closeAnalysis').onclick=()=>
$('analysisOverlay')
.classList
.remove('open');

$('detailMinus').onclick=()=>{

changeDeckQty(
id,
-1
);

$('analysisOverlay')
.classList
.remove('open');

};

$('detailPlus').onclick=()=>{

addToDeck(id);

$('analysisOverlay')
.classList
.remove('open');

};

}


/* =========================
   分析
========================= */

function openAnalysis(d){

ensureDeck(d);

const all=[
...d.cards,
...d.gr,
...d.extra
];

const cost={};

const civ={};

all.forEach(x=>{

const c=
deckCard(x.id);

if(!c)
return;

const n=
x.need||0;

const k=
firstValue(c,'cost')||'?';

cost[k]=
(cost[k]||0)+n;

});

d.cards.forEach(x=>{

const c=
deckCard(x.id);

if(!c)
return;

civilizations(c)
.forEach(v=>{

civ[v]=
(civ[v]||0)+
(x.need||0);

});

});

$('analysisContent').innerHTML=`

<div class="analysisGrid">

<div class="analysisBox">

<b>
${deckTotal(d)}
</b>

<span>
メイン枚数
</span>

</div>

<div class="analysisBox">

<b>
${totalArr(d.gr)}
</b>

<span>
超GR
</span>

</div>

<div class="analysisBox">

<b>
${totalArr(d.extra)}
</b>

<span>
超次元
</span>

</div>

<div class="analysisBox">

<b>
${
[
...d.cards,
...d.gr,
...d.extra
].length
}
</b>

<span>
採用種類
</span>

</div>

</div>


<div class="field">

<label>
文明
</label>

<div class="colorRow">

${
Object.entries(civ)
.map(
([k,v])=>
`
<span class="colorTag">
${esc(k)} ${v}
</span>
`
)
.join('')
||
'なし'
}

</div>

</div>


<div class="field">

<label>
コスト分布
</label>

<div class="colorRow">

${
Object.entries(cost)
.sort(
(a,b)=>
(+a[0])-(+b[0])
)
.map(
([k,v])=>
`
<span class="colorTag">
コスト${esc(k)}：${v}
</span>
`
)
.join('')
||
'なし'
}

</div>

</div>

`;

$('analysisOverlay')
.classList
.add('open');

$('closeAnalysis').onclick=()=>
$('analysisOverlay')
.classList
.remove('open');

}


/* =========================
   デッキ一覧クリック
========================= */

$('deckListView')
.addEventListener(
'click',
e=>{

const o=
e.target.dataset.openDeck;

const d=
e.target.dataset.deleteDeck;

if(
o!==undefined
){

state.activeDeck=
+o;

state.deckSearch='';

state.deckFilter=
'all';

state.deckSection=
'main';

renderDeckEditor();

}

if(
d!==undefined &&
confirm(
'このデッキを削除しますか？'
)
){

state.decks.splice(
+d,
1
);

save();

renderDeckList();

}

});


/* =========================
   データ読み込み
========================= */

async function load(){

try{

const r=
await fetch(
'data/cards.json?'+Date.now()
);

if(!r.ok)
throw new Error('load');

state.cards=
await r.json();

fillSettings();

$('status').textContent=
`カード ${state.cards.length.toLocaleString()} 枚を読み込みました`;

renderCards();

renderFavorites();

renderDeckList();

}catch(e){

$('status').textContent=
'カードデータを読み込めません。GitHub Actionsの更新完了後に再読み込みしてください。';

}

}

load();

</script>

</html>
