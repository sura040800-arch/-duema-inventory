<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>デュエマ コレクション</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#f3f4f6;
  color:#111827;
}

button,input,select{font:inherit}
button{cursor:pointer}

header{
  background:#111827;
  color:#fff;
  padding:6px 10px;
  position:sticky;
  top:0;
  z-index:30;
}

h1{
  font-size:14px;
  line-height:1;
  margin:0 0 6px;
  font-weight:800;
}

.headrow{
  display:flex;
  gap:6px;
}

.search{
  flex:1;
  min-width:0;
  padding:8px 10px;
  border:0;
  border-radius:9px;
  background:#fff;
  color:#111827;
}

.settingsBtn{
  width:38px;
  border:0;
  border-radius:9px;
  background:#e5e7eb;
  color:#111827;
  font-size:18px;
}

main{
  max-width:760px;
  margin:auto;
  padding:9px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-bottom:9px;
}

.tab{
  padding:10px 4px;
  border:0;
  border-radius:11px;
  background:#e5e7eb;
  font-weight:700;
  color:#111827;
  font-size:13px;
}

.tab.active{
  background:#111827;
  color:#fff;
}

.status{
  font-size:12px;
  color:#6b7280;
  margin:7px 5px 10px;
}

/* カード一覧 */

.cardwrap{
  position:relative;
}

.card{
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
  border-radius:14px;
  padding:9px;
  margin:8px 0;
  box-shadow:0 2px 8px #00000010;
  min-height:120px;
}

.card-img{
  flex:none;
  width:70px;
  height:98px;
  object-fit:contain;
  border-radius:6px;
  background:#eee;
}

.card-info{
  flex:1;
  min-width:0;
}

.card h3{
  margin:0 0 4px;
  font-size:16px;
  line-height:1.3;
}

.card-number{
  display:inline-block;
  background:#eef0f3;
  color:#6b7280;
  border-radius:7px;
  padding:3px 6px;
  font-size:11px;
  margin-bottom:4px;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.meta{
  font-size:12px;
  color:#6b7280;
  line-height:1.55;
}

.small{
  font-size:11px;
  color:#6b7280;
}

.qty{
  flex:none;
  display:flex;
  align-items:center;
  gap:3px;
}

.qty button{
  width:36px;
  height:36px;
  border:0;
  border-radius:10px;
  background:#e5e7eb;
  color:#1677e8;
  font-size:22px;
}

.qty b{
  min-width:23px;
  text-align:center;
  font-size:17px;
}

.fav{
  position:absolute;
  right:7px;
  top:6px;
  border:0;
  background:#fff9;
  border-radius:50%;
  width:32px;
  height:32px;
  font-size:20px;
}

/* 共通 */

.empty{
  background:#fff;
  border-radius:14px;
  padding:22px;
  text-align:center;
  color:#6b7280;
}

.hidden{
  display:none;
}

.btn{
  border:0;
  border-radius:10px;
  padding:9px 11px;
  background:#111827;
  color:#fff;
}

.btn.secondary{
  background:#e5e7eb;
  color:#111827;
}

.btn.danger{
  background:#fee2e2;
  color:#b91c1c;
}

/* デッキ一覧 */

.decklist{
  display:grid;
  gap:8px;
}

.deck{
  background:#fff;
  border-radius:14px;
  padding:12px;
  box-shadow:0 2px 8px #00000010;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
}

.deckActions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.deckActions .btn{
  flex:1;
}

.deckCount{
  font-size:12px;
  color:#6b7280;
  margin-top:4px;
}

/* デッキ作成 */

.deckEditor{
  background:#fff;
  border-radius:14px;
  padding:10px;
}

.deckTop{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:8px;
}

.deckTop button{
  flex:none;
}

.deckName{
  font-weight:800;
  font-size:17px;
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.deckTotal{
  font-size:12px;
  font-weight:800;
  color:#6b7280;
  white-space:nowrap;
}

.deckSummary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin:7px 0;
}

.sumBox{
  background:#f3f4f6;
  border-radius:9px;
  padding:7px;
  text-align:center;
}

.sumBox b{
  display:block;
  font-size:15px;
}

.sumBox span{
  font-size:10px;
  color:#6b7280;
}

.deckSearch{
  display:flex;
  gap:6px;
  margin-bottom:7px;
}

.deckSearch input{
  flex:1;
  min-width:0;
  padding:9px;
  border:1px solid #d1d5db;
  border-radius:9px;
}

.deckFilters{
  display:flex;
  gap:5px;
  overflow:auto;
  padding-bottom:5px;
  margin-bottom:7px;
}

.chip{
  white-space:nowrap;
  border:0;
  border-radius:999px;
  padding:6px 9px;
  background:#e5e7eb;
  font-size:11px;
}

.chip.active{
  background:#111827;
  color:#fff;
}

.sectionTabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin:7px 0;
}

.sectionTab{
  border:0;
  border-radius:9px;
  padding:8px 3px;
  background:#eef0f3;
  font-size:11px;
  font-weight:700;
}

.sectionTab.active{
  background:#111827;
  color:#fff;
}

.deckCards{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}

.miniCard{
  display:flex;
  gap:7px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:6px;
  min-width:0;
}

.miniCard img{
  width:42px;
  height:59px;
  object-fit:contain;
  border-radius:4px;
  background:#eee;
  flex:none;
}

.miniInfo{
  min-width:0;
  flex:1;
}

.miniInfo b{
  display:block;
  font-size:12px;
  line-height:1.25;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.miniInfo .small{
  display:block;
  margin-top:2px;
}

.miniAdd{
  margin-top:4px;
  width:100%;
  border:0;
  border-radius:7px;
  background:#111827;
  color:#fff;
  padding:5px;
  font-size:11px;
}

.deckSection{
  margin-top:10px;
}

.deckSection h3{
  font-size:13px;
  margin:8px 2px;
}

.deckRow{
  display:flex;
  align-items:center;
  gap:8px;
  background:#f9fafb;
  border-radius:10px;
  padding:6px;
  margin:5px 0;
}

.deckRow img{
  width:38px;
  height:53px;
  object-fit:contain;
  flex:none;
}

.deckRow .info{
  flex:1;
  min-width:0;
}

.deckRow .name{
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.deckRow .sub{
  font-size:10px;
  color:#6b7280;
}

.deckQty{
  display:flex;
  align-items:center;
  gap:3px;
}

.deckQty button{
  width:28px;
  height:28px;
  border:0;
  border-radius:7px;
  background:#e5e7eb;
}

.backBtn{
  background:#e5e7eb;
  color:#111827;
}

/* 設定 */

.overlay{
  position:fixed;
  inset:0;
  background:#0006;
  z-index:50;
  display:none;
  align-items:flex-end;
}

.overlay.open{
  display:flex;
}

.sheet{
  width:100%;
  max-height:88vh;
  overflow:auto;
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:18px 16px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 20px #0002;
}

.sheetHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.sheetHead h2{
  margin:0;
  font-size:19px;
}

.close{
  border:0;
  background:#eef0f3;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:20px;
}

.field{
  margin:13px 0;
}

.field label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin-bottom:6px;
}

.field select,
.field input{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:10px;
  background:#fff;
}

.checkrow{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 0;
}

.checkrow input{
  width:19px;
  height:19px;
}

.sheetActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:16px;
}

.sheetActions button{
  padding:12px;
  border:0;
  border-radius:11px;
  font-weight:700;
}

.apply{
  background:#111827;
  color:#fff;
}

.reset{
  background:#e5e7eb;
  color:#111827;
}

@media(max-width:430px){

  .card{
    gap:8px;
    padding:8px;
    min-height:116px;
  }

  .card-img{
    width:64px;
    height:90px;
  }

  .card h3{
    font-size:15px;
  }

  .qty button{
    width:34px;
    height:34px;
  }

  .deckCards{
    grid-template-columns:1fr;
  }

  .tabs{
    gap:5px;
  }
}
</style>
</head>

<body>

<header>
  <h1>デュエマ コレクション</h1>

  <div class="headrow">
    <input
      id="search"
      class="search"
      placeholder="カード名・番号・種族で検索"
    >

    <button id="settings" class="settingsBtn">⚙️</button>
  </div>
</header>

<main>

  <div class="tabs">

    <button class="tab active" id="invTab">
      📦 所持カード
    </button>

    <button class="tab" id="favTab">
      ⭐ お気に入り
    </button>

    <button class="tab" id="deckTab">
      🃏 デッキ
    </button>

  </div>

  <div id="invView">

    <div class="status" id="status">
      カードデータを読み込み中…
    </div>

    <div id="cards"></div>

  </div>

  <div id="favView" class="hidden">

    <div class="status" id="favStatus"></div>

    <div id="favorites"></div>

  </div>

  <div id="deckView" class="hidden">

    <div id="deckListView"></div>

    <div id="deckEditorView" class="hidden"></div>

  </div>

</main>


<!-- 設定 -->

<div class="overlay" id="overlay">

  <div class="sheet">

    <div class="sheetHead">

      <h2>⚙️ 絞り込み・並び替え</h2>

      <button class="close" id="closeSettings">
        ×
      </button>

    </div>


    <div class="field">

      <label>並び順</label>

      <select id="sort">

        <option value="default">おすすめ順</option>

        <option value="name">名前順</option>

        <option value="cost">コスト順</option>

        <option value="power">パワー順</option>

        <option value="civilization">文明順</option>

        <option value="race">種族順</option>

        <option value="rarity">レアリティ順</option>

        <option value="number">カード番号順</option>

      </select>

    </div>


    <div class="field">

      <label>文明</label>

      <select id="civilization">

        <option value="">すべて</option>

      </select>

    </div>


    <div class="field">

      <label>種族</label>

      <input
        id="raceFilter"
        list="raceList"
        placeholder="例：ドラゴン"
      >

      <datalist id="raceList"></datalist>

    </div>


    <div class="field">

      <label>カードタイプ</label>

      <select id="type">

        <option value="">すべて</option>

      </select>

    </div>


    <div class="field">

      <label>レアリティ</label>

      <select id="rarity">

        <option value="">すべて</option>

      </select>

    </div>


    <label class="checkrow">

      <input type="checkbox" id="ownedOnly">

      所持カードだけ表示

    </label>


    <label class="checkrow">

      <input type="checkbox" id="unownedOnly">

      未所持カードだけ表示

    </label>


    <div class="sheetActions">

      <button class="reset" id="resetSettings">
        リセット
      </button>

      <button class="apply" id="applySettings">
        適用
      </button>

    </div>

  </div>

</div>


<script>

const state={

  cards:[],

  owned:JSON.parse(
    localStorage.getItem('duema_owned_v3')||'{}'
  ),

  favorites:JSON.parse(
    localStorage.getItem('duema_favorites_v1')||'{}'
  ),

  decks:JSON.parse(
    localStorage.getItem('duema_decks_v3')||'[]'
  ),

  activeDeck:null,

  deckSearch:'',

  deckFilter:'all',

  deckSection:'main'

};


const $=id=>document.getElementById(id);


const setting={

  sort:'default',

  civilization:'',

  race:'',

  type:'',

  rarity:'',

  ownedOnly:false,

  unownedOnly:false

};


const esc=s=>

  String(s??'').replace(

    /[&<>"']/g,

    m=>({

      '&':'&amp;',

      '<':'&lt;',

      '>':'&gt;',

      '"':'&quot;',

      "'":'&#39;'

    }[m])

  );


const faces=c=>

  Array.isArray(c.sides)&&c.sides.length

  ?c.sides

  :[c];


function values(c,key){

  return faces(c)

    .flatMap(f=>{

      let v=f[key];

      if(v===undefined||v===null||v==='')return[];

      return Array.isArray(v)?v:[v];

    })

    .map(String);

}


function splitValues(v){

  return String(v||'')

    .split(/[／\/・,、]+/)

    .map(s=>s.trim())

    .filter(Boolean);

}


function civilizations(c){

  return [

    ...new Set(

      values(c,'civilization')

      .flatMap(splitValues)

    )

  ];

}


function races(c){

  return [

    ...new Set(

      values(c,'race')

      .flatMap(splitValues)

    )

  ];

}


function types(c){

  return [

    ...new Set(

      values(c,'type')

      .flatMap(splitValues)

    )

  ];

}


function rarities(c){

  return [

    ...new Set(

      values(c,'rarity')

    )

  ];

}


function firstValue(c,key){

  return values(c,key)[0]||'';

}


function cardName(c){

  return c.name||c._name||c.cardName||'';

}


function cardNumber(c){

  return c.number||c.id||'';

}


function idOf(c){

  return c.id||c.number||'';

}


function cardImage(c){

  const id=idOf(c);

  return id

    ?'https://dm.takaratomy.co.jp/wp-content/card/cardimage/'+encodeURIComponent(id)+'.jpg'

    :'';

}


function searchText(c){

  return [

    cardName(c),

    cardNumber(c),

    ...civilizations(c),

    ...races(c),

    ...types(c),

    ...rarities(c)

  ].join(' ').toLowerCase();

}


function costNum(c){

  const n=parseInt(

    firstValue(c,'cost'),

    10

  );

  return Number.isFinite(n)?n:999;

}


function powerNum(c){

  const s=

    firstValue(c,'power')

    .replace(/[^0-9]/g,'');

  const n=Number(s);

  return Number.isFinite(n)?n:-1;

}


function civRank(c){

  const order=[

    '光',

    '水',

    '闇',

    '火',

    '自然'

  ];

  const xs=civilizations(c);

  const i=order.indexOf(xs[0]);

  return i<0?99:i;

}


function save(){

  localStorage.setItem(

    'duema_owned_v3',

    JSON.stringify(state.owned)

  );

  localStorage.setItem(

    'duema_favorites_v1',

    JSON.stringify(state.favorites)

  );

  localStorage.setItem(

    'duema_decks_v3',

    JSON.stringify(state.decks)

  );

}


function isFav(c){

  return !!state.favorites[idOf(c)];

}


function toggleFav(id){

  state.favorites[id]=!state.favorites[id];

  if(!state.favorites[id]){

    delete state.favorites[id];

  }

  save();

  renderCurrent();

}


function filteredCards(base=state.cards){

  const q=

    $('search').value.trim().toLowerCase();

  let list=base.filter(c=>{

    if(q&&!searchText(c).includes(q))

      return false;


    if(

      setting.civilization&&

      !civilizations(c).some(

        x=>x===setting.civilization

      )

    )

      return false;


    if(

      setting.race&&

      !races(c).some(

        x=>x.toLowerCase()

          .includes(setting.race)

      )

    )

      return false;


    if(

      setting.type&&

      !types(c).some(

        x=>x===setting.type

      )

    )

      return false;


    if(

      setting.rarity&&

      !rarities(c).some(

        x=>x===setting.rarity

      )

    )

      return false;


    const n=

      state.owned[idOf(c)]||0;


    if(setting.ownedOnly&&n<=0)

      return false;


    if(setting.unownedOnly&&n>0)

      return false;


    return true;

  });


  list.sort((a,b)=>{

    switch(setting.sort){

      case'name':

        return cardName(a)

          .localeCompare(

            cardName(b),

            'ja'

          );


      case'cost':

        return costNum(a)-costNum(b)||

          cardName(a).localeCompare(

            cardName(b),

            'ja'

          );


      case'power':

        return powerNum(a)-powerNum(b)||

          cardName(a).localeCompare(

            cardName(b),

            'ja'

          );


      case'civilization':

        return civRank(a)-civRank(b)||

          civilizations(a)

            .join()

            .localeCompare(

              civilizations(b).join(),

              'ja'

            );


      case'race':

        return races(a)

          .join()

          .localeCompare(

            races(b).join(),

            'ja'

          );


      case'rarity':

        return rarities(a)

          .join()

          .localeCompare(

            rarities(b).join(),

            'ja'

          );


      case'number':

        return cardNumber(a)

          .localeCompare(

            cardNumber(b),

            'ja'

          );


      default:

        return 0;

    }

  });


  return list;

}


function cardHtml(c,showQty=true){

  const id=idOf(c);

  const n=state.owned[id]||0;

  const img=cardImage(c);

  const civ=civilizations(c).join('/');

  const typ=types(c).join('/');

  const cost=firstValue(c,'cost');

  const power=firstValue(c,'power');

  const rar=rarities(c).join('/');


  return `

  <div class="cardwrap">

    <div class="card">

      <img

        class="card-img"

        src="${img}"

        alt="${esc(cardName(c))}"

        loading="lazy"

        referrerpolicy="no-referrer"

      >


      <div class="card-info">

        <h3>${esc(cardName(c))}</h3>

        <div class="card-number">

          ${esc(cardNumber(c))}

        </div>


        <div class="meta">

          ${esc(civ)}　${esc(typ)}<br>

          ${cost!==''?'コスト '+esc(cost)+'　':''}

          ${power!==''?'パワー '+esc(power)+'　':''}

          ${esc(rar)}

        </div>


        <div class="small">

          ${esc(races(c).join(' / '))}

        </div>

      </div>


      ${showQty?`

      <div class="qty">

        <button data-minus="${esc(id)}">

          −

        </button>

        <b>${n}</b>

        <button data-plus="${esc(id)}">

          ＋

        </button>

      </div>

      `:''}

    </div>


    <button

      class="fav"

      data-fav="${esc(id)}"

    >

      ${isFav(c)?'★':'☆'}

    </button>

  </div>`;

}


function renderCards(){

  const list=filteredCards();

  const total=list.length;


  $('status').textContent=

    `カード ${total.toLocaleString()} 枚を表示`+

    (total>100?'（先頭100枚）':'');


  $('cards').innerHTML=

    list.length

    ?list.slice(0,100)

      .map(c=>cardHtml(c,true))

      .join('')

    :'<div class="empty">該当するカードがありません。</div>';

}


function renderFavorites(){

  const q=

    $('search').value.trim().toLowerCase();


  const list=

    state.cards.filter(c=>

      isFav(c)&&

      (q?searchText(c).includes(q):true)

    );


  $('favStatus').textContent=

    `お気に入り ${list.length.toLocaleString()} 枚`;


  $('favorites').innerHTML=

    list.length

    ?list.map(c=>cardHtml(c,true)).join('')

    :`

    <div class="empty">

      お気に入りカードはありません。<br>

      <span class="small">

        カードの☆をタップすると追加できます。

      </span>

    </div>`;

}

  const race=[

    ...new Set(

function readTemp(){

function renderCurrent(){

    renderCards();


  if(!$('favView').classList.contains('hidden'))

  if(!$('deckView').classList.contains('hidden')){

function switchTab(tab){

  $('invView').classList.toggle(

    'hidden',

    tab!=='inv'

  );


  $('favView').classList.toggle(

    'hidden',

    tab!=='fav'

  );


  $('deckView').classList.toggle(

    'hidden',

    tab!=='deck'

  );


  $('invTab').classList.toggle(

    'active',

    tab==='inv'

  );


  $('favTab').classList.toggle(

    'active',

    tab==='fav'

  );


  $('deckTab').classList.toggle(

    'active',

    tab==='deck'

  );


  renderCurrent();

}

/* =========================
   デッキメーカー部分
========================= */


function normalizeDeck(d){

  d.cards=(d.cards||[])

    .map(x=>({

      id:x.id,

      need:Number(x.need)||0,

      section:x.section||'main'

    }))

    .filter(x=>x.need>0);


  d.cards.forEach(x=>{

    if(

      !['main','gr','extra']

      .includes(x.section)

    )

      x.section='main';

  });


  return d;

}


state.decks=

  state.decks.map(normalizeDeck);


function deckCards(d,section){

  return (d.cards||[])

    .filter(

      x=>(x.section||'main')===section

    );

}


function sectionTotal(d,section){

  return deckCards(d,section)

    .reduce(

      (s,x)=>s+x.need,

      0

    );

}


function deckTotal(d){

  return sectionTotal(d,'main');

}


function deckKinds(d,section){

  return deckCards(d,section).length;

}


function deckCard(id){

  return state.cards.find(

    c=>idOf(c)===id

  );

}


function sectionLabel(section){

  if(section==='main')

    return 'メインデッキ';

  if(section==='gr')

    return '超GR';

  return '超次元';

}


function sectionLimit(section){

  if(section==='main')

    return 40;

  if(section==='gr')

    return 12;

  return 8;

}


function renderDeckList(){

  state.activeDeck=null;

  $('deckEditorView')

    .classList.add('hidden');

  $('deckListView')

    .classList.remove('hidden');


  $('deckListView').innerHTML=`

    <div

      class="deck"

      style="margin-bottom:8px"

    >

      <button class="btn" id="newDeck">

        ＋ デッキを作る

      </button>

    </div>


    <div class="decklist">

      ${state.decks.length

        ?state.decks.map(

          (d,i)=>`

          <div class="deck">

            <div class="row">

              <b>${esc(d.name)}</b>

              <span class="deckCount">

                ${deckTotal(d)}/40枚

              </span>

            </div>


            <div class="small">

              ${deckKinds(d,'main')}種類

              ・ 超GR ${sectionTotal(d,'gr')}枚

              ・ 超次元 ${sectionTotal(d,'extra')}枚

            </div>


            <div class="deckActions">

              <button

                class="btn"

                data-open-deck="${i}"

              >

                デッキを開く

              </button>


              <button

                class="btn danger"

                data-delete-deck="${i}"

              >

                削除

              </button>

            </div>

          </div>`

        ).join('')

        :`

        <div class="empty">

          まだデッキがありません。

        </div>`

      }

    </div>

  `;


  $('newDeck').onclick=()=>{

    const n=prompt(

      'デッキ名',

      '新しいデッキ'

    );


    if(n&&n.trim()){

      state.decks.push({

        name:n.trim(),

        cards:[]

      });


      save();

      renderDeckList();

    }

  };

}


function renderDeckEditor(){

  const d=

    normalizeDeck(

      state.decks[state.activeDeck]

    );


  if(!d){

    renderDeckList();

    return;

  }


  $('deckListView')

    .classList.add('hidden');


  $('deckEditorView')

    .classList.remove('hidden');


  const q=

    state.deckSearch

      .trim()

      .toLowerCase();


  const results=

    state.cards

      .filter(c=>{

        if(

          q&&

          !searchText(c).includes(q)

        )

          return false;


        if(

          state.deckFilter==='owned'&&

          (state.owned[idOf(c)]||0)<=0

        )

          return false;


        if(

          state.deckFilter==='favorite'&&

          !isFav(c)

        )

          return false;


        return true;

      })

      .slice(0,80);


  const mainN=

    sectionTotal(d,'main');


  const grN=

    sectionTotal(d,'gr');


  const extraN=

    sectionTotal(d,'extra');


  $('deckEditorView').innerHTML=`

    <div class="deckEditor">


      <div class="deckTop">

        <button

          class="btn backBtn"

          id="backDeck"

        >

          ←

        </button>


        <div class="deckName">

          ${esc(d.name)}

        </div>


        <div class="deckTotal">

          ${mainN}/40

        </div>


        <button

          class="btn secondary"

          id="renameDeck"

        >

          編集

        </button>

      </div>


      <div class="deckSummary">

        <div class="sumBox">

          <b>${mainN}/40</b>

          <span>メイン</span>

        </div>


        <div class="sumBox">

          <b>${grN}/12</b>

          <span>超GR</span>

        </div>


        <div class="sumBox">

          <b>${extraN}/8</b>

          <span>超次元</span>

        </div>

      </div>


      <div class="deckSearch">

        <input

          id="deckSearch"

          value="${esc(state.deckSearch)}"

          placeholder="カード名・番号・種族で検索"

        >

        <button

          class="btn"

          id="clearDeckSearch"

        >

          ×

        </button>

      </div>


      <div class="deckFilters">

        <button

          class="chip ${state.deckFilter==='all'?'active':''}"

          data-deck-filter="all"

        >

          すべて

        </button>


        <button

          class="chip ${state.deckFilter==='owned'?'active':''}"

          data-deck-filter="owned"

        >

          所持

        </button>


        <button

          class="chip ${state.deckFilter==='favorite'?'active':''}"

          data-deck-filter="favorite"

        >

          お気に入り

        </button>

      </div>


      <div class="sectionTabs">

        <button

          class="sectionTab ${state.deckSection==='main'?'active':''}"

          data-section="main"

        >

          メイン 40

        </button>


        <button

          class="sectionTab ${state.deckSection==='gr'?'active':''}"

          data-section="gr"

        >

          超GR 12

        </button>


        <button

          class="sectionTab ${state.deckSection==='extra'?'active':''}"

          data-section="extra"

        >

          超次元 8

        </button>

      </div>


      <div

        class="small"

        style="margin:5px 2px 7px"

      >

        追加先：

        ${sectionLabel(state.deckSection)}

       　

        ${sectionTotal(

          d,

          state.deckSection

        )}

        /

        ${sectionLimit(

          state.deckSection

        )}

        枚

      </div>


      <div class="deckCards">

        ${results.length

          ?results.map(c=>{

            const id=idOf(c);

            const inDeck=

              deckCards(

                d,

                state.deckSection

              ).find(

                x=>x.id===id

              );


            return `

            <div class="miniCard">

              <img

                src="${cardImage(c)}"

                loading="lazy"

                referrerpolicy="no-referrer"

              >


              <div class="miniInfo">

                <b>

                  ${esc(cardName(c))}

                </b>


                <span class="small">

                  ${esc(cardNumber(c))}

                </span>


                <span class="small">

                  所持

                  ${state.owned[id]||0}枚

                  ${inDeck

                    ?'　デッキ '+inDeck.need+'枚'

                    :''}

                </span>


                <button

                  class="miniAdd"

                  data-deck-add="${esc(id)}"

                >

                  ＋ 追加

                </button>

              </div>

            </div>`;

          }).join('')

          :`

          <div

            class="empty"

            style="grid-column:1/-1"

          >

            カードがありません。

          </div>`

        }

      </div>


      <div class="deckSection">

        <h3>

          ${sectionLabel(

            state.deckSection

          )}の内容

        </h3>


        ${deckCards(

          d,

          state.deckSection

        ).length

          ?deckCards(

            d,

            state.deckSection

          ).map(x=>{

            const c=deckCard(x.id);

            if(!c)return '';


            return `

            <div class="deckRow">

              <img

                src="${cardImage(c)}"

                loading="lazy"

                referrerpolicy="no-referrer"

              >


              <div class="info">

                <div class="name">

                  ${esc(cardName(c))}

                </div>


                <div class="sub">

                  ${esc(cardNumber(c))}

                 　

                  所持

                  ${state.owned[x.id]||0}枚

                </div>

              </div>


              <div class="deckQty">

                <button

                  data-deck-minus="${esc(x.id)}"

                >

                  −

                </button>


                <b>

                  ${x.need}

                </b>


                <button

                  data-deck-plus="${esc(x.id)}"

                >

                  ＋

                </button>

              </div>

            </div>`;

          }).join('')

          :`

          <div class="empty">

            まだカードが入っていません。

          </div>`

        }

      </div>


    </div>

  `;


  $('backDeck').onclick=()=>{

    state.activeDeck=null;

    state.deckSearch='';

    renderDeckList();

  };


  $('renameDeck').onclick=()=>{

    const n=prompt(

      'デッキ名',

      d.name

    );


    if(n&&n.trim()){

      d.name=n.trim();

      save();

      renderDeckEditor();

    }

  };


  $('deckSearch').oninput=e=>{

    state.deckSearch=

      e.target.value;

    renderDeckEditor();

  };


  $('clearDeckSearch').onclick=()=>{

    state.deckSearch='';

    renderDeckEditor();

  };


  $('deckEditorView')

    .querySelectorAll(

      '[data-deck-filter]'

    )

    .forEach(b=>{

      b.onclick=()=>{

        state.deckFilter=

          b.dataset.deckFilter;

        renderDeckEditor();

      };

    });


  $('deckEditorView')

    .querySelectorAll(

      '[data-section]'

    )

    .forEach(b=>{

      b.onclick=()=>{

        state.deckSection=

          b.dataset.section;

        renderDeckEditor();

      };

    });


  $('deckEditorView')

    .querySelectorAll(

      '[data-deck-add]'

    )

    .forEach(b=>{

      b.onclick=()=>{

        addToDeck(

          b.dataset.deckAdd

        );

      };

    });


  $('deckEditorView')

    .querySelectorAll(

      '[data-deck-plus]'

    )

    .forEach(b=>{

      b.onclick=()=>{

        changeDeckQty(

          b.dataset.deckPlus,

          1

        );

      };

    });


  $('deckEditorView')

    .querySelectorAll(

      '[data-deck-minus]'

    )

    .forEach(b=>{

      b.onclick=()=>{

        changeDeckQty(

          b.dataset.deckMinus,

          -1

        );

      };

    });

}


function addToDeck(id){

  const d=

    state.decks[state.activeDeck];


  const section=

    state.deckSection;


  const total=

    sectionTotal(

      d,

      section

    );


  const limit=

    sectionLimit(

      section

    );


  const x=

    d.cards.find(

      x=>

        x.id===id&&

        x.section===section

    );


  if(total>=limit){

    alert(

      `${sectionLabel(section)}は${limit}枚までです。`

    );

    return;

  }


  if(x){

    if(x.need>=4){

      alert(

        '同じカードは4枚までです。'

      );

      return;

    }

    x.need++;

  }else{

    d.cards.push({

      id:id,

      need:1,

      section:section

    });

  }


  save();

  renderDeckEditor();

}


function changeDeckQty(id,delta){

  const d=

    state.decks[state.activeDeck];


  const section=

    state.deckSection;


  const x=

    d.cards.find(

      x=>

        x.id===id&&

        x.section===section

    );


  if(!x)return;


  if(

    delta>0&&

    x.need>=4

  ){

    alert(

      '同じカードは4枚までです。'

    );

    return;

  }


  x.need+=delta;


  if(x.need<=0){

    d.cards=

      d.cards.filter(

        y=>

          !(

            y.id===id&&

            y.section===section

          )

      );

  }


  save();

  renderDeckEditor();

}


$('deckListView').addEventListener(

  'click',

  e=>{

    const o=

      e.target.dataset.openDeck;


    const d=

      e.target.dataset.deleteDeck;


    if(o!==undefined){

      state.activeDeck=+o;

      state.deckSearch='';

      state.deckFilter='all';

      state.deckSection='main';

      renderDeckEditor();

    }


    if(d!==undefined){

      if(

        confirm(

          'このデッキを削除しますか？'

        )

      ){

        state.decks.splice(

          +d,

          1

        );

        save();

        renderDeckList();

      }

    }

  }

);


/* =========================
   カードデータ読み込み
========================= */

async function load(){

  try{

    const r=

      await fetch(

        'data/cards.json?'+Date.now()

      );


    if(!r.ok)

      throw new Error('load');


    state.cards=

      await r.json();


    state.decks=

      state.decks.map(

        normalizeDeck

      );


    fillSettings();


    $('status').textContent=

      `カード ${state.cards.length.toLocaleString()} 枚を読み込みました`;


    renderCards();

    renderFavorites();

    renderDeckList();


  }catch(e){

    $('status').textContent=

      'カードデータを読み込めません。GitHub Actionsの更新が完了するまで少し待ってください。';

  }

}


load();
