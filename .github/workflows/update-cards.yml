name: Test Duel Masters Browser Click

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Test browser pagination
        run: |
          python - <<'PY'
          import re
          import time
          from playwright.sync_api import sync_playwright

          URL = "https://dm.takaratomy.co.jp/card/"

          def get_card_ids(page):
              links = page.locator(
                  'a[href*="/card/detail/?id="]'
              ).all()

              ids = []

              for link in links:
                  href = link.get_attribute("href")

                  if href:
                      m = re.search(r'id=([^&"]+)', href)

                      if m:
                          ids.append(m.group(1))

              return list(dict.fromkeys(ids))

          with sync_playwright() as p:

              print("Chromiumを起動します")

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page(
                  viewport={
                      "width": 390,
                      "height": 844
                  },
                  user_agent=(
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                      "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                      "Version/18.0 Mobile/15E148 Safari/604.1"
                  )
              )

              print("")
              print("公式カード検索を開きます")

              page.goto(
                  URL,
                  wait_until="networkidle",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              # =========================
              # 1ページ目
              # =========================

              ids1 = get_card_ids(page)

              print("")
              print("===== 1ページ目 =====")
              print("URL:", page.url)
              print("カード:", len(ids1), "枚")
              print("先頭:", ids1[:5])
              print("末尾:", ids1[-5:])

              if len(ids1) != 50:
                  raise RuntimeError(
                      f"1ページ目のカード数が想定外です: {len(ids1)}枚"
                  )

              # =========================
              # 「2」の要素を探す
              # =========================

              print("")
              print("ページ2の要素を探します")

              candidates = page.locator("a").all()

              page2 = None

              for element in candidates:

                  text = (element.inner_text() or "").strip()

                  if text == "2":
                      page2 = element
                      break

              if page2 is None:
                  raise RuntimeError(
                      "ページ2の要素が見つかりませんでした。"
                  )

              print("ページ2の要素を発見")

              print(
                  "href:",
                  page2.get_attribute("href")
              )

              print(
                  "onclick:",
                  page2.get_attribute("onclick")
              )

              print(
                  "class:",
                  page2.get_attribute("class")
              )

              # HTMLそのものも確認
              try:
                  print(
                      "HTML:",
                      page2.evaluate(
                          "(el) => el.outerHTML"
                      )
                  )
              except Exception as e:
                  print("HTML取得失敗:", e)

              # =========================
              # クリック前のカードを保存
              # =========================

              first_before = ids1[:10]

              # =========================
              # 通常クリック
              # =========================

              print("")
              print("ページ2をクリックします")

              page2.scroll_into_view_if_needed()

              try:
                  page2.click(
                      force=True,
                      timeout=30000
                  )

                  print("通常クリック成功")

              except Exception as e:

                  print(
                      "通常クリック失敗:",
                      e
                  )

                  # =========================
                  # JavaScriptクリック
                  # =========================

                  print("")
                  print("JavaScriptクリックを試します")

                  page2.evaluate(
                      "(el) => el.click()"
                  )

                  print("JavaScriptクリック成功")

              # =========================
              # ページ切り替え待機
              # =========================

              print("")
              print("ページ切り替えを待ちます")

              for i in range(15):

                  time.sleep(1)

                  ids2 = get_card_ids(page)

                  print(
                      f"{i + 1}秒後:",
                      len(ids2),
                      "枚"
                  )

                  if ids2 and ids2 != ids1:
                      break

              # =========================
              # 2ページ目
              # =========================

              print("")
              print("===== 2ページ目 =====")
              print("URL:", page.url)
              print("カード:", len(ids2), "枚")
              print("先頭:", ids2[:5])
              print("末尾:", ids2[-5:])

              # =========================
              # 結果
              # =========================

              same = ids1 == ids2

              print("")
              print("===== 結果 =====")
              print(
                  "1ページ目と2ページ目が同じ:",
                  same
              )

              if same:
                  raise RuntimeError(
                      "ページ2をクリックしましたが、カード一覧が変わりませんでした。"
                  )

              print("")
              print("==============================")
              print("SUCCESS!")
              print("ブラウザによるページ送りに成功しました！")
              print("==============================")

              browser.close()

          PY
