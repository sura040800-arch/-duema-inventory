name: Test Direct Page Jump

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Test direct page jump
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          URL = "https://dm.takaratomy.co.jp/card/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              print("=" * 60)
              print("公式ページを開きます")
              print("=" * 60)

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              def get_ids():
                  return page.evaluate("""
                  () => Array.from(
                      document.querySelectorAll(
                          'a[href*="/card/detail/?id="]'
                      )
                  ).map(a => {
                      const h =
                          a.getAttribute("href") || "";
                      const m =
                          h.match(/[?&]id=([^&]+)/);
                      return m ? m[1] : null;
                  }).filter(Boolean)
                  """)

              before = get_ids()

              print()
              print("1ページ目カード数:", len(before))

              print()
              print("1ページ目の先頭5枚:")
              print(before[:5])

              print()
              print("=" * 60)
              print("20ページ目へ直接ジャンプ")
              print("=" * 60)

              result = page.evaluate("""
              () => {

                  const buttons =
                      Array.from(
                          document.querySelectorAll(
                              'a[data-page]'
                          )
                      );

                  const button =
                      buttons.find(
                          el =>
                              el.getAttribute(
                                  "data-page"
                              ) === "2"
                      );

                  if (!button) {
                      return "PAGE_2_BUTTON_NOT_FOUND";
                  }

                  console.log(
                      "元のdata-page:",
                      button.getAttribute("data-page")
                  );

                  button.setAttribute(
                      "data-page",
                      "20"
                  );

                  console.log(
                      "変更後data-page:",
                      button.getAttribute("data-page")
                  );

                  if (window.jQuery) {
                      window.jQuery(button).trigger("click");
                      return "CLICK_OK";
                  }

                  button.click();

                  return "NATIVE_CLICK_OK";
              }
              """)

              print(
                  "クリック結果:",
                  result
              )

              changed = False

              for i in range(40):
                  time.sleep(0.5)

                  after = get_ids()

                  if after and after != before:
                      changed = True
                      print()
                      print(
                          "カード内容が変化しました！"
                      )
                      print(
                          "経過:",
                          (i + 1) * 0.5,
                          "秒"
                      )
                      break

              print()
              print("=" * 60)
              print("結果")
              print("=" * 60)

              print(
                  "カード変更:",
                  changed
              )

              print(
                  "現在のURL:",
                  page.url
              )

              after = get_ids()

              print(
                  "現在のカード数:",
                  len(after)
              )

              print()
              print("現在の先頭5枚:")
              print(after[:5])

              print()
              print("1ページ目と同じ:")
              print(after == before)

              browser.close()
          PY
