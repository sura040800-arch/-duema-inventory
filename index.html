<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>デュエマ コレクション</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#f3f4f6;
  color:#111827;
}
button,input,select{font:inherit}
button{cursor:pointer}

header{
  background:#111827;
  color:#fff;
  padding:7px 10px;
  position:sticky;
  top:0;
  z-index:30;
}
h1{
  font-size:14px;
  margin:0 0 6px;
  line-height:1;
}
.headrow{display:flex;gap:6px}
.search{
  flex:1;
  min-width:0;
  padding:9px 10px;
  border:0;
  border-radius:9px;
  background:#fff;
  color:#111827;
}
.settingsBtn{
  width:40px;
  border:0;
  border-radius:9px;
  background:#e5e7eb;
  font-size:18px;
}

main{
  max-width:800px;
  margin:auto;
  padding:8px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:5px;
  margin-bottom:8px;
}
.tab{
  padding:9px 4px;
  border:0;
  border-radius:10px;
  background:#e5e7eb;
  font-weight:700;
  font-size:12px;
}
.tab.active{
  background:#111827;
  color:#fff;
}

.status{
  font-size:11px;
  color:#6b7280;
  margin:6px 4px 8px;
}

.hidden{display:none!important}

.empty{
  background:#fff;
  border-radius:13px;
  padding:25px 15px;
  text-align:center;
  color:#6b7280;
}

/* =========================
   通常カード
========================= */

.cardwrap{
  position:relative;
  margin:7px 0;
}

.card{
  display:flex;
  align-items:center;
  gap:9px;
  background:#fff;
  border-radius:13px;
  padding:8px;
  min-height:112px;
  box-shadow:0 2px 7px #0000000d;
}

.card-img{
  width:66px;
  height:92px;
  object-fit:contain;
  border-radius:5px;
  background:#e5e7eb;
  flex:none;
}

.card-info{
  min-width:0;
  flex:1;
}

.card h3{
  margin:0 0 3px;
  font-size:15px;
  line-height:1.3;
}

.card-number{
  display:inline-block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  background:#eef0f3;
  color:#6b7280;
  border-radius:6px;
  padding:2px 5px;
  font-size:10px;
}

.meta{
  font-size:11px;
  color:#6b7280;
  line-height:1.5;
  margin-top:3px;
}

.small{
  font-size:10px;
  color:#6b7280;
}

.qty{
  display:flex;
  align-items:center;
  gap:3px;
  flex:none;
}

.qty button{
  width:34px;
  height:34px;
  border:0;
  border-radius:9px;
  background:#e5e7eb;
  color:#1677e8;
  font-size:20px;
}

.qty b{
  min-width:21px;
  text-align:center;
}

.fav{
  position:absolute;
  top:5px;
  right:5px;
  border:0;
  background:#ffffffdd;
  border-radius:50%;
  width:29px;
  height:29px;
  font-size:18px;
}

/* =========================
   ボタン
========================= */

.btn{
  border:0;
  border-radius:9px;
  padding:8px 10px;
  background:#111827;
  color:#fff;
  font-weight:700;
  font-size:12px;
}
.btn.secondary{
  background:#e5e7eb;
  color:#111827;
}
.btn.danger{
  background:#fee2e2;
  color:#b91c1c;
}

/* =========================
   デッキ一覧
========================= */

.decklist{
  display:grid;
  gap:8px;
}

.deck{
  background:#fff;
  border-radius:13px;
  padding:11px;
  box-shadow:0 2px 7px #0000000d;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.deckActions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.deckActions .btn{
  flex:1;
}

.deckCount{
  color:#6b7280;
  font-size:11px;
}

/* =========================
   DECK MAKER風エディタ
========================= */

.deckEditor{
  margin:-8px;
  min-height:calc(100vh - 90px);
  background:#f3f4f6;
}

.deckHeader{
  position:sticky;
  top:0;
  z-index:25;
  background:#111827;
  color:#fff;
  padding:7px 8px;
}

.deckHeaderTop{
  display:flex;
  align-items:center;
  gap:7px;
}

.deckBack{
  width:34px;
  height:34px;
  border:0;
  border-radius:8px;
  background:#374151;
  color:#fff;
  font-size:18px;
}

.deckTitle{
  flex:1;
  min-width:0;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.deckEditBtn{
  border:0;
  border-radius:8px;
  padding:7px 9px;
  background:#374151;
  color:#fff;
  font-size:11px;
}

.deckTabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:4px;
  margin-top:7px;
}

.deckTab{
  border:0;
  background:#374151;
  color:#d1d5db;
  padding:7px 3px;
  border-radius:7px;
  font-size:10px;
  font-weight:700;
}

.deckTab.active{
  background:#fff;
  color:#111827;
}

.deckTools{
  padding:7px 8px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.formatRow{
  display:flex;
  gap:5px;
}

.formatBtn{
  border:0;
  border-radius:8px;
  padding:6px 10px;
  background:#e5e7eb;
  font-size:11px;
  font-weight:700;
}

.formatBtn.active{
  background:#111827;
  color:#fff;
}

.analysisBtn{
  margin-left:auto;
}

.deckCounter{
  margin-top:6px;
  font-size:11px;
  color:#6b7280;
}

.deckArea{
  padding:9px 10px 14px;
}

/* デッキ内カード */

.deckGrid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
  padding:2px;
}

.deckCard{
  position:relative;
  min-width:0;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
  transition:transform .12s ease;
}

.deckCard img{
  display:block;
  width:100%;
  aspect-ratio:63/88;
  object-fit:contain;
  border-radius:6px;
  background:#e5e7eb;
  box-shadow:0 1px 4px #0002;
}

.deckCard.emptyImage img{
  visibility:hidden;
}

.noImage{
  position:absolute;
  inset:0;
  background:#d1d5db;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:4px;
  font-size:9px;
  color:#6b7280;
}

.deckQtyBadge{
  position:absolute;
  right:2px;
  bottom:2px;
  min-width:20px;
  height:20px;
  padding:0 4px;
  border-radius:10px;
  background:#111827dd;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:11px;
  font-weight:800;
}

.swipeHint{
  font-size:10px;
  color:#9ca3af;
  text-align:center;
  padding:5px 0 8px;
}

/* =========================
   カード検索
========================= */

.picker{
  background:#fff;
  border-radius:13px;
  padding:9px;
  margin-top:10px;
}

.pickerTop{
  display:flex;
  gap:5px;
  margin-bottom:7px;
}

.pickerSearch{
  flex:1;
  min-width:0;
  border:1px solid #d1d5db;
  border-radius:9px;
  padding:9px;
}

.filterOpen{
  border:0;
  border-radius:9px;
  background:#111827;
  color:#fff;
  padding:8px 10px;
  font-size:11px;
}

.sortSelect{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:8px;
  padding:7px;
  margin-bottom:7px;
}

.pickerInfo{
  font-size:10px;
  color:#6b7280;
  margin-bottom:7px;
}

.pickerGrid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:7px;
}

.pickCard{
  min-width:0;
  position:relative;
}

.pickCard img{
  width:100%;
  aspect-ratio:63/88;
  object-fit:contain;
  display:block;
  border-radius:5px;
  background:#e5e7eb;
}

.pickPlus{
  position:absolute;
  right:2px;
  bottom:2px;
  width:25px;
  height:25px;
  border:0;
  border-radius:50%;
  background:#16a34a;
  color:#fff;
  font-size:18px;
  font-weight:800;
  line-height:1;
  box-shadow:0 2px 5px #0003;
}

.pickQty{
  position:absolute;
  left:2px;
  top:2px;
  min-width:18px;
  height:18px;
  border-radius:9px;
  background:#111827dd;
  color:#fff;
  font-size:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   シート
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:#0007;
  z-index:60;
  display:none;
  align-items:flex-end;
}

.overlay.open{
  display:flex;
}

.sheet{
  width:100%;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:15px 14px calc(20px + env(safe-area-inset-bottom));
}

.sheetHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.sheetHead h2{
  margin:0;
  font-size:17px;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#eef0f3;
  font-size:20px;
}

.field{
  margin:11px 0;
}

.field label{
  display:block;
  font-weight:700;
  font-size:12px;
  margin-bottom:5px;
}

.field input,
.field select{
  width:100%;
  padding:9px;
  border:1px solid #d1d5db;
  border-radius:9px;
  background:#fff;
}

.checkrow{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 0;
  font-size:12px;
}

.checkrow input{
  width:18px;
  height:18px;
}

.chipTitle{
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.chip{
  border:0;
  border-radius:999px;
  padding:6px 9px;
  background:#e5e7eb;
  font-size:10px;
}

.chip.active{
  background:#111827;
  color:#fff;
}

.chip.exclude.active{
  background:#dc2626;
  color:#fff;
}

.andor{
  display:flex;
  gap:5px;
  margin-bottom:8px;
}

.andor button{
  flex:1;
  border:0;
  border-radius:8px;
  padding:7px;
  background:#e5e7eb;
  font-size:11px;
  font-weight:700;
}

.andor button.active{
  background:#111827;
  color:#fff;
}

.sheetActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:14px;
}

.sheetActions button{
  border:0;
  border-radius:10px;
  padding:11px;
  font-weight:700;
}

.apply{
  background:#111827;
  color:#fff;
}

.reset{
  background:#e5e7eb;
}

/* =========================
   分析
========================= */

.analysisBox{
  background:#fff;
  border-radius:13px;
  padding:13px;
  margin-top:10px;
}

.analysisTitle{
  font-weight:800;
  margin-bottom:9px;
}

.analysisRow{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #f0f0f0;
  font-size:12px;
}

.bar{
  height:8px;
  background:#e5e7eb;
  border-radius:5px;
  overflow:hidden;
  margin-top:3px;
}

.bar i{
  display:block;
  height:100%;
  background:#111827;
}

.detailSheet{
  max-height:92vh;
}

.detailImage{
  width:150px;
  max-width:50%;
  display:block;
  margin:0 auto 10px;
  border-radius:8px;
  background:#e5e7eb;
}

.detailName{
  font-size:18px;
  font-weight:800;
  margin-bottom:5px;
}

.ability{
  white-space:pre-wrap;
  line-height:1.65;
  font-size:12px;
  background:#f3f4f6;
  border-radius:10px;
  padding:10px;
  margin-top:8px;
}

.tagList{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:7px;
}

.tag{
  background:#e5e7eb;
  border-radius:999px;
  padding:5px 8px;
  font-size:10px;
}

/* =========================
   PC / 小画面
========================= */

@media(max-width:430px){
  .deckGrid,
  .pickerGrid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media(min-width:600px){
  .deckGrid{
    grid-template-columns:repeat(7,minmax(0,1fr));
  }
  .pickerGrid{
    grid-template-columns:repeat(8,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<header>
  <h1>デュエマ コレクション</h1>
  <div class="headrow">
    <input id="search" class="search" placeholder="カード名・番号・種族で検索">
    <button id="settings" class="settingsBtn">⚙️</button>
  </div>
</header>

<main>

<div class="tabs">
  <button class="tab active" id="invTab">📦 所持カード</button>
  <button class="tab" id="favTab">⭐ お気に入り</button>
  <button class="tab" id="deckTab">🃏 デッキ</button>
</div>

<div id="invView">
  <div class="status" id="status">カードデータを読み込み中…</div>
  <div id="cards"></div>
</div>

<div id="favView" class="hidden">
  <div class="status" id="favStatus"></div>
  <div id="favorites"></div>
</div>

<div id="deckView" class="hidden">
  <div id="deckListView"></div>
  <div id="deckEditorView" class="hidden"></div>
</div>

</main>


<!-- =========================
     通常設定
========================= -->

<div class="overlay" id="overlay">
<div class="sheet">

<div class="sheetHead">
  <h2>⚙️ 絞り込み・並び替え</h2>
  <button class="close" id="closeSettings">×</button>
</div>

<div class="field">
<label>並び順</label>
<select id="sort">
<option value="default">おすすめ順</option>
<option value="name">名前順</option>
<option value="cost">コスト順</option>
<option value="power">パワー順</option>
<option value="civilization">文明順</option>
<option value="race">種族順</option>
<option value="rarity">レアリティ順</option>
<option value="number">カード番号順</option>
</select>
</div>

<div class="field">
<label>文明</label>
<select id="civilization">
<option value="">すべて</option>
</select>
</div>

<div class="field">
<label>種族</label>
<input id="raceFilter"
list="raceList"
placeholder="例：ドラゴン">
<datalist id="raceList"></datalist>
</div>

<div class="field">
<label>カードタイプ</label>
<select id="type">
<option value="">すべて</option>
</select>
</div>

<div class="field">
<label>レアリティ</label>
<select id="rarity">
<option value="">すべて</option>
</select>
</div>

<label class="checkrow">
<input type="checkbox" id="ownedOnly">
所持カードだけ表示
</label>

<label class="checkrow">
<input type="checkbox" id="unownedOnly">
未所持カードだけ表示
</label>

<div class="sheetActions">
<button class="reset" id="resetSettings">リセット</button>
<button class="apply" id="applySettings">適用</button>
</div>

</div>
</div>


<!-- =========================
     デッキ検索フィルター
========================= -->

<div class="overlay" id="deckFilterOverlay">
<div class="sheet">

<div class="sheetHead">
  <h2>🔎 詳細絞り込み</h2>
  <button class="close" id="closeDeckFilter">×</button>
</div>

<div class="field">
<div class="chipTitle">文明：含む</div>
<div class="chips" id="includeCivChips"></div>
</div>

<div class="field">
<div class="chipTitle">文明：除外</div>
<div class="chips" id="excludeCivChips"></div>
</div>

<div class="field">
<div class="chipTitle">タグ検索</div>

<div class="andor">
<button id="tagOr" class="active">OR</button>
<button id="tagAnd">AND</button>
</div>

<div class="chips" id="tagChips"></div>
</div>

<div class="field">
<label>種族</label>
<input id="deckRaceFilter" placeholder="例：ドラゴン">
</div>

<div class="field">
<label>カードタイプ</label>
<select id="deckTypeFilter">
<option value="">すべて</option>
</select>
</div>

<div class="field">
<label>レアリティ</label>
<select id="deckRarityFilter">
<option value="">すべて</option>
</select>
</div>

<div class="field">
<label>コスト上限</label>
<select id="deckCostMax">
<option value="">指定なし</option>
<option value="0">0</option>
<option value="1">1以下</option>
<option value="2">2以下</option>
<option value="3">3以下</option>
<option value="4">4以下</option>
<option value="5">5以下</option>
<option value="6">6以下</option>
<option value="7">7以下</option>
<option value="8">8以下</option>
<option value="9">9以下</option>
<option value="10">10以下</option>
</select>
</div>

<label class="checkrow">
<input type="checkbox" id="deckOwnedOnly">
所持カードのみ
</label>

<label class="checkrow">
<input type="checkbox" id="deckFavoriteOnly">
お気に入りのみ
</label>

<label class="checkrow">
<input type="checkbox" id="deckInOnly">
現在のデッキに入っているカードのみ
</label>

<div class="sheetActions">
<button class="reset" id="resetDeckFilter">全条件クリア</button>
<button class="apply" id="applyDeckFilter">適用</button>
</div>

</div>
</div>


<!-- =========================
     カード詳細
========================= -->

<div class="overlay" id="detailOverlay">
<div class="sheet detailSheet">

<div class="sheetHead">
  <h2>カード詳細</h2>
  <button class="close" id="closeDetail">×</button>
</div>

<div id="detailContent"></div>

</div>
</div>


<!-- =========================
     分析
========================= -->

<div class="overlay" id="analysisOverlay">
<div class="sheet">

<div class="sheetHead">
  <h2>📊 デッキ分析</h2>
  <button class="close" id="closeAnalysis">×</button>
</div>

<div id="analysisContent"></div>

</div>
</div>


<script>

/* =========================================================
   基本データ
========================================================= */

const state={
  cards:[],

  owned:JSON.parse(localStorage.getItem("duema_owned_v3")||"{}"),

  favorites:JSON.parse(
    localStorage.getItem("duema_favorites_v1")||"{}"
  ),

  decks:JSON.parse(
    localStorage.getItem("duema_decks_v3")||"[]"
  ),

  activeDeck:null,

  deckSection:"main",

  deckSearch:"",

  pickerLimit:80,

  pickerSort:"recommended",

  tagMode:"or",

  deckFilter:{
    includeCiv:[],
    excludeCiv:[],
    tags:[],
    race:"",
    type:"",
    rarity:"",
    costMax:"",
    ownedOnly:false,
    favoriteOnly:false,
    inOnly:false
  }
};


/* 古いデッキを壊さない */
state.decks.forEach(d=>{
  if(!Array.isArray(d.cards))d.cards=[];
  if(!Array.isArray(d.gr))d.gr=[];
  if(!Array.isArray(d.extra))d.extra=[];
  if(!d.format)d.format="original";
});


const setting={
  sort:"default",
  civilization:"",
  race:"",
  type:"",
  rarity:"",
  ownedOnly:false,
  unownedOnly:false
};

const $=id=>document.getElementById(id);

const esc=s=>String(s??"").replace(
  /[&<>\"']/g,
  m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "\"":"&quot;",
    "'":"&#39;"
  }[m])
);


/* =========================================================
   カードデータ取得
========================================================= */

function faces(c){
  return Array.isArray(c.sides)&&c.sides.length
    ?c.sides
    :[c];
}

function values(c,key){

  return faces(c)
    .flatMap(f=>{
      const v=f[key];

      if(v===undefined||v===null||v==="")
        return [];

      return Array.isArray(v)?v:[v];
    })
    .map(String);
}

function splitValues(v){
  return String(v||"")
    .split(/[／\\/・,、]+/)
    .map(s=>s.trim())
    .filter(Boolean);
}

function civilizations(c){
  return [
    ...new Set(
      values(c,"civilization")
      .flatMap(splitValues)
    )
  ];
}

function races(c){
  return [
    ...new Set(
      values(c,"race")
      .flatMap(splitValues)
    )
  ];
}

function types(c){
  return [
    ...new Set(
      values(c,"type")
      .flatMap(splitValues)
    )
  ];
}

function rarities(c){
  return [
    ...new Set(values(c,"rarity"))
  ];
}

function abilities(c){
  return values(c,"abilities").join("\n");
}

function cardName(c){
  return c.name||c._name||c.cardName||"";
}

function cardNumber(c){
  return c.number||c.id||"";
}

function idOf(c){
  return c.id||c.number||"";
}

function firstValue(c,key){
  return values(c,key)[0]||"";
}

function costNum(c){
  const n=parseInt(firstValue(c,"cost"),10);
  return Number.isFinite(n)?n:999;
}

function powerNum(c){
  const s=firstValue(c,"power")
    .replace(/[^0-9]/g,"");

  const n=Number(s);

  return Number.isFinite(n)?n:-1;
}

function cardTags(c){

  const text=(
    cardName(c)+"\n"+
    abilities(c)+"\n"+
    values(c,"flavor").join("\n")
  );

  const result=[];

  for(const [tag,rules] of Object.entries(TAG_RULES)){

    if(
      rules.some(rule=>{
        try{
          return new RegExp(rule,"i").test(text);
        }catch{
          return text.includes(rule);
        }
      })
    ){
      result.push(tag);
    }
  }

  return result;
}

/* =========================================================
   通常カード検索
========================================================= */

function filteredCards(base=state.cards){

  const q=$("search").value.trim().toLowerCase();

  let list=base.filter(c=>{

    if(q&&!searchText(c).includes(q))
      return false;

    if(
      setting.civilization &&
      !civilizations(c).includes(setting.civilization)
    )return false;

    if(
      setting.race &&
      !races(c).some(
        x=>x.toLowerCase().includes(setting.race)
      )
    )return false;

    if(
      setting.type &&
      !types(c).includes(setting.type)
    )return false;

    if(
      setting.rarity &&
      !rarities(c).includes(setting.rarity)
    )return false;

    const n=state.owned[idOf(c)]||0;

    if(setting.ownedOnly&&n<=0)
      return false;

    if(setting.unownedOnly&&n>0)
      return false;

    return true;
  });

  list.sort((a,b)=>{

    switch(setting.sort){

      case"name":
        return cardName(a)
          .localeCompare(cardName(b),"ja");

      case"cost":
        return costNum(a)-costNum(b)
          ||cardName(a).localeCompare(cardName(b),"ja");

      case"power":
        return powerNum(a)-powerNum(b)
          ||cardName(a).localeCompare(cardName(b),"ja");

      case"civilization":
        return civilizations(a).join()
          .localeCompare(
            civilizations(b).join(),
            "ja"
          );

      case"race":
        return races(a).join()
          .localeCompare(
            races(b).join(),
            "ja"
          );

      case"rarity":
        return rarities(a).join()
          .localeCompare(
            rarities(b).join(),
            "ja"
          );

      case"number":
        return cardNumber(a)
          .localeCompare(cardNumber(b),"ja");

      default:
        return 0;
    }

  });

  return list;
}

  );

  renderCurrent();
}

function toggleFav(id){

  state.favorites[id]=!state.favorites[id];

  save();
  renderCurrent();
}

/* =========================================================
   デッキ基本
========================================================= */

function deckSections(d){

  return{
    main:d.cards||[],
    gr:d.gr||[],
    extra:d.extra||[]
  };
}


function currentSectionArray(d){

  if(state.deckSection==="gr")
    return d.gr;

  if(state.deckSection==="extra")
    return d.extra;

  return d.cards;
}


function sectionLimit(){

  if(state.deckSection==="gr")
    return 12;

  if(state.deckSection==="extra")
    return 8;

  return 40;
}


function deckTotal(arr){

  return arr.reduce(
    (s,x)=>s+(x.need||0),
    0
  );
}


function deckCard(id){

  return state.cards.find(
    c=>idOf(c)===id
  );
}


function usageDeckCount(id){

  return state.decks.reduce(
    (n,d)=>{

      const found=[
        ...(d.cards||[]),
        ...(d.gr||[]),
        ...(d.extra||[])
      ].some(x=>x.id===id);

      return n+(found?1:0);

    },
    0
  );
}


function usageCopies(id){

  return state.decks.reduce(
    (n,d)=>{

      return n+
        [
          ...(d.cards||[]),
          ...(d.gr||[]),
          ...(d.extra||[])
        ]
        .filter(x=>x.id===id)
        .reduce((s,x)=>s+(x.need||0),0);

    },
    0
  );
}

    excludeCiv:[],
    tags:[],
    race:"",
    type:"",
    rarity:"",
    costMax:"",
    ownedOnly:false,
    favoriteOnly:false,
    inOnly:false
  };

  buildDeckFilterUI();
};

/* =========================================================
   デッキ検索対象
========================================================= */

function cardMatchesDeckFilter(c){

  const f=state.deckFilter;

  const civ=civilizations(c);

  /* 文明含む */
  if(
    f.includeCiv.length &&
    !f.includeCiv.every(x=>civ.includes(x))
  )
    return false;

  /* 文明除外 */
  if(
    f.excludeCiv.some(x=>civ.includes(x))
  )
    return false;

  /* 種族 */
  if(
    f.race &&
    !races(c).some(
      x=>x.toLowerCase().includes(f.race)
    )
  )
    return false;

  /* タイプ */
  if(
    f.type &&
    !types(c).includes(f.type)
  )
    return false;

  /* レアリティ */
  if(
    f.rarity &&
    !rarities(c).includes(f.rarity)
  )
    return false;

  /* コスト */
  if(
    f.costMax!=="" &&
    costNum(c)>Number(f.costMax)
  )
    return false;

  /* 所持 */
  if(
    f.ownedOnly &&
    (state.owned[idOf(c)]||0)<=0
  )
    return false;

  /* お気に入り */
  if(
    f.favoriteOnly &&
    !isFav(c)
  )
    return false;

  /* デッキ内 */
  if(f.inOnly){

    const d=state.decks[state.activeDeck];

    const arr=currentSectionArray(d);

    if(!arr.some(x=>x.id===idOf(c)))
      return false;
  }

  /* タグ */
  if(f.tags.length){

    const tags=cardTags(c);

    if(state.tagMode==="and"){

      if(!f.tags.every(t=>tags.includes(t)))
        return false;

    }else{

      if(!f.tags.some(t=>tags.includes(t)))
        return false;

    }
  }

  return true;
}


/* =========================================================
   使用頻度順
========================================================= */

function pickerSortCards(list){

  switch(state.pickerSort){

    case"usageDeck":
      return list.sort(
        (a,b)=>
          usageDeckCount(b)-usageDeckCount(a)
          ||usageCopies(b)-usageCopies(a)
          ||cardName(a).localeCompare(cardName(b),"ja")
      );

    case"usageCopies":
      return list.sort(
        (a,b)=>
          usageCopies(b)-usageCopies(a)
          ||usageDeckCount(b)-usageDeckCount(a)
          ||cardName(a).localeCompare(cardName(b),"ja")
      );

    case"name":
      return list.sort(
        (a,b)=>
          cardName(a).localeCompare(cardName(b),"ja")
      );

    case"cost":
      return list.sort(
        (a,b)=>
          costNum(a)-costNum(b)
          ||cardName(a).localeCompare(cardName(b),"ja")
      );

    case"power":
      return list.sort(
        (a,b)=>
          powerNum(b)-powerNum(a)
          ||cardName(a).localeCompare(cardName(b),"ja")
      );

    case"number":
      return list.sort(
        (a,b)=>
          cardNumber(a).localeCompare(cardNumber(b),"ja")
      );

    default:

      return list.sort(
        (a,b)=>{
          const au=state.owned[idOf(a)]||0;
          const bu=state.owned[idOf(b)]||0;

          return(
            usageDeckCount(b)-usageDeckCount(a)
            ||
            bu-au
            ||
            usageCopies(b)-usageCopies(a)
            ||
            cardName(a).localeCompare(cardName(b),"ja")
          );
        }
      );
  }
}

  if(!c)return"";

  return`

/* =========================================================
   スワイプ
========================================================= */

function bindDeckSwipe(){

  const grid=$("deckGrid");

  if(!grid)return;

  grid.querySelectorAll(
    "[data-deck-card]"
  ).forEach(card=>{

    let startX=0;
    let startY=0;
    let moved=false;

    card.addEventListener(
      "touchstart",
      e=>{

        const t=e.changedTouches[0];

        startX=t.clientX;
        startY=t.clientY;
        moved=false;

      },
      {passive:true}
    );


    card.addEventListener(
      "touchmove",
      e=>{

        const t=e.changedTouches[0];

        const dx=t.clientX-startX;
        const dy=t.clientY-startY;

        if(
          Math.abs(dx)>10 &&
          Math.abs(dx)>Math.abs(dy)*1.15
        ){

          moved=true;

          const limited=Math.max(
            -45,
            Math.min(45,dx*0.35)
          );

          card.style.transform=
            `translateX(${limited}px)`;
        }

      },
      {passive:true}
    );


    card.addEventListener(
      "touchend",
      e=>{

        const t=e.changedTouches[0];

        const dx=t.clientX-startX;
        const dy=t.clientY-startY;

        card.style.transform="";

        if(
          !moved||
          Math.abs(dx)<45||
          Math.abs(dx)<Math.abs(dy)
        ){

          /*
            タップ
          */

          if(
            Math.abs(dx)<15 &&
            Math.abs(dy)<15
          ){

            openCardDetail(
              card.dataset.deckCard
            );
          }

          return;
        }


        const id=card.dataset.deckCard;

        /*
          右スワイプ = +
          左スワイプ = -
        */

        changeDeckQty(
          id,
          dx>0?1:-1
        );

      },
      {passive:true}
    );

  });
}


/* =========================================================
   デッキに追加 / 削除
========================================================= */

function addToDeck(id){

  const d=state.decks[state.activeDeck];

  const arr=currentSectionArray(d);

  const total=deckTotal(arr);

  if(total>=sectionLimit()){

    alert(
      `${sectionLimit()}枚までです。`
    );

    return;
  }

  const x=arr.find(x=>x.id===id);

  if(x)
    x.need++;
  else
    arr.push({
      id,
      need:1
    });

  save();

  renderDeckEditor();
}


function changeDeckQty(id,delta){

  const d=state.decks[state.activeDeck];

  const arr=currentSectionArray(d);

  const x=arr.find(x=>x.id===id);

  if(!x)return;

  x.need+=delta;

  if(x.need<=0){

    const index=arr.indexOf(x);

    if(index>=0)
      arr.splice(index,1);
  }

  save();

  renderDeckEditor();
}


/* =========================================================
   ピッカー
========================================================= */

function renderPicker(){

  const d=state.decks[state.activeDeck];

  if(!d)return;

  const q=state.deckSearch
    .trim()
    .toLowerCase();

  let list=state.cards.filter(c=>{

    if(
      q &&
      !searchText(c).includes(q)
    )
      return false;

    if(
      !cardMatchesDeckFilter(c)
    )
      return false;

    return true;
  });


  list=pickerSortCards(list);

  const total=list.length;

  const shown=list.slice(
    0,
    state.pickerLimit
  );


  $("pickerInfo").textContent=
    `${total.toLocaleString()}枚中 ${shown.length.toLocaleString()}枚表示`;


  $("pickerGrid").innerHTML=
    shown.length
    ?shown.map(pickerCardHtml).join("")
    :`
      <div
        class="empty"
        style="grid-column:1/-1"
      >
        条件に一致するカードがありません。
      </div>
    `;


  $("pickerGrid")
    .querySelectorAll(
      "[data-picker-add]"
    )
    .forEach(btn=>{

      btn.onclick=()=>{

        addToDeck(
          btn.dataset.pickerAdd
        );

      };

    });


  /*
    まだあるなら「さらに読み込む」
  */

  if(total>shown.length){

    $("pickerGrid").insertAdjacentHTML(
      "beforeend",
      `
      <button
        id="loadMoreCards"
        class="btn secondary"
        style="
          grid-column:1/-1;
          width:100%;
          margin-top:4px;
        "
      >
        さらに読み込む
      </button>
      `
    );

    $("loadMoreCards").onclick=()=>{

      state.pickerLimit+=80;

      renderPicker();
    };
  }
}


function pickerCardHtml(c){

  const id=idOf(c);

  const d=state.decks[state.activeDeck];

  const arr=currentSectionArray(d);

  const x=arr.find(
    x=>x.id===id
  );

  return`

  <div
    class="pickCard"
    data-picker-card="${esc(id)}"
  >

    ${imageHtml(c,"")}

    ${
      x
      ?`
        <div class="pickQty">
          ${x.need}
        </div>
      `:""
    }

    <button
      class="pickPlus"
      data-picker-add="${esc(id)}"

      ＋
    </button>

}

/* =========================================================
   デッキ分析
========================================================= */

function renderAnalysis(){

  const d=state.decks[state.activeDeck];

  if(!d)return;

  const all=[
    ...d.cards,
    ...d.gr,
    ...d.extra
  ];

  const total=deckTotal(d.cards);
  const gr=deckTotal(d.gr);
  const extra=deckTotal(d.extra);

  const civCount={};

  all.forEach(x=>{

    const c=deckCard(x.id);

    if(!c)return;

    civilizations(c).forEach(cv=>{
      civCount[cv]=
        (civCount[cv]||0)+x.need;
    });

  });


  const costCount={};

  d.cards.forEach(x=>{

    const c=deckCard(x.id);

    if(!c)return;

    const cost=firstValue(c,"cost")||"?";

    costCount[cost]=
      (costCount[cost]||0)+x.need;
  });


  $("analysisContent").innerHTML=`

  <div class="analysisBox">

    <div class="analysisTitle">
      ${esc(d.name)}
    </div>

    <div class="analysisRow">
      <span>メイン</span>
      <b>${total}/40</b>
    </div>

    <div class="analysisRow">
      <span>GR</span>
      <b>${gr}/12</b>
    </div>

    <div class="analysisRow">
      <span>超次元</span>
      <b>${extra}/8</b>
    </div>

  </div>


  <div class="analysisBox">

    <div class="analysisTitle">
      文明
    </div>

    ${
      Object.entries(civCount)
      .map(([c,n])=>`

        <div>
          <div class="analysisRow">
            <span>${esc(c)}</span>
            <b>${n}枚</b>
          </div>

          <div class="bar">
            <i style="
              width:${Math.min(
                100,
                total
                ?n/total*100
                :0
              )}%
            "></i>
          </div>
        </div>

      `).join("")
    }

  </div>


  <div class="analysisBox">

    <div class="analysisTitle">
      コスト分布
    </div>

    ${
      Object.entries(costCount)
      .sort((a,b)=>
        Number(a[0])-Number(b[0])
      )
      .map(([c,n])=>`

        <div class="analysisRow">
          <span>コスト ${esc(c)}</span>
          <b>${n}枚</b>
        </div>

      `).join("")
    }

  </div>
  `;

  $("analysisOverlay")
    .classList.add("open");
}


$("closeAnalysis").onclick=()=>
  $("analysisOverlay")
    .classList.remove("open");

  e=>{
    if(e.target===$("analysisOverlay"))

  }
);

/* =========================================================
   データロード
========================================================= */

async function load(){

  try{

    const r=await fetch(
      "data/cards.json?"+Date.now()
    );

    if(!r.ok)
      throw new Error("load");

    state.cards=await r.json();

    fillSettings();

    buildDeckFilterUI();

    $("status").textContent=
      `カード ${state.cards.length.toLocaleString()} 枚を読み込みました`;

    renderCards();

    renderFavorites();

    renderDeckList();

  }catch(e){

    console.error(e);

    $("status").textContent=
      "カードデータを読み込めません。";

  }
}

load();
