name: Test Duel Masters Pagination

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install requests beautifulsoup4

      - name: Test official pagination
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.parse import quote, urljoin

          import requests
          from bs4 import BeautifulSoup

          BASE = "https://dm.takaratomy.co.jp"
          CARD_PATH = "/card/"

          session = requests.Session()
          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                  "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                  "Version/18.0 Mobile/15E148 Safari/604.1"
              ),
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "ja-JP,ja;q=0.9,en-US;q=0.8,en;q=0.7",
              "Referer": BASE + CARD_PATH,
          })

          def make_url(page):
              state = {
                  "suggest": "on",
                  "keyword_type": [
                      "card_name",
                      "card_ruby",
                      "card_text"
                  ],
                  "culture_cond": [
                      "単色",
                      "多色"
                  ],
                  "pagenum": str(page),
                  "samename": "show",
                  "sort": "release_new"
              }

              v = json.dumps(
                  state,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

              return BASE + CARD_PATH + "?v=" + quote(v, safe="")

          def get_cards(page):
              url = make_url(page)

              print("")
              print("===== PAGE", page, "=====")
              print(url)

              response = session.get(
                  url,
                  timeout=45,
                  allow_redirects=True
              )

              print("HTTP:", response.status_code)
              print("FINAL URL:", response.url)
              print("HTML:", len(response.text), "bytes")

              response.raise_for_status()

              soup = BeautifulSoup(response.text, "html.parser")
              links = set()

              for a in soup.find_all("a", href=True):
                  href = a["href"]

                  if "/card/detail/?id=" in href:
                      links.add(urljoin(BASE, href))

              ids = sorted(
                  link.split("id=", 1)[1]
                  for link in links
                  if "id=" in link
              )

              print("カード:", len(ids), "枚")
              print("先頭:", ids[:5])
              print("末尾:", ids[-5:])

              return ids

          results = {}

          for page in (1, 2, 3):
              results[page] = get_cards(page)
              time.sleep(2)

          print("")
          print("========== 比較 ==========")

          for page in (1, 2, 3):
              print(
                  f"{page}ページ目: "
                  f"{len(results[page])}枚"
              )

          if not results[1] or not results[2]:
              raise RuntimeError(
                  "1ページ目または2ページ目からカードを取得できませんでした。"
              )

          same12 = set(results[1]) == set(results[2])
          same23 = set(results[2]) == set(results[3])

          print(
              "1ページ目と2ページ目が同じ:",
              same12
          )

          print(
              "2ページ目と3ページ目が同じ:",
              same23
          )

          if same12:
              raise RuntimeError(
                  "ページ番号を変えても1ページ目と2ページ目が同じです。"
              )

          if same23:
              raise RuntimeError(
                  "2ページ目と3ページ目が同じです。"
              )

          print("")
          print("SUCCESS")
          print("1→2→3ページ目が別々に取得できました。")
          print("この方式を確認できたら、全ページ取得版を作ります。")
          PY
