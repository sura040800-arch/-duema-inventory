name: Debug Duel Masters Data

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Inspect research and data
        run: |
          python - <<'PY'
          import requests

          url = "https://dm.takaratomy.co.jp/common/js/search.js"

          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          )

          lines = r.text.splitlines()

          print("=" * 80)
          print("【research(data) 周辺】")
          print("=" * 80)

          # research関数を探して、その中身をかなり広めに表示
          for i, line in enumerate(lines):
              if "function research(data)" in line:
                  print("research開始:", i + 1)

                  start = max(0, i - 5)
                  end = min(len(lines), i + 115)

                  for j in range(start, end):
                      print(f"{j + 1:04d}: {lines[j]}")

          print("\n")
          print("=" * 80)
          print("【doAjax を呼び出している場所】")
          print("=" * 80)

          for i, line in enumerate(lines):
              if "doAjax(" in line:
                  start = max(0, i - 15)
                  end = min(len(lines), i + 15)

                  print("\n---", i + 1, "行目 ---")

                  for j in range(start, end):
                      print(f"{j + 1:04d}: {lines[j]}")

          print("\n")
          print("=" * 80)
          print("調査終了")
          print("=" * 80)
          PY
