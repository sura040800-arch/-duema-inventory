name: Update Duel Masters Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install playwright
          playwright install chromium

      - name: Scrape official card list
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urljoin
          import json
          import os
          import re
          import time
          import sys

          BASE = "https://dm.takaratomy.co.jp"
          URL = BASE + "/card/"

          def get_cards(page):
              result = []
              seen = set()

              links = page.locator(
                  '#cardlist a[href*="/card/detail/"]'
              )

              for i in range(links.count()):
                  a = links.nth(i)

                  href = a.get_attribute("href")
                  if not href:
                      continue

                  full_url = urljoin(BASE, href)

                  m = re.search(
                      r"[?&]id=([^&]+)",
                      full_url
                  )

                  if not m:
                      continue

                  card_id = m.group(1)

                  if card_id in seen:
                      continue

                  seen.add(card_id)

                  text = a.inner_text().strip()

                  result.append({
                      "id": card_id,
                      "name": text,
                      "number": "",
                      "url": full_url
                  })

              return result

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page(
                  viewport={
                      "width": 1280,
                      "height": 1000
                  }
              )

              print("公式カード検索を開いています...")

              page.goto(
                  URL,
                  wait_until="networkidle",
                  timeout=60000
              )

              page.wait_for_timeout(2000)

              # ----------------------------
              # 1ページ目
              # ----------------------------

              first = get_cards(page)

              print(
                  "1ページ目カード数:",
                  len(first)
              )

              if len(first) == 0:
                  print("ERROR: カードを取得できませんでした")
                  browser.close()
                  sys.exit(1)

              all_cards = []
              seen_ids = set()

              for card in first:
                  seen_ids.add(card["id"])
                  all_cards.append(card)

              print(
                  "1ページ目:",
                  [x["id"] for x in first[:5]]
              )

              # ----------------------------
              # 2ページ目以降
              # ----------------------------

              previous_ids = [
                  x["id"] for x in first
              ]

              MAX_PAGE = 500

              for target_page in range(
                  2,
                  MAX_PAGE + 1
              ):

                  print("")
                  print(
                      f"===== {target_page}ページ目 ====="
                  )

                  # pagenumを変更
                  page.locator(
                      '#search_cond input[name="pagenum"]'
                  ).fill(str(target_page))

                  # 通常のフォーム送信
                  try:
                      with page.expect_navigation(
                          wait_until="networkidle",
                          timeout=60000
                      ):
                          page.locator(
                              "#search_cond"
                          ).evaluate(
                              "form => form.submit()"
                          )

                  except Exception:
                      # サイト側が非同期処理の場合に備える
                      page.wait_for_timeout(5000)

                  page.wait_for_timeout(1000)

                  current = get_cards(page)

                  print(
                      "取得:",
                      len(current),
                      "枚"
                  )

                  if not current:
                      print(
                          "カードがなくなったので終了"
                      )
                      break

                  current_ids = [
                      x["id"] for x in current
                  ]

                  # ----------------------------
                  # 同じページなら終了
                  # ----------------------------

                  if current_ids == previous_ids:

                      print(
                          "前ページと同じカードなので終了"
                      )

                      break

                  # ----------------------------
                  # 新しいカードを追加
                  # ----------------------------

                  new_count = 0

                  for card in current:

                      if card["id"] not in seen_ids:

                          seen_ids.add(
                              card["id"]
                          )

                          all_cards.append(card)

                          new_count += 1

                  print(
                      "新規:",
                      new_count
                  )

                  print(
                      "累計:",
                      len(all_cards)
                  )

                  # 新しいカードが0枚なら終了
                  if new_count == 0:

                      print(
                          "新しいカードがないので終了"
                      )

                      break

                  previous_ids = current_ids

                  time.sleep(0.5)

              browser.close()

          # ----------------------------
          # 最終チェック
          # ----------------------------

          print("")
          print("==============================")
          print(
              "取得完了:",
              len(all_cards),
              "枚"
          )
          print("==============================")

          if len(all_cards) < 1000:

              print(
                  "ERROR: 取得枚数が少なすぎます"
              )

              sys.exit(1)

          # ----------------------------
          # 保存
          # ----------------------------

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              "data/cards.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  all_cards,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "data/cards.json を更新しました"
          )

          PY

      - name: Commit cards.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cards.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update Duel Masters card data"
            git push
          fi
