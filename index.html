<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f3f5;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}

/* collection */
.card{display:flex;align-items:center;gap:9px;background:#fff;border-radius:14px;margin:8px 10px;padding:8px;min-height:112px;box-shadow:0 2px 8px #00000012;position:relative}

.info{flex:1;min-width:0}.info h3{margin:0 0 4px;font-size:15px}.tag{display:inline-block;background:#eef0f3;border-radius:7px;padding:3px 6px;font-size:11px;color:#687078}.meta{font-size:12px;color:#687078;line-height:1.45;margin-top:3px}
.qty{display:flex;align-items:center;gap:3px}.qty button{width:34px;height:34px;border:0;border-radius:9px;background:#e5e7eb;color:#1677e8;font-size:22px}.qty b{min-width:23px;text-align:center}.fav{position:absolute;right:4px;top:4px;border:0;background:#fffdf0;border-radius:50%;font-size:21px;color:#1677e8}

/* deck list */
.deck-list{padding:0 10px}.deck-row{background:#fff;border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 2px 8px #00000012}
.deck-row strong{font-size:16px}.deck-row small{color:#6b7280}.deck-row .actions{display:flex;gap:7px;margin-top:9px}
.btn{border:0;border-radius:10px;padding:9px 12px;background:#111827;color:#fff;font-weight:700}.btn.gray{background:#e5e7eb;color:#111827}.btn.green{background:#16a34a}.btn.red{background:#fee2e2;color:#b91c1c}

/* deck maker */
.dm{background:#fff;min-height:calc(100vh - 110px)}
.dm-head{background:#111827;color:#fff;padding:8px 10px;position:sticky;top:0;z-index:40}
.dm-line{display:flex;align-items:center;gap:7px}.back{border:0;background:#374151;color:#fff;border-radius:9px;padding:8px 10px}.dm-title{flex:1;text-align:center;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.save{border:0;background:#16a34a;color:#fff;border-radius:9px;padding:8px 11px;font-weight:800}
.zone-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px}.zone-tabs button{border:0;background:#374151;color:#d1d5db;border-radius:7px;padding:8px 2px;font-size:11px}.zone-tabs button.active{background:#fff;color:#111827}
.stats{display:grid;grid-template-columns:2fr 1fr 1fr;gap:5px;padding:8px 10px;background:#fff}.stat{background:#eef0f2;border-radius:10px;text-align:center;padding:7px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#687078}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 10px 8px}.tools button{border:0;border-radius:9px;padding:8px 2px;background:#e5e7eb;font-size:11px;font-weight:800}.tools button.dark{background:#111827;color:#fff}
.format{display:flex;gap:5px;padding:0 10px 8px}.format button{flex:1;border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:7px;font-size:11px}.format .on{background:#111827;color:#fff;border-color:#111827}

/* 8 x 4 deck board */
.board-wrap{padding:0 10px}.board{
background:#151b25;border-radius:12px;padding:8px;overflow-y:auto;
height:min(49vh,520px);min-height:300px;
-webkit-overflow-scrolling:touch
}
.board-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;align-content:start}
.dcard{position:relative;min-width:0}.dcard img{display:block;width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:6px;background:#303844;box-shadow:0 1px 4px #0008}.dcard .num{position:absolute;right:3px;bottom:3px;background:#111c;color:#fff;border-radius:5px;padding:2px 5px;font-size:11px;font-weight:900}
.dcard .remove{position:absolute;left:2px;top:2px;width:20px;height:20px;border:0;border-radius:50%;background:#ef4444;color:#fff;font-size:13px;display:none}.dcard:active .remove{display:block}
.empty-board{grid-column:1/-1;text-align:center;color:#9ca3af;padding:50px 10px;font-size:12px}

/* picker */
.picker{margin-top:8px;border-top:1px solid #d7dbe0;background:#fff}
.picker-top{padding:8px 10px;position:sticky;top:0;background:#fff;z-index:20;border-bottom:1px solid #e5e7eb}
.picker-search{display:flex;gap:6px}.picker-search input{flex:1;min-width:0;border:1px solid #d1d5db;border-radius:9px;padding:9px}.picker-search button{border:0;border-radius:9px;background:#e5e7eb;padding:0 12px}
.quick{display:flex;gap:5px;overflow-x:auto;padding-top:6px;-webkit-overflow-scrolling:touch}.quick button{flex:0 0 auto;border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:6px 9px;font-size:10px;white-space:nowrap}.quick button.on{background:#111827;color:#fff}
.picker-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;padding:9px 10px 16px}
.pcard{position:relative;min-width:0}.pcard img{display:block;width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:6px;background:#e5e7eb}.pcard button{position:absolute;right:3px;bottom:3px;width:25px;height:25px;border:0;border-radius:50%;background:#16a34a;color:#fff;font-size:18px;line-height:25px}.pcard .owned{position:absolute;left:3px;top:3px;background:#111c;color:#fff;border-radius:5px;padding:2px 4px;font-size:9px}
.pager{display:block;margin:0 auto 15px;border:0;border-radius:9px;padding:9px 18px;background:#111827;color:#fff}

/* overlays */
.overlay{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:15px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{font-size:18px;margin:0}.close{border:0;background:#eef0f2;border-radius:50%;width:38px;height:38px;font-size:20px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:7px 10px;font-size:11px}.chip.on{background:#111827;color:#fff}
.analysis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.abox{background:#f3f4f6;border-radius:10px;padding:10px}.abox b{display:block;font-size:19px}.abox span{font-size:11px;color:#687078}
@media(max-width:430px){.picker-grid,.board-grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}.board{min-height:120px}.tools button{font-size:10px}.card{margin:7px 8px}.picker-actions button{padding:9px 8px;min-width:72px!important}}

/* DECK MAKER-inspired editor layout */
body.deck-mode{background:#fff}body.deck-mode>header,body.deck-mode main>.tabs{display:none!important}body.deck-mode main{max-width:none;margin:0}
.dm{background:#fff;min-height:calc(100dvh - 0px);padding-bottom:0}
.dm-head{position:relative;top:auto;background:#05070a;padding:8px 0 0;}
.dm-brand{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff}
.dm-brandmark{font-size:22px;line-height:1;font-weight:900;letter-spacing:.3px;cursor:pointer}.zone-combined{display:flex;flex:0 0 auto;gap:0;background:#dfe1e3;border-radius:7px 7px 0 0;overflow:hidden}.zone-combined button{border-radius:0!important;min-width:0!important;background:transparent!important;color:#111!important;border-right:1px solid #c8cbce!important}.zone-combined button.active{background:#fff!important;font-weight:800}.zone-combined button:last-child{border-right:0!important}.dm-brandmark small{display:block;text-align:center;font-size:10px;letter-spacing:1px;margin-top:3px;font-weight:500}
.dm-topactions{display:flex;gap:18px}.dm-topactions button{background:transparent;border:0;color:#fff;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0}.dm-topactions strong{font-size:22px;line-height:1}
.dm-line{display:none}.zone-tabs{display:flex;gap:6px;margin:0;padding:0 5px}.zone-tabs button{flex:0 0 auto;min-width:86px;padding:14px 10px 12px;border-radius:7px 7px 0 0;font-size:15px;color:#111;background:#dfe1e3}.zone-tabs button.active{background:#fff;color:#111;font-weight:700}
.dm-head .zone-tabs button:last-child{min-width:68px}.dm-head .zone-tabs:after{content:'';flex:1}
.stats{display:none}.tools{display:none}.format{padding:8px 10px;background:#fff}.format button{font-size:13px;padding:9px}.board-wrap{padding:0;background:#fff}.board{height:auto;min-height:0;max-height:43vh;overflow-y:auto;overscroll-behavior:contain;border-radius:0;background:#f0f1f2;padding:10px 8px;box-shadow:none}.board-grid{grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}.dcard img{border-radius:2px;box-shadow:none}.dcard .num{font-size:10px;padding:2px 4px}.dcard .remove{display:block;opacity:0;width:22px;height:22px;z-index:2}.dcard:active .remove,.dcard:focus-within .remove{opacity:1}.empty-board{height:28vh;min-height:170px;background:#fff;color:#fff;padding:0}
.picker{margin-top:0;border-top:10px solid #e5e7eb;display:flex;flex-direction:column-reverse;background:#fff}.picker-top{position:relative;top:auto;background:#05070a;padding:8px 9px 10px;border:0}.picker-search{align-items:stretch}.picker-search input{border:0;border-radius:7px;padding:12px 13px;font-size:14px}.picker-search button{display:inline-flex}.picker-actions{display:flex;gap:8px;margin-top:0;flex:0 0 auto}.picker-actions button{border:0;background:#36a2bb;color:#fff;border-radius:6px;padding:9px 12px;font-size:12px;font-weight:700;min-width:82px}.picker-actions button:first-child{background:#fff;color:#59636a;text-align:center}.picker-actions button{white-space:nowrap}.quick{display:none}.picker-grid{display:flex;overflow-x:auto;overflow-y:hidden;gap:7px;padding:10px 9px 12px;background:#e6e7e8;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y}.pcard{flex:0 0 112px;width:112px;scroll-snap-align:start}.pcard img{width:100%;height:160px;aspect-ratio:auto;object-fit:cover;border-radius:3px;background:#ddd}.pcard button{width:30px;height:30px;font-size:22px;line-height:30px;right:3px;bottom:3px}.pcard .owned{font-size:10px}.pager{display:none}
.dm .cardcount{display:none}.dm .dm-footer{display:none}
.overlay{align-items:center;justify-content:center;padding:18px}.sheet{width:min(100%,760px);max-height:86dvh;border-radius:10px;padding:18px;box-shadow:0 12px 40px #0003}.sheet-head{margin-bottom:12px}.sheet h2{font-size:18px}.field label{font-size:13px}.field input,.field select{font-size:16px}
.detail-sheet{width:min(100%,760px);max-height:88dvh;background:#0b0e13;color:#fff;border-radius:8px;padding:10px;overflow:auto}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:10px}.detail-main img{width:100%;max-height:52dvh;object-fit:contain;background:#111}.detail-actions{display:flex;flex-direction:column;gap:7px}.detail-actions button{border:1px solid #39a6c0;background:#39a6c0;color:#fff;border-radius:5px;padding:9px 4px;font-size:12px}.detail-actions button.secondary{background:#fff;color:#2699b4}.detail-thumbs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.detail-thumbs img{height:88px;width:auto;border:2px solid transparent}.detail-thumbs img.selected{border-color:#39a6c0}.detail-count{display:flex;align-items:center;justify-content:center;gap:14px;font-size:22px;padding:6px}.detail-count button{width:38px;height:38px;border-radius:50%;border:2px solid #39a6c0;color:#39a6c0;background:transparent;font-size:24px}
@media(max-width:430px){.board{max-height:42vh}.pcard{flex-basis:106px;width:106px}.pcard img{height:151px}.dm-brandmark{font-size:20px}.zone-tabs button{font-size:14px}.overlay{padding:10px}.sheet{max-height:88dvh}}


/* Usability refinements: native-feeling sort choices and clearer active filters */
.sort-options{display:flex;flex-direction:column;gap:7px}.sort-option{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff;color:#111827}.sort-option.on{border:2px solid #111827;background:#f3f4f6;padding:11px}.sort-radio{font-size:20px;color:#111827;min-width:22px}.sort-option b{display:block;font-size:15px}.sort-option small{display:block;color:#6b7280;font-size:12px;margin-top:3px}.dm .board-grid{align-content:start}.dm .dcard{touch-action:manipulation}.dm .dcard .remove{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;opacity:.9;box-shadow:0 1px 3px #0004}
@media(max-width:430px){.dm{min-height:calc(100dvh - env(safe-area-inset-bottom));}.board{max-height:35vh;min-height:110px}.dm .picker-grid{min-height:175px}.dm .picker-top{padding-bottom:10px}.picker-search{gap:5px}.picker-actions{gap:5px}.picker-actions button{min-width:70px!important;padding:9px 7px;font-size:11px}}


/* Deck Maker filter refinements */
.deck-filter-sheet{overflow-y:auto;overscroll-behavior:contain}.choice-chips{max-height:145px;overflow:auto;padding:2px 1px}.choice-chips .chip{font-size:12px}.range-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tag-mode{margin:8px 0;display:flex;justify-content:flex-end;gap:8px}.tag-list{max-height:260px;overflow:auto;border-top:1px solid #d1d5db;border-bottom:1px solid #d1d5db}.tag-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid #e5e7eb;font-size:14px}.tag-row:last-child{border-bottom:0}.tag-row input{width:24px;height:24px;accent-color:#36a5bf;flex:0 0 auto}.filter-footer{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;bottom:-18px;background:#fff;padding:10px 0 2px}.filter-footer .btn{min-height:44px}.muted{color:#6b7280;font-size:12px}

/* Deck Maker interaction: horizontal card rail + swipe upward to add */

/* Final touch interaction and viewport fit */
body.deck-mode{height:100dvh;overflow:hidden}
body.deck-mode main{height:100dvh;overflow:hidden}

/* Oct 12 refinements: reclaim viewport space, scroll the whole deck board, and keep collection tabs in normal flow */
body:not(.deck-mode)>header{position:relative;top:auto}

<body>
<header>
<h1>デュエマ コレクション</h1>
<div class="head"><input id="globalSearch" placeholder="カード名・番号・種族で検索"><button class="gear" id="settingsBtn">⚙️</button></div>
</header>
<main>
<div class="tabs">
<button class="tab active" id="invTab">📦 所持カード</button>
<button class="tab" id="favTab">⭐ お気に入り</button>
<button class="tab" id="deckTab">🃏 デッキ</button>
</div>
<section id="inventory"><div class="status" id="invStatus">カードデータを読み込み中…</div><div id="cards"></div></section>
<section id="favorites" class="hidden"><div class="status" id="favStatus"></div><div id="favCards"></div></section>
<section id="decks" class="hidden"></section>
</main>

<script>
const S={
cards:[],owned:JSON.parse(localStorage.getItem('duema_owned_v3')||'{}'),
favs:JSON.parse(localStorage.getItem('duema_favorites_v1')||'{}'),
decks:JSON.parse(localStorage.getItem('duema_decks_v3')||'[]'),
deck:null,zone:'main',q:'',limit:72,sort:'recommended',
filter:{civ:'',race:'',rare:'',cost:''},deckFilter:{civ:'',civs:[],colorMode:'all',types:[],races:[],costMin:'',costMax:'',powerMin:'',powerMax:'',text:'',tags:[],tagMode:'or'},detailId:null
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem('duema_owned_v3',JSON.stringify(S.owned));localStorage.setItem('duema_favorites_v1',JSON.stringify(S.favs));localStorage.setItem('duema_decks_v3',JSON.stringify(S.decks))}
function faces(c){return Array.isArray(c?.sides)&&c.sides.length?c.sides:[c]}
function vals(c,k){
 const out=[]; const containers=['data','detail','details','card','cardData','card_data','metadata','info','attributes'];
 for(const face of [...new Set([c,...faces(c)])]){
  const roots=[face];
  for(let i=0;i<roots.length;i++){
   const root=roots[i]; if(!root||typeof root!=='object')continue;
   const value=root[k]; if(value!=null&&value!=='')out.push(...(Array.isArray(value)?value:[value]));
   if(i===0)for(const key of containers)if(root[key]&&typeof root[key]==='object')roots.push(root[key]);
  }
 }
 return out;
}
function split(v){if(v==null)return[];if(Array.isArray(v))return v.flatMap(split);if(typeof v==='object')return Object.values(v).flatMap(split);return String(v).split(/[／\/,、;；\n\r]+/).map(x=>x.trim()).filter(Boolean)}
function splitCiv(v){if(v==null)return[];if(Array.isArray(v))return v.flatMap(splitCiv);if(typeof v==='object')return Object.values(v).flatMap(splitCiv);return String(v).split(/[／\/・･,、;；\s]+/).map(x=>x.trim()).filter(Boolean)}
function name(c){return c.name||c._name||c.cardName||''}
function num(c){return c.number||c.id||''}
function id(c){return String(c.id||c.number||'')}
function civ(c){return [...new Set(['civilization','civilizations','civility','culture','文明','文明名','civilization_name'].flatMap(k=>vals(c,k).flatMap(splitCiv)))]}
function race(c){return [...new Set(['race','races','species','species_name','speciesName','raceName','race_name','tribe','tribes','tribeName','tribe_name','種族','種族名'].flatMap(k=>vals(c,k).flatMap(split)))]}
function rare(c){return [...new Set(['rarity','rare','レアリティ'].flatMap(k=>vals(c,k).flatMap(split)))]}
function type(c){return [...new Set(['type','types','card_type','cardType','card_type_name','cardTypeName','card_types','cardTypes','kind','card_kind','cardKind','type_name','typeName','カードタイプ','カード種別','種類'].flatMap(k=>vals(c,k).flatMap(split)))]}
function cost(c){let n=parseInt(vals(c,'cost')[0],10);return Number.isFinite(n)?n:999}
function text(c){let ks=['specialAbility','special_ability','specialAbilities','abilities','ability','card_text','text','effect','effects'];let a=[];faces(c).forEach(f=>ks.forEach(k=>{let v=f?.[k];if(Array.isArray(v))a.push(v.join(' '));else if(v)a.push(String(v))}));return a.join(' ')}
const aliases={'龍装チュリス':['ドルガン','ドル','ドルガンチュリス'],'蒼き団長ドギラゴン剣':['ドギ剣'],'天災デドダム':['デドダム'],'流星のガイアッシュカイザー':['ガイアッシュ'],'飛翔龍5000VT':['5000vt','5000ＶＴ'],'アーテルゴルギーニ':['アーテル'],'邪幽ジャガイスト':['ジャガイスト']};
function norm(s){return String(s||'').toLowerCase().normalize('NFKC').replace(/[\s　・･\-‐‑–—ー_「」『』【】〔〕（）()\[\]]/g,'').replace(/[ぁ-ゖ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+96))}
function searchText(c){let a=[name(c),num(c),...civ(c),...race(c),...rare(c),...type(c),text(c)];Object.entries(aliases).forEach(([n,as])=>{if(norm(n)===norm(name(c)))a.push(...as)});return norm(a.join(' '))}
// デッキメーカーのカード名検索は、種族・効果・カード番号ではなくカード名だけを対象にする。既知の通称は検索語としてのみ補助する。
function deckNameSearch(c){let a=[name(c)];Object.entries(aliases).forEach(([n,as])=>{if(norm(n)===norm(name(c)))a.push(...as)});return norm(a.join(' '))}
function image(c){let u=String(c.image||'').trim();if(u){if(/^https?:\/\//i.test(u))return u;if(u.startsWith('//'))return 'https:'+u;if(u.startsWith('/'))return 'https://dm.takaratomy.co.jp'+u;if(u.startsWith('wp-content/'))return 'https://dm.takaratomy.co.jp/'+u}let x=String(c.number||c.id||'').trim();return x?'https://dm.takaratomy.co.jp/wp-content/card/cardimage/'+encodeURIComponent(x)+'.jpg':''}
function img(c,cls=''){return `<img class="${cls}" loading="lazy" src="${esc(image(c))}" onerror="this.style.visibility='hidden'">`}
function filtered(){let q=norm(S.q),f=S.filter;return S.cards.filter(c=>{let st=searchText(c);if(q&&!st.includes(q))return false;if(f.civ&&!civ(c).includes(f.civ))return false;if(f.race&&!race(c).some(x=>norm(x).includes(norm(f.race))))return false;if(f.rare&&!rare(c).includes(f.rare))return false;if(f.cost!==''&&cost(c)!==Number(f.cost))return false;return true})}
function cardHtml(c){let k=id(c),n=S.owned[k]||0;return `<div class="card" data-id="${esc(k)}">${img(c)}<div class="info"><h3>${esc(name(c))}</h3><span class="tag">${esc(num(c))}</span><div class="meta">${esc(civ(c).join(' / '))}　${esc(type(c).join(' / '))}<br>コスト ${esc(vals(c,'cost')[0]||'—')}　${esc(vals(c,'power')[0]||'')}</div></div><button class="fav" data-fav="${esc(k)}">${S.favs[k]?'★':'☆'}</button><div class="qty"><button data-minus="${esc(k)}">−</button><b>${n}</b><button data-plus="${esc(k)}">＋</button></div></div>`}
function renderInventory(){let a=filtered(),show=a.slice(0,150);$('invStatus').textContent=`カード ${a.length.toLocaleString()} 枚を表示${a.length>150?'（先頭150枚）':''}`;$('cards').innerHTML=show.map(cardHtml).join('')||'<div class="status">該当カードなし</div>'}
function renderFav(){let a=S.cards.filter(c=>S.favs[id(c)]);$('favStatus').textContent=`お気に入り ${a.length} 枚`;$('favCards').innerHTML=a.map(cardHtml).join('')||'<div class="status">お気に入りカードはありません</div>'}
function switchTab(t){$('inventory').classList.toggle('hidden',t!=='inv');$('favorites').classList.toggle('hidden',t!=='fav');$('decks').classList.toggle('hidden',t!=='deck');$('invTab').classList.toggle('active',t==='inv');$('favTab').classList.toggle('active',t==='fav');$('deckTab').classList.toggle('active',t==='deck');if(t==='inv')renderInventory();if(t==='fav')renderFav();if(t==='deck')renderDecks()}
function deckMain(d){return d.main||{}}
function totalZone(z){return Object.values(z||{}).reduce((a,b)=>a+Number(b||0),0)}
function ensureDeck(d){d.main=d.main||{};d.gr=d.gr||{};d.extra=d.extra||{};d.format=d.format||'オリジナル'}
function renderDecks(){if(!S.decks.length){$('decks').innerHTML=`<div style="padding:15px"><button class="btn green" id="newDeck">＋ 新しいデッキ</button><div class="status" style="padding:15px 0">まだデッキがありません。</div></div>`;$('newDeck').onclick=newDeck;return}
$('decks').innerHTML=`<div style="padding:10px"><button class="btn green" id="newDeck">＋ 新しいデッキ</button></div><div class="deck-list">${S.decks.map((d,i)=>{ensureDeck(d);let n=totalZone(d.main);return `<div class="deck-row"><strong>${esc(d.name||'デッキ')}</strong><br><small>メイン ${n}枚　GR ${totalZone(d.gr)}枚　超次元 ${totalZone(d.extra)}枚</small><div class="actions"><button class="btn" data-open="${i}">開く</button><button class="btn gray" data-copy="${i}">複製</button><button class="btn red" data-del="${i}">削除</button></div></div>`}).join('')}</div>`;
$('newDeck').onclick=newDeck;$('decks').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDeck(+b.dataset.open));$('decks').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{let d=JSON.parse(JSON.stringify(S.decks[+b.dataset.copy]));d.name=(d.name||'デッキ')+' コピー';S.decks.push(d);save();renderDecks()});$('decks').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('このデッキを削除しますか？')){S.decks.splice(+b.dataset.del,1);save();renderDecks()}})}
function newDeck(){S.decks.push({name:'新しいデッキ',format:'オリジナル',main:{},gr:{},extra:{}});save();openDeck(S.decks.length-1)}
function openDeck(i){S.deck=i;ensureDeck(S.decks[i]);S.zone='main';S.q='';S.limit=72;S.deckFilter={civ:'',civs:[],colorMode:'all',types:[],races:[],costMin:'',costMax:'',powerMin:'',powerMax:'',text:'',tags:[],tagMode:'or'};document.body.classList.add('deck-mode');renderEditor()}
function currentZone(){let d=S.decks[S.deck];return S.zone==='main'?d.main:S.zone==='gr'?d.gr:d.extra}
function zoneMax(){return S.zone==='main'?Infinity:S.zone==='gr'?12:8}
function zoneLabel(){return S.zone==='main'?'メイン':S.zone==='gr'?'GR':'超次元'}
function zoneTotal(){return totalZone(currentZone())}
function hasTag(c,t){
 const effect=norm(text(c)), races=race(c).map(norm), types=type(c).map(norm);
 const has=(...terms)=>terms.some(x=>effect.includes(norm(x)));
 const directTags=['tags','tag','ability_tags','abilityTags','keyword_abilities','keywordAbilities','keywords','能力タグ','タグ'].flatMap(k=>vals(c,k).flatMap(split)).map(norm);
 const directAliases={ 'サーチ（カード対象）':['サーチ','カードサーチ','サーチ（カード）'], 'サーチ（クリーチャー対象）':['クリーチャーサーチ'], 'サーチ（呪文対象）':['呪文サーチ'], 'サーチ（その他）':['その他サーチ'], 'ドラゴン':['ドラゴンを含む種族'], 'コマンド':['コマンドを含む種族'] };
 if(directTags.some(v=>v===norm(t)||(directAliases[t]||[]).some(a=>v===norm(a))))return true;
 if(t==='ドラゴン')return races.some(x=>x.includes(norm('ドラゴン')));
 if(t==='コマンド')return races.some(x=>x.includes(norm('コマンド')));
 if(t==='サーチ（カード対象）')return has('山札を見る','山札から','山札の中から','山札を見て')&&has('カードを1枚','カードを一枚','カードを手札に','カードを加える','カードを選び');
 if(t==='サーチ（クリーチャー対象）')return has('山札を見る','山札から','山札の中から','山札を見て')&&has('クリーチャーを1体','クリーチャーを一体','クリーチャーを手札に','クリーチャーを加える','クリーチャーを選び');
 if(t==='サーチ（呪文対象）')return has('山札を見る','山札から','山札の中から','山札を見て')&&has('呪文を1枚','呪文を一枚','呪文を手札に','呪文を加える','呪文を選び');
 if(t==='サーチ（その他）')return has('山札を見る','山札から','山札の中から','山札を見て')&&has('進化','タマシード','ツインパクト','ドラゴン','種族');
 if(t==='ドロー')return has('カードを引く','カードを1枚引く','カードを一枚引く','カードを2枚引く','カードを二枚引く','カードを3枚引く','カードを三枚引く','カードを引いて');
 if(t==='ブロッカー')return has('ブロッカー')||effect.includes(norm('ブロックできる'));
 if(t==='アンタップ')return has('アンタップする','アンタップさせる');
 if(t==='マナ回収')return has('マナゾーンから')&&has('手札に戻す','手札に加える','手札に戻して');
 if(t==='手札補充')return has('カードを引く','カードを手札に加える','手札に加える');
 if(t==='シールド回収')return has('シールドを手札に加える','シールドを手札に戻す');
 if(t==='ニンジャ・ストライク')return has('ニンジャ・ストライク');
 if(t==='革命チェンジ')return has('革命チェンジ');
 if(t==='侵略')return has('侵略');
 if(t==='連鎖')return has('連鎖');
 if(t==='マナ武装')return has('マナ武装');
 if(t==='革命')return has('革命');
 if(t==='ジョーカーズ')return races.some(x=>x.includes(norm('ジョーカーズ')));
 if(t==='メタ')return has('できない','させない','無視する','禁止する');
 if(t==='ロック')return has('できない','使えない','攻撃できない','唱えられない');
 if(t==='ブロックされない')return has('ブロックされない','ブロックされない');
 if(t==='破壊されない')return has('破壊されない','破壊されなくなる');
 if(t==='選ばれない')return has('選ばれない','選ぶことができない');
 if(t==='EXライフ')return has('exライフ');
 if(t==='エスケープ')return has('エスケープ');
 if(t==='離れない')return has('離れない','バトルゾーンを離れない');
 if(t==='Q・ブレイカー')return has('qブレイカー','クアドラプルブレイカー');
 if(t==='ワールド・ブレイカー')return has('ワールドブレイカー');
 if(t==='進化')return types.some(x=>x.includes(norm('進化')))||has('進化クリーチャー');
 if(t==='ツインパクト')return types.some(x=>x.includes(norm('ツインパクト'))) || (faces(c).length>1);
 if(t==='墓地肥やし')return has('墓地に置く','墓地に落とす','墓地を肥やす');
 if(t==='山札操作')return has('山札の上','山札の下','山札を見て');
 if(t==='コスト軽減')return has('コストを少なく','コストを少なくする','コストを支払わず');
 if(t==='コスト踏み倒し')return has('コストを支払わず','コストを支払わないで','コストを払わず');
 if(t==='追加ターン')return has('追加ターン');
 if(t==='敗北回避')return has('ゲームに負けない','敗北しない','負けない');
 if(t==='除去')return has('破壊する','持ち主の手札に戻す','山札の一番下','マナゾーンに置く','シールド化する','封印する','超次元ゾーンに置く');
 if(t==='破壊')return has('破壊する','破壊された時','破壊される');
 if(t==='バウンス')return has('手札に戻す','持ち主の手札に戻す');
 if(t==='タップ')return has('タップする','タップさせる');
 if(t==='マナ加速')return has('マナゾーンに置く','マナを加える','マナゾーンに加える');
 if(t==='墓地回収')return has('墓地から','墓地にある','墓地の')&&has('手札に戻す','手札に加える','手札に戻して');
 if(t==='蘇生')return has('墓地からバトルゾーン','墓地から出す','墓地から召喚');
 if(t==='ハンデス')return has('手札を捨てる','捨てさせる','相手の手札');
 if(t==='シールド追加')return has('シールドを1つ','シールドを一つ','シールド化する','シールドゾーンに置く');
 if(t==='シールド焼却')return has('シールドをブレイクすることはできない','シールドを墓地に置く','シールドを手札に加える');
 if(t==='スピードアタッカー')return has('スピードアタッカー');
 if(t==='マッハファイター')return has('マッハファイター');
 if(t==='ジャストダイバー')return has('ジャストダイバー');
 if(t==='W・ブレイカー')return has('wブレイカー','ダブルブレイカー');
 if(t==='T・ブレイカー')return has('tブレイカー','トリプルブレイカー');
 if(t==='S・トリガー')return has('sトリガー','シールドトリガー');
 if(t==='G・ストライク')return has('gストライク');
 return has(t);
}
function deckCards(){let z=currentZone();return Object.entries(z).map(([k,q])=>{let c=S.cards.find(x=>id(x)===k);return c?{c,q:Number(q)}:null}).filter(Boolean)}
function add(k){let z=currentZone();let cur=Number(z[k]||0);if(zoneMax()!==Infinity&&zoneTotal()>=zoneMax())return;if(S.zone==='main'&&cur>=4)return;z[k]=cur+1;save();renderEditor()}
function remove(k){let z=currentZone();if(!z[k])return;z[k]--;if(z[k]<=0)delete z[k];save();renderEditor()}
function renderEditor(){
const oldPicker=document.querySelector('.picker-grid');const oldBoard=document.querySelector('.board');const pickerTop=oldPicker?oldPicker.scrollTop:0;const pickerLeft=oldPicker?oldPicker.scrollLeft:0;const boardTop=oldBoard?oldBoard.scrollTop:0;const pageY=window.scrollY||0;
let d=S.decks[S.deck],cards=deckCards();
let results=S.cards.filter(c=>{let q=norm(S.q);if(q&&!deckNameSearch(c).includes(q))return false;let f=S.deckFilter||{};let selectedCivs=Array.isArray(f.civs)&&f.civs.length?f.civs:(f.civ?[f.civ]:[]);if(selectedCivs.length&&!selectedCivs.some(x=>civ(c).includes(x)))return false;if(f.colorMode==='single'&&civ(c).length!==1)return false;if(f.colorMode==='multi'&&civ(c).length<2)return false;let selectedTypes=Array.isArray(f.types)?f.types:(f.type?[f.type]:[]);if(selectedTypes.length&&!selectedTypes.some(x=>type(c).some(t=>norm(t).includes(norm(x)))))return false;let selectedRaces=Array.isArray(f.races)?f.races:(f.race?[f.race]:[]);if(selectedRaces.length&&!selectedRaces.some(x=>race(c).some(r=>norm(r).includes(norm(x)))))return false;if(f.costMin!==''&&f.costMin!=null&&cost(c)<Number(f.costMin))return false;if(f.costMax!==''&&f.costMax!=null&&cost(c)>Number(f.costMax))return false;let power=Number.parseInt(vals(c,'power')[0],10);if(f.powerMin!==''&&f.powerMin!=null&&(!Number.isFinite(power)||power<Number(f.powerMin)))return false;if(f.powerMax!==''&&f.powerMax!=null&&(!Number.isFinite(power)||power>Number(f.powerMax)))return false;if(f.text&&!norm(text(c)).includes(norm(f.text)))return false;let selectedTags=Array.isArray(f.tags)?f.tags:(f.tag?[f.tag]:[]);if(selectedTags.length){let matches=selectedTags.map(t=>hasTag(c,t));if((f.tagMode||'or')==='and'?!matches.every(Boolean):!matches.some(Boolean))return false}return true});
if(S.sort==='latest')results=results.slice().reverse();if(S.sort==='name')results=results.slice().sort((a,b)=>name(a).localeCompare(name(b),'ja'));if(S.sort==='cost')results=results.slice().sort((a,b)=>cost(a)-cost(b));if(S.sort==='owned')results=results.slice().sort((a,b)=>(Number(S.owned[id(b)]||0)-Number(S.owned[id(a)]||0))||name(a).localeCompare(name(b),'ja'));
let vis=results.slice(0,100),mainCount=totalZone(d.main);
$('decks').innerHTML=`<div class="dm">
<div class="dm-head"><div class="dm-brand"><button class="dm-back" id="deckBack" aria-label="デッキ一覧に戻る">‹ 戻る</button><div class="dm-brandmark">≋ DECK MAKER<small>デュエル・マスターズ</small></div><div class="dm-topactions"><button id="clearZone"><strong>▤</strong>全削除</button><button id="save"><strong>☑</strong>保存</button></div></div>
<div class="zone-tabs"><button class="${S.zone==='main'?'active':''}" data-zone="main">メイン ${mainCount}</button><div class="zone-combined"><button class="${S.zone==='gr'?'active':''}" data-zone="gr">GR ${totalZone(d.gr)}／12</button><button class="${S.zone==='extra'?'active':''}" data-zone="extra">超次元 ${totalZone(d.extra)}／8</button></div></div></div>

body.deck-mode .board-wrap{flex:1 1 auto!important;min-height:0!important;max-height:none!important;overflow:hidden!important}

 body.deck-mode .picker{flex:0 0 25dvh!important;max-height:25dvh!important}
 body.deck-mode .board-grid.many-cards .dcard img{height:clamp(58px,10.5dvh,88px)!important}
