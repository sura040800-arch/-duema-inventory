name: Update Duel Masters Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4

      - name: Scrape official card list
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          import json
          import os
          import re
          import sys
          import time

          BASE = "https://dm.takaratomy.co.jp"
          START_URL = BASE + "/card/"

          session = requests.Session()

          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/131.0 Safari/537.36"
              )
          })

          def get_cards(html):
              soup = BeautifulSoup(html, "html.parser")

              cards = []
              seen = set()

              cardlist = soup.select(
                  '#cardlist a[href*="/card/detail/"]'
              )

              for a in cardlist:

                  href = a.get("href")

                  if not href:
                      continue

                  full_url = urljoin(
                      BASE,
                      href
                  )

                  match = re.search(
                      r"[?&]id=([^&]+)",
                      full_url
                  )

                  if not match:
                      continue

                  card_id = match.group(1)

                  if card_id in seen:
                      continue

                  seen.add(card_id)

                  name = a.get_text(
                      " ",
                      strip=True
                  )

                  cards.append({
                      "id": card_id,
                      "name": name,
                      "number": "",
                      "url": full_url
                  })

              return cards

          def get_form_data(html, page_number):
              soup = BeautifulSoup(
                  html,
                  "html.parser"
              )

              form = soup.select_one(
                  "#search_cond"
              )

              if form is None:
                  raise RuntimeError(
                      "search_cond form not found"
                  )

              data = {}

              # hidden / text / number
              for inp in form.select("input"):

                  name = inp.get("name")

                  if not name:
                      continue

                  input_type = (
                      inp.get(
                          "type",
                          "text"
                      ).lower()
                  )

                  if input_type in [
                      "submit",
                      "button",
                      "reset",
                      "file"
                  ]:
                      continue

                  if input_type in [
                      "checkbox",
                      "radio"
                  ]:
                      if not inp.has_attr("checked"):
                          continue

                  data.setdefault(
                      name,
                      []
                  ).append(
                      inp.get("value", "")
                  )

              # select
              for select in form.select(
                  "select"
              ):

                  name = select.get("name")

                  if not name:
                      continue

                  selected = select.select(
                      "option[selected]"
                  )

                  if not selected:
                      selected = select.select(
                          "option"
                      )[:1]

                  for option in selected:

                      data.setdefault(
                          name,
                          []
                      ).append(
                          option.get(
                              "value",
                              ""
                          )
                      )

              # textarea
              for textarea in form.select(
                  "textarea"
              ):

                  name = textarea.get("name")

                  if name:
                      data.setdefault(
                          name,
                          []
                      ).append(
                          textarea.get_text()
                      )

              # ページ番号を上書き
              data["pagenum"] = [
                  str(page_number)
              ]

              # requests用に
              # 同名項目を正しく送る
              pairs = []

              for key, values in data.items():

                  for value in values:
                      pairs.append(
                          (key, value)
                      )

              return pairs

          print(
              "公式カード検索を開いています..."
          )

          response = session.get(
              START_URL,
              timeout=60
          )

          print(
              "GET HTTP:",
              response.status_code
          )

          if response.status_code != 200:
              print(
                  "ERROR: 公式サイトに接続できません"
              )
              sys.exit(1)

          # =============================
          # 1ページ目
          # =============================

          first_html = response.text

          first = get_cards(
              first_html
          )

          print("")
          print(
              "1ページ目カード数:",
              len(first)
          )

          print(
              "1ページ目:",
              [
                  x["id"]
                  for x in first[:5]
              ]
          )

          if len(first) == 0:
              print(
                  "ERROR: 1ページ目のカード取得失敗"
              )
              sys.exit(1)

          all_cards = []
          seen_ids = set()

          for card in first:

              if card["id"] not in seen_ids:

                  seen_ids.add(
                      card["id"]
                  )

                  all_cards.append(
                      card
                  )

          previous_ids = [
              x["id"]
              for x in first
          ]

          current_html = first_html

          # =============================
          # 2ページ目以降
          # =============================

          for page_number in range(
              2,
              501
          ):

              print("")
              print(
                  "=============================="
              )
              print(
                  f"{page_number}ページ目を取得中..."
              )
              print(
                  "=============================="
              )

              try:

                  form_data = get_form_data(
                      current_html,
                      page_number
                  )

              except Exception as e:

                  print(
                      "フォーム取得エラー:",
                      e
                  )

                  sys.exit(1)

              post_response = session.post(
                  START_URL,
                  data=form_data,
                  timeout=60,
                  allow_redirects=True
              )

              print(
                  "POST HTTP:",
                  post_response.status_code
              )

              if post_response.status_code != 200:

                  print(
                      "ERROR: POST失敗"
                  )

                  sys.exit(1)

              current_html = (
                  post_response.text
              )

              current = get_cards(
                  current_html
              )

              print(
                  f"{page_number}ページ目カード数:",
                  len(current)
              )

              if not current:

                  print(
                      "カードがなくなったので終了"
                  )

                  break

              current_ids = [
                  x["id"]
                  for x in current
              ]

              print(
                  "先頭3枚:",
                  current_ids[:3]
              )

              # 同じカードなら終了
              if current_ids == previous_ids:

                  print(
                      "前ページと同じカードです。"
                  )

                  print(
                      "最終ページとして終了します。"
                  )

                  break

              new_count = 0

              for card in current:

                  if card["id"] not in seen_ids:

                      seen_ids.add(
                          card["id"]
                      )

                      all_cards.append(
                          card
                      )

                      new_count += 1

              print(
                  "今回の新規カード:",
                  new_count
              )

              print(
                  "累計カード数:",
                  len(all_cards)
              )

              if new_count == 0:

                  print(
                      "新しいカードがないため終了"
                  )

                  break

              previous_ids = current_ids

              time.sleep(0.5)

          # =============================
          # 最終確認
          # =============================

          print("")
          print(
              "================================"
          )
          print(
              "最終取得カード数:",
              len(all_cards)
          )
          print(
              "================================"
          )

          if len(all_cards) < 1000:

              print(
                  "ERROR: 取得枚数が少なすぎます"
              )

              print(
                  "cards.jsonは変更しません。"
              )

              sys.exit(1)

          # =============================
          # 保存
          # =============================

          os.makedirs(
              "data",
              exist_ok=True
          )

          with open(
              "data/cards.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  all_cards,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "data/cards.jsonを更新しました。"
          )

          PY

      - name: Commit cards.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cards.json

          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update Duel Masters card data"
            git push
          fi
