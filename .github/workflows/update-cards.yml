name: Test Duel Masters Official Click

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Test official click
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          import re
          import sys

          URL = "https://dm.takaratomy.co.jp/card/"

          def get_ids(html):
              soup = BeautifulSoup(html, "html.parser")
              ids = []

              for a in soup.select('a[href*="/card/detail/?id="]'):
                  href = a.get("href", "")

                  m = re.search(r"[?&]id=([^&]+)", href)

                  if m:
                      card_id = m.group(1)

                      if card_id not in ids:
                          ids.append(card_id)

              return ids

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page()

              # ネットワーク監視
              def on_request(request):
                  if request.method != "GET" or "/card/" in request.url:
                      print("")
                      print("REQUEST")
                      print("method:", request.method)
                      print("url:", request.url)

                      if request.post_data:
                          print("post_data:", request.post_data[:2000])

              def on_response(response):
                  if "/card/" in response.url:
                      print("")
                      print("RESPONSE")
                      print("status:", response.status)
                      print("url:", response.url)

              page.on("request", on_request)
              page.on("response", on_response)

              print("公式カード検索を開きます...")

              page.goto(
                  URL,
                  wait_until="networkidle",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              ids1 = get_ids(page.content())

              print("")
              print("==============================")
              print("1ページ目")
              print("==============================")
              print("カード数:", len(ids1))
              print("先頭5枚:", ids1[:5])
              print("最後5枚:", ids1[-5:])

              if len(ids1) == 0:
                  print("ERROR: 1ページ目が取得できません")
                  sys.exit(1)

              # ページ2のボタン確認
              button = page.locator(
                  '#cardlist .wp-pagenavi a[data-page="2"]'
              )

              print("")
              print("ページ2ボタン数:", button.count())

              if button.count() == 0:
                  print("ERROR: ページ2ボタンがありません")
                  sys.exit(1)

              print("ページ2ボタンを公式JS経由でクリックします...")

              # 公式サイトと同じjQueryイベントを発火
              result = page.evaluate("""
              () => {
                  const el =
                      document.querySelector(
                          '#cardlist .wp-pagenavi a[data-page="2"]'
                      );

                  if (!el) {
                      return {
                          ok: false,
                          error: "page2 button not found"
                      };
                  }

                  if (typeof window.jQuery === "undefined") {
                      return {
                          ok: false,
                          error: "jQuery not found"
                      };
                  }

                  window.jQuery(el).trigger("click");

                  return {
                      ok: true,
                      pagenum:
                          document.querySelector(
                              '#search_cond input[name="pagenum"]'
                          )?.value
                  };
              }
              """)

              print("")
              print("クリック結果:", result)

              if not result.get("ok"):
                  print("ERROR:", result.get("error"))
                  sys.exit(1)

              # Ajax完了待ち
              print("")
              print("Ajax処理を待っています...")

              page.wait_for_timeout(8000)

              ids2 = get_ids(page.content())

              print("")
              print("==============================")
              print("クリック後")
              print("==============================")
              print("URL:", page.url)
              print("カード数:", len(ids2))
              print("先頭5枚:", ids2[:5])
              print("最後5枚:", ids2[-5:])

              print("")
              print("==============================")
              print("結果")
              print("==============================")

              print(
                  "1ページ目と2ページ目が同じ:",
                  ids1 == ids2
              )

              if len(ids2) == 0:
                  print("")
                  print("ERROR: クリック後のカードが0枚です")
                  sys.exit(1)

              if ids1 == ids2:
                  print("")
                  print("ERROR: ページが変わっていません")
                  sys.exit(1)

              print("")
              print("SUCCESS!")
              print("公式のページ切り替えに成功しました。")

              browser.close()

          PY
