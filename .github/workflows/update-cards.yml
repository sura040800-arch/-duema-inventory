name: Debug Duel Masters Network

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Debug official site
        run: |
          python - <<'PY'
          import re
          import time
          from playwright.sync_api import sync_playwright

          URL = "https://dm.takaratomy.co.jp/card/"

          def get_ids(page):
              links = page.locator(
                  'a[href*="/card/detail/?id="]'
              ).all()

              result = []

              for link in links:
                  href = link.get_attribute("href")

                  if href:
                      m = re.search(
                          r'id=([^&"]+)',
                          href
                      )

                      if m:
                          result.append(m.group(1))

              return list(dict.fromkeys(result))

          with sync_playwright() as p:

              print("================================")
              print("ブラウザ起動")
              print("================================")

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  viewport={
                      "width": 390,
                      "height": 844
                  },
                  user_agent=(
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                      "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                      "Version/18.0 Mobile/15E148 Safari/604.1"
                  )
              )

              page = context.new_page()

              # -----------------------------
              # JavaScriptエラーを取得
              # -----------------------------

              page.on(
                  "console",
                  lambda msg:
                      print(
                          "CONSOLE:",
                          msg.type,
                          msg.text
                      )
              )

              page.on(
                  "pageerror",
                  lambda error:
                      print(
                          "PAGE ERROR:",
                          error
                      )
              )

              # -----------------------------
              # 通信を記録
              # -----------------------------

              requests = []

              def on_request(request):

                  url = request.url

                  if (
                      "takaratomy.co.jp" in url
                      or "ajax" in url.lower()
                      or "api" in url.lower()
                  ):
                      requests.append(
                          (
                              "REQUEST",
                              request.method,
                              url
                          )
                      )

                      print(
                          "REQUEST:",
                          request.method,
                          url
                      )

              def on_response(response):

                  url = response.url

                  if (
                      "takaratomy.co.jp" in url
                      or "ajax" in url.lower()
                      or "api" in url.lower()
                  ):
                      print(
                          "RESPONSE:",
                          response.status,
                          url
                      )

              page.on(
                  "request",
                  on_request
              )

              page.on(
                  "response",
                  on_response
              )

              # -----------------------------
              # 公式サイトを開く
              # -----------------------------

              print("")
              print("公式サイトを開きます")

              page.goto(
                  URL,
                  wait_until="networkidle",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              ids1 = get_ids(page)

              print("")
              print("================================")
              print("1ページ目")
              print("================================")
              print(
                  "カード数:",
                  len(ids1)
              )
              print(
                  "先頭:",
                  ids1[:5]
              )
              print(
                  "末尾:",
                  ids1[-5:]
              )

              # -----------------------------
              # 2ページ目候補を探す
              # -----------------------------

              print("")
              print("================================")
              print("ページ2を探します")
              print("================================")

              candidates = []

              for element in page.locator("a").all():

                  text = (
                      element.inner_text() or ""
                  ).strip()

                  if text == "2":
                      candidates.append(element)

              print(
                  "2の候補数:",
                  len(candidates)
              )

              if not candidates:

                  raise RuntimeError(
                      "ページ2の要素が見つかりませんでした。"
                  )

              # -----------------------------
              # クリック前の通信数
              # -----------------------------

              before_count = len(requests)

              print("")
              print(
                  "クリック前の通信数:",
                  before_count
              )

              # -----------------------------
              # ページ2をクリック
              # -----------------------------

              element = candidates[0]

              print("")
              print("ページ2をクリックします")

              element.scroll_into_view_if_needed()

              box = element.bounding_box()

              print(
                  "座標:",
                  box
              )

              if box:

                  page.mouse.click(
                      box["x"] + box["width"] / 2,
                      box["y"] + box["height"] / 2
                  )

              else:

                  print(
                      "座標が取得できませんでした"
                  )

              print("")
              print("クリック後10秒待ちます")

              for i in range(10):

                  time.sleep(1)

                  print(
                      i + 1,
                      "秒"
                  )

              # -----------------------------
              # クリック後
              # -----------------------------

              ids2 = get_ids(page)

              print("")
              print("================================")
              print("クリック後")
              print("================================")

              print(
                  "現在URL:",
                  page.url
              )

              print(
                  "カード数:",
                  len(ids2)
              )

              print(
                  "先頭:",
                  ids2[:5]
              )

              print(
                  "末尾:",
                  ids2[-5:]
              )

              # -----------------------------
              # 新しく発生した通信
              # -----------------------------

              print("")
              print("================================")
              print("クリック後に発生した通信")
              print("================================")

              new_requests = requests[
                  before_count:
              ]

              print(
                  "通信数:",
                  len(new_requests)
              )

              for item in new_requests:

                  print(
                      item
                  )

              # -----------------------------
              # ページ内のscript
              # -----------------------------

              print("")
              print("================================")
              print("読み込まれたJavaScript")
              print("================================")

              scripts = page.locator(
                  "script[src]"
              ).all()

              print(
                  "script数:",
                  len(scripts)
              )

              for script in scripts:

                  src = script.get_attribute(
                      "src"
                  )

                  if src:
                      print(
                          "SCRIPT:",
                          src
                      )

              # -----------------------------
              # 結果
              # -----------------------------

              print("")
              print("================================")
              print("診断結果")
              print("================================")

              print(
                  "1ページ目カード数:",
                  len(ids1)
              )

              print(
                  "クリック後カード数:",
                  len(ids2)
              )

              print(
                  "カードが変わった:",
                  ids1 != ids2
              )

              print(
                  "クリック後通信数:",
                  len(new_requests)
              )

              print("")
              print("診断終了")

              browser.close()

          PY
