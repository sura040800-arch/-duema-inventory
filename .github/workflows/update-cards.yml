name: Debug Duel Masters POST

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Inspect POST request
        run: |
          python - <<'PY'
          import requests

          url = "https://dm.takaratomy.co.jp/common/js/search.js"

          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          )

          lines = r.text.splitlines()

          print("=" * 80)
          print("【$.ajax 周辺を完全表示】")
          print("=" * 80)

          # search.js の 200〜230行付近
          for i in range(195, 235):
              if i < len(lines):
                  print(f"{i + 1:04d}: {lines[i]}")

          print("\n")
          print("=" * 80)
          print("【$.ajax がある場所をすべて表示】")
          print("=" * 80)

          for i, line in enumerate(lines):
              if "$.ajax" in line:
                  print(f"\n--- $.ajax 発見: {i + 1}行目 ---")

                  start = max(0, i - 10)
                  end = min(len(lines), i + 40)

                  for j in range(start, end):
                      print(f"{j + 1:04d}: {lines[j]}")

          print("\n")
          print("=" * 80)
          print("調査終了")
          print("=" * 80)
          PY
