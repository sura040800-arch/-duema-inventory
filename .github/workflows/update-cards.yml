name: Debug Duel Masters Ajax

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Inspect Ajax functions
        run: |
          python - <<'PY'
          import requests

          url = "https://dm.takaratomy.co.jp/common/js/search.js"

          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          )

          print("HTTP:", r.status_code)
          print("文字数:", len(r.text))

          lines = r.text.splitlines()

          # ------------------------------------------------
          # doAjax を探す
          # ------------------------------------------------

          print("\n" + "=" * 80)
          print("【doAjax 周辺】")
          print("=" * 80)

          for i, line in enumerate(lines):
              if "function doAjax" in line or "doAjax =" in line:
                  start = max(0, i - 20)
                  end = min(len(lines), i + 100)

                  print(f"\n見つかった行: {i + 1}")
                  print("-" * 80)

                  for j in range(start, end):
                      print(f"{j + 1:04d}: {lines[j]}")

          # ------------------------------------------------
          # research 関数
          # ------------------------------------------------

          print("\n" + "=" * 80)
          print("【research 関数】")
          print("=" * 80)

          for i, line in enumerate(lines):
              if "function research(data)" in line:
                  start = i
                  end = min(len(lines), i + 130)

                  for j in range(start, end):
                      print(f"{j + 1:04d}: {lines[j]}")

          # ------------------------------------------------
          # Ajax関連の行
          # ------------------------------------------------

          print("\n" + "=" * 80)
          print("【Ajax関連】")
          print("=" * 80)

          keywords = [
              "$.ajax",
              "url:",
              "type:",
              "method:",
              "data:",
              "success:",
              "error:",
              "POST",
              "GET",
              "serialize",
              "html",
              "replace",
              "cardlist",
          ]

          for i, line in enumerate(lines, 1):
              if any(k.lower() in line.lower() for k in keywords):
                  print(f"{i:04d}: {line}")

          print("\n" + "=" * 80)
          print("調査終了")
          print("=" * 80)
          PY
