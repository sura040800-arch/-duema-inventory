name: Test Duel Masters Click

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Test official page switch
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          import re
          import sys
          import time

          URL = "https://dm.takaratomy.co.jp/card/"

          def get_ids(html):
              soup = BeautifulSoup(html, "html.parser")
              ids = []

              for a in soup.select('a[href*="/card/detail/?id="]'):
                  href = a.get("href", "")
                  m = re.search(r"[?&]id=([^&]+)", href)

                  if m:
                      card_id = m.group(1)

                      if card_id not in ids:
                          ids.append(card_id)

              return ids

          print("公式カード検索を開きます...")

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page()

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(4000)

              ids1 = get_ids(page.content())

              print("")
              print("==============================")
              print("1ページ目")
              print("==============================")
              print("URL:", page.url)
              print("カード数:", len(ids1))
              print("先頭5枚:", ids1[:5])
              print("最後5枚:", ids1[-5:])

              if len(ids1) == 0:
                  print("ERROR: 1ページ目が取得できません")
                  sys.exit(1)

              print("")
              print("ページ2ボタンを確認します...")

              button_count = page.locator(
                  '#cardlist .wp-pagenavi a[data-page="2"]'
              ).count()

              print("ページ2ボタン:", button_count)

              if button_count == 0:
                  print("ERROR: ページ2ボタンがありません")
                  sys.exit(1)

              print("")
              print("公式JavaScriptのクリック処理を実行します...")

              result = page.evaluate("""
              () => {
                  const el = document.querySelector(
                      '#cardlist .wp-pagenavi a[data-page="2"]'
                  );

                  if (!el) {
                      return "BUTTON_NOT_FOUND";
                  }

                  if (!window.jQuery) {
                      return "JQUERY_NOT_FOUND";
                  }

                  window.jQuery(el).trigger("click");

                  return "CLICK_OK";
              }
              """)

              print("クリック結果:", result)

              if result != "CLICK_OK":
                  print("ERROR:", result)
                  sys.exit(1)

              print("")
              print("ページ切り替えを待っています...")

              # Ajax完了待ち
              for i in range(20):
                  time.sleep(1)

                  ids_now = get_ids(page.content())

                  print(
                      f"{i + 1}秒後: {len(ids_now)}枚"
                  )

                  if ids_now and ids_now != ids1:
                      break

              ids2 = get_ids(page.content())

              print("")
              print("==============================")
              print("結果")
              print("==============================")
              print("URL:", page.url)
              print("2ページ目カード数:", len(ids2))
              print("先頭5枚:", ids2[:5])
              print("最後5枚:", ids2[-5:])

              print("")
              print("==============================")
              print("比較")
              print("==============================")

              print(
                  "1ページ目と同じ:",
                  ids1 == ids2
              )

              if len(ids2) == 0:
                  print("")
                  print("ERROR: 2ページ目のカードが0枚です")
                  sys.exit(1)

              if ids1 == ids2:
                  print("")
                  print("ERROR: ページが切り替わっていません")
                  sys.exit(1)

              print("")
              print("================================")
              print("SUCCESS!")
              print("2ページ目の取得に成功しました")
              print("================================")

              browser.close()

          PY
