<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>デュエマ コレクション</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f3f4f6;color:#111827}
button,input,select{font:inherit}button{cursor:pointer}
header{background:#111827;color:#fff;padding:8px 12px;position:sticky;top:0;z-index:30}
h1{font-size:15px;line-height:1;margin:0 0 7px;font-weight:800}
.headrow{display:flex;gap:7px}
.search{flex:1;min-width:0;padding:9px 11px;border:0;border-radius:10px;background:#fff;color:#111827}
.settingsBtn{width:40px;border:0;border-radius:10px;background:#e5e7eb;color:#111827;font-size:19px}
main{max-width:760px;margin:auto;padding:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.tab{padding:10px 5px;border:0;border-radius:11px;background:#e5e7eb;font-weight:700;color:#111827;font-size:13px}
.tab.active{background:#111827;color:#fff}
.status{font-size:12px;color:#6b7280;margin:7px 5px 10px}
.hidden{display:none!important}
.empty{background:#fff;border-radius:14px;padding:24px;text-align:center;color:#6b7280}
.small{font-size:11px;color:#6b7280}

.cardwrap{position:relative}
.card{display:flex;align-items:center;gap:9px;background:#fff;border-radius:14px;padding:8px;margin:8px 0;box-shadow:0 2px 8px #00000010;min-height:116px}
.card-img{flex:none;width:64px;height:90px;object-fit:contain;border-radius:6px;background:#e5e7eb}
.card-info{flex:1;min-width:0;padding-right:2px}
.card h3{margin:0 0 4px;font-size:15px;line-height:1.3}
.card-number{display:inline-block;background:#eef0f3;color:#6b7280;border-radius:7px;padding:3px 6px;font-size:11px;margin-bottom:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12px;color:#6b7280;line-height:1.5}
.qty{flex:none;display:flex;align-items:center;gap:3px}
.qty button{width:34px;height:34px;border:0;border-radius:10px;background:#e5e7eb;color:#1677e8;font-size:22px}
.qty b{min-width:23px;text-align:center;font-size:17px}
.fav{position:absolute;right:5px;top:4px;border:0;background:#ffffffd9;border-radius:50%;width:32px;height:32px;font-size:20px;color:#1677e8;z-index:2}
.noimg{display:flex;align-items:center;justify-content:center;text-align:center;color:#9ca3af;font-size:10px;font-weight:700;background:#e5e7eb;border-radius:6px;overflow:hidden}

.overlay{position:fixed;inset:0;background:#0008;z-index:80;display:none;align-items:flex-end}
.overlay.open{display:flex}
.sheet{width:100%;max-height:91vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:16px 15px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #0003}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheetHead h2{margin:0;font-size:19px}
.close{border:0;background:#eef0f3;border-radius:50%;width:38px;height:38px;font-size:20px}
.field{margin:12px 0}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field select,.field input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.checkrow{display:flex;align-items:center;gap:9px;padding:8px 0}
.checkrow input{width:19px;height:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.filterChip{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px}
.filterChip.active{background:#111827;color:#fff;border-color:#111827}
.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.sheetActions button{padding:12px;border:0;border-radius:11px;font-weight:700}
.apply{background:#111827;color:#fff}
.reset{background:#e5e7eb;color:#111827}

.detailOverlay{position:fixed;inset:0;background:#000c;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.detailOverlay.open{display:flex}
.detailBox{width:min(560px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px;padding:14px}
.detailTop{display:flex;justify-content:flex-end}
.detailClose{border:0;background:#eef0f3;border-radius:50%;width:38px;height:38px;font-size:22px}
.detailImage{display:block;width:min(82vw,420px);height:auto;max-height:62vh;object-fit:contain;margin:0 auto 12px;border-radius:10px;background:#eee}
.detailName{text-align:center;font-size:19px;font-weight:800;margin:5px 0}
.detailNumber{text-align:center;color:#6b7280;font-size:12px;margin-bottom:10px}
.detailMeta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.detailMeta div{background:#f3f4f6;border-radius:9px;padding:8px;font-size:12px}
.detailAbility{margin-top:12px;background:#f9fafb;border-radius:10px;padding:10px;font-size:12px;line-height:1.65;white-space:pre-wrap}
.detailButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.detailButtons button{border:0;border-radius:10px;padding:11px;background:#111827;color:#fff}
.detailButtons button.secondary{background:#e5e7eb;color:#111827}

.decklist{display:grid;gap:8px}
.deck{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px #00000010}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.deckActions{display:flex;gap:7px;margin-top:10px}
.deckActions .btn{flex:1}
.deckCount{font-size:12px;color:#6b7280}
.btn{border:0;border-radius:10px;padding:9px 11px;background:#111827;color:#fff}
.btn.secondary{background:#e5e7eb;color:#111827}
.btn.danger{background:#fee2e2;color:#b91c1c}

.deckEditor{background:#fff;border-radius:14px;overflow:hidden}
.deckHeader{background:#111827;color:#fff;padding:9px 10px;position:sticky;top:0;z-index:15}
.deckHeadRow{display:flex;align-items:center;gap:7px}
.deckHeadRow button{border:0;border-radius:8px;padding:7px 9px;background:#374151;color:#fff}
.deckTitle{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.deckSave{background:#16a34a!important}
.sectionTabs{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:8px;gap:4px}
.sectionTab{border:0;background:#374151;color:#d1d5db;border-radius:7px;padding:7px 3px;font-size:11px}
.sectionTab.active{background:#fff;color:#111827}
.formatRow{display:flex;gap:5px;padding:8px 10px;background:#f3f4f6}
.formatBtn{flex:1;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:7px;font-size:11px}
.formatBtn.active{background:#111827;color:#fff;border-color:#111827}
.deckTools{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid #e5e7eb}
.deckTools button{flex:1;border:0;border-radius:9px;padding:8px;background:#e5e7eb;font-size:11px;font-weight:700}
.deckTools button.active{background:#111827;color:#fff}
.deckContents{padding:9px 9px 2px}
.deckContentGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.deckCardItem{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.deckCardItem img{display:block;width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:6px;background:#e5e7eb;box-shadow:0 1px 4px #0002}
.deckCardCount{position:absolute;right:3px;bottom:3px;background:#111827dd;color:#fff;border-radius:6px;padding:2px 5px;font-size:11px;font-weight:800}
.deckEmpty{background:#f3f4f6;border-radius:10px;padding:25px 10px;text-align:center;color:#6b7280;font-size:12px;grid-column:1/-1}
.deckPicker{border-top:1px solid #d1d5db;background:#fff;margin-top:8px}
.pickerSticky{position:sticky;top:0;background:#fff;z-index:10;padding:8px 9px;border-bottom:1px solid #e5e7eb}
.pickerSearchRow{display:flex;gap:6px}
.pickerSearchRow input{flex:1;min-width:0;padding:9px;border:1px solid #d1d5db;border-radius:9px}
.pickerSearchRow button{border:0;border-radius:9px;background:#e5e7eb;padding:0 12px}
.pickerSortRow{display:flex;gap:5px;margin-top:6px}
.pickerSortRow select{flex:1;padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:11px}
.pickerFilterBtn{border:0;background:#111827;color:#fff;border-radius:8px;padding:8px 10px;font-size:11px}
.pickerStatus{font-size:10px;color:#6b7280;margin-top:5px}
.pickerGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:8px 9px 70px}
.pickerCard{position:relative;touch-action:pan-y}
.pickerCard img{display:block;width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:6px;background:#e5e7eb}
.pickerPlus{position:absolute;right:3px;bottom:3px;width:28px;height:28px;border:0;border-radius:50%;background:#16a34a;color:#fff;font-size:21px;line-height:28px;box-shadow:0 2px 5px #0004}
.pickerPlus:active{transform:scale(.9)}
.loadMore{display:block;margin:4px auto 12px;border:0;border-radius:9px;padding:9px 18px;background:#111827;color:#fff;font-size:11px}
.swipeHint{text-align:center;font-size:10px;color:#9ca3af;padding:5px 0 8px}
.deckFilterSection{margin:13px 0}
.deckFilterSection h3{font-size:13px;margin:0 0 7px}
.deckFilterTwo{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rangeRow{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rangeRow input{width:100%}

.deckMakerTop{background:#fff;border-bottom:1px solid #d7dbe0;padding:8px 9px;position:sticky;top:0;z-index:14}
.deckMakerStats{display:grid;grid-template-columns:2fr 1fr 1fr;gap:5px}
.deckMakerStat{background:#f0f2f4;border-radius:9px;padding:7px 5px;text-align:center;font-size:10px}
.deckMakerStat b{display:block;font-size:17px;line-height:1.05}
.deckMakerStat span{color:#687078}
.deckMakerActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px}
.deckMakerActions button{border:0;border-radius:8px;background:#e7e9ec;padding:8px 3px;font-size:10px;font-weight:800}
.deckMakerActions button.primary{background:#11151b;color:#fff}
.pickerCard{touch-action:pan-y;position:relative}
.pickerCard.swiping{transform:scale(.96);opacity:.75}
.analysisGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.analysisBox{background:#f3f4f6;border-radius:10px;padding:10px}
.analysisBox b{display:block;font-size:18px}
.analysisBox span{font-size:11px;color:#6b7280}
.bar{height:8px;border-radius:99px;background:#e5e7eb;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:#111827}

@media(max-width:430px){
.card{gap:7px;padding:8px;min-height:114px}
.card-img{width:62px;height:87px}
.card h3{font-size:14px}
.qty button{width:33px;height:33px}
.deckContentGrid,.pickerGrid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>

<header>
<h1>デュエマ コレクション</h1>
<div class="headrow">
<input id="search" class="search" placeholder="カード名・番号・種族で検索">
<button id="settings" class="settingsBtn">⚙️</button>
</div>
</header>

<main>
<div class="tabs">
<button class="tab active" id="invTab">📦 所持カード</button>
<button class="tab" id="favTab">⭐ お気に入り</button>
<button class="tab" id="deckTab">🃏 デッキ</button>
</div>

<div id="invView">
<div class="status" id="status">カードデータを読み込み中…</div>
<div id="cards"></div>
</div>

<div id="favView" class="hidden">
<div class="status" id="favStatus"></div>
<div id="favorites"></div>
</div>

<div id="deckView" class="hidden">
<div id="deckListView"></div>
<div id="deckEditorView" class="hidden"></div>
</div>
</main>

<div class="overlay" id="overlay">
<div class="sheet">
<div class="sheetHead">
<h2>⚙️ 絞り込み・並び替え</h2>
<button class="close" id="closeSettings">×</button>
</div>

<div class="field">
<label>並び順</label>
<select id="sort">
<option value="default">おすすめ順</option>
<option value="latest">最新カード順</option>
<option value="name">名前順</option>
<option value="cost">コスト順</option>
<option value="power">パワー順</option>
<option value="civilization">文明順</option>
<option value="race">種族順</option>
<option value="rarity">レアリティ順</option>
<option value="number">カード番号順</option>
</select>
</div>

<div class="field">
<label>文明</label>
<select id="civilization"><option value="">すべて</option></select>
</div>

<div class="field">
<label>種族</label>
<input id="raceFilter" list="raceList" placeholder="例：ドラゴン">
<datalist id="raceList"></datalist>
</div>

<div class="field">
<label>カードタイプ</label>
<select id="type"><option value="">すべて</option></select>
</div>

<div class="field">
<label>レアリティ</label>
<select id="rarity"><option value="">すべて</option></select>
</div>

<label class="checkrow">
<input type="checkbox" id="ownedOnly"> 所持カードだけ表示
</label>

<label class="checkrow">
<input type="checkbox" id="unownedOnly"> 未所持カードだけ表示
</label>

<div class="sheetActions">
<button class="reset" id="resetSettings">リセット</button>
<button class="apply" id="applySettings">適用</button>
</div>
</div>
</div>

<div class="detailOverlay" id="detailOverlay">
<div class="detailBox">
<div class="detailTop">
<button class="detailClose" id="detailClose">×</button>
</div>
<div id="detailContent"></div>
</div>
</div>

<script>
const state={
cards:[],
owned:JSON.parse(localStorage.getItem('duema_owned_v3')||'{}'),
favorites:JSON.parse(localStorage.getItem('duema_favorites_v1')||'{}'),
decks:JSON.parse(localStorage.getItem('duema_decks_v3')||'[]'),
activeDeck:null,
deckSearch:'',
deckFilter:'all',
deckSection:'main',
pickerLimit:72,
pickerSort:'recommended',
showAllDeckCards:false
};

const $=id=>document.getElementById(id);

const setting={
sort:'default',
civilization:'',
race:'',
type:'',
rarity:'',
ownedOnly:false,
unownedOnly:false
};

const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'\"':'&quot;',
"'":'&#39;'
}[m]));

const faces=c=>Array.isArray(c.sides)&&c.sides.length?c.sides:[c];

function values(c,key){
return faces(c).flatMap(f=>{
let v=f[key];
if(v===undefined||v===null||v==='')return[];
return Array.isArray(v)?v:[v];
}).map(String);
}

function splitValues(v){
return String(v||'').split(/[／\\/・,、]+/).map(s=>s.trim()).filter(Boolean);
}

function civilizations(c){
return [...new Set(values(c,'civilization').flatMap(splitValues))];
}

function races(c){
return [...new Set(values(c,'race').flatMap(splitValues))];
}

function types(c){
return [...new Set(values(c,'type').flatMap(splitValues))];
}

function rarities(c){
return [...new Set(values(c,'rarity'))];
}

function firstValue(c,key){
return values(c,key)[0]||'';
}

function cardName(c){
return c.name||c._name||c.cardName||'';
}

function cardNumber(c){
return c.number||c.id||'';
}

function idOf(c){
return c.id||c.number||'';
}

function cardImage(c){
const id=idOf(c);
return id?'https://dm.takaratomy.co.jp/wp-content/card/cardimage/'+encodeURIComponent(id)+'.jpg':'';
}

function normalizeSearch(s){
return String(s??'')
.toLowerCase()
.normalize('NFKC')
.replace(/[\s　・･\-‐-–—ー_]/g,'')
.replace(/[ぁ-ゖ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60));
}

const CARD_ALIASES={
'龍装チュリス':['ドルガン','ドルガンチュリス'],
'蒼き団長ドギラゴン剣':['ドギ剣','ドギラゴン剣'],
'天災デドダム':['デドダム'],
'流星のガイアッシュ・カイザー':['ガイアッシュ','ガイアッシュカイザー'],
'龍風混成 ザーディクリカ':['ザーディ','ザーディクリカ'],
'飛翔龍 5000VT':['5000vt','5000ＶＴ','ファイブブイティー'],
'アーテル・ゴルギーニ':['アーテル'],
'同期の妖精':['同期'],
'終末縫合王 ザ＝キラー・キーナリー':['ザキラーキーナリー','キーナリー'],
'邪幽 ジャガイスト':['ジャガイスト'],
'ブルー・インパルス「真実を見極めよ、ジョニー！」':['ブルーインパルス'],
'鬼ヶ大王 ジャオウガ':['ジャオウガ'],
'百鬼の邪王門':['邪王門'],
'絶望と反魂と滅殺の決断':['パーフェクトダーク','パーフェクト・ダークネス'],
'「必勝」の頂 カイザー「刃鬼」':['刃鬼','カイザー刃鬼'],
'ボルシャック・栄光・ルピア':['栄光ルピア'],
'フェアリー・Re：ライフ':['フェアリーライフ','リライフ']
};

const ALIAS_INDEX=Object.entries(CARD_ALIASES)
.flatMap(([name,aliases])=>aliases.map(a=>[normalizeSearch(a),normalizeSearch(name)]));

function aliasText(c){
const name=normalizeSearch(cardName(c));
const aliases=[];
for(const [alias,target] of ALIAS_INDEX){
if(target===name)aliases.push(alias);
}
return aliases.join(' ');
}

function searchText(c){
return [
cardName(c),
cardNumber(c),
...civilizations(c),
...races(c),
...types(c),
...rarities(c),
aliasText(c)
].join(' ');
}

function costNum(c){
const n=parseInt(firstValue(c,'cost'),10);
return Number.isFinite(n)?n:999;
}

function powerNum(c){
const s=firstValue(c,'power').replace(/[^0-9]/g,'');
const n=Number(s);
return Number.isFinite(n)?n:-1;
}

function civRank(c){
const o=['光','水','闇','火','自然'];
const xs=civilizations(c);
const i=o.indexOf(xs[0]);
return i<0?99:i;
}

function save(){
localStorage.setItem('duema_owned_v3',JSON.stringify(state.owned));
localStorage.setItem('duema_favorites_v1',JSON.stringify(state.favorites));
localStorage.setItem('duema_decks_v3',JSON.stringify(state.decks));
}

function isFav(c){
return !!state.favorites[idOf(c)];
}

function toggleFav(id){
state.favorites[id]=!state.favorites[id];
if(!state.favorites[id])delete state.favorites[id];
save();
renderCurrent();
}

function hasEffect(c,key){
const text=faces(c).map(f=>[
f.ability,
f.text,
f.effect,
f.specialAbility,
f.specialAbilities
].flat().filter(Boolean).join(' ')).join(' ');

const patterns={
trigger:[
/S[・･]?トリガー/i,
/シールド[・ ]?トリガー/i
],
draw:[
/カードを[１一1]枚.*引/i,
/カードを[０-９0-9０-９]+枚.*引/i,
/[１一1]枚.*ドロー/i,
/ドロー/i
],
search:[
/山札.*手札.*加え/i,
/山札.*見る.*手札/i,
/山札から.*選び/i
],
removal:[
/破壊/i,
/手札に戻す/i,
/墓地に置く/i,
/マナゾーンに置く/i,
/シールド.*墓地/i
],
blocker:[
/ブロッカー/i
],
ramp:[
/マナゾーン.*置く/i,
/マナ.*加える/i
],
discard:[
/手札を.*捨て/i,
/捨てさせ/i
],
grave:[
/墓地.*回収/i,
/墓地.*手札/i,
/墓地から.*出/i
],
bounce:[
/手札に戻す/i
],
tap:[
/タップ/i,
/フリーズ/i
],
lock:[
/攻撃できない/i,
/使えない/i,
/選べない/i
],
attack:[
/攻撃する/i,
/攻撃できる/i,
/アタック/i
],
cheat:[
/コストを支払わず/i,
/出してもよい/i,
/バトルゾーンに出/i
],
recovery:[
/墓地.*手札/i,
/手札.*加え/i,
/シールド.*手札/i
],
protection:[
/選ばれない/i,
/離れない/i,
/破壊されない/i
],
revolution:[
/革命/i
],
gstrike:[
/G[・･]?ストライク/i
]
};

return (patterns[key]||[]).some(re=>re.test(text));
}

function filteredCards(base=state.cards){
const q=normalizeSearch($('search').value);

let list=base.filter(c=>{
if(q&&!normalizeSearch(searchText(c)).includes(q))return false;

if(setting.civilization &&
!civilizations(c).some(x=>x===setting.civilization))return false;

if(setting.race &&
!races(c).some(x=>normalizeSearch(x).includes(normalizeSearch(setting.race))))return false;

if(setting.type &&
!types(c).some(x=>x===setting.type))return false;

if(setting.rarity &&
!rarities(c).some(x=>x===setting.rarity))return false;

const n=state.owned[idOf(c)]||0;

if(setting.ownedOnly&&n<=0)return false;
if(setting.unownedOnly&&n>0)return false;

return true;
});

list.sort((a,b)=>{
switch(setting.sort){
case'latest':
return cardNumber(b).localeCompare(cardNumber(a),'ja');
case'name':
return cardName(a).localeCompare(cardName(b),'ja');
case'cost':
return costNum(a)-costNum(b)||cardName(a).localeCompare(cardName(b),'ja');
case'power':
return powerNum(a)-powerNum(b)||cardName(a).localeCompare(cardName(b),'ja');
case'civilization':
return civRank(a)-civRank(b)||civilizations(a).join().localeCompare(civilizations(b).join(),'ja');
case'race':
return races(a).join().localeCompare(races(b).join(),'ja');
case'rarity':
return rarities(a).join().localeCompare(rarities(b).join(),'ja');
case'number':
return cardNumber(a).localeCompare(cardNumber(b),'ja');
default:
return 0;
}
});

return list;
}

function deckTotal(d){
return (d.cards||[]).reduce((s,x)=>s+(Number(x.need)||0),0);
}

function deckCard(id){
return state.cards.find(c=>idOf(c)===String(id));
}

function deckCardsForSection(d,section){
if(section==='main')return d.cards||[];
if(section==='gr')return d.gr||[];
if(section==='extra')return d.extra||[];
return [];
}

function ensureDeckArrays(d){
if(!Array.isArray(d.cards))d.cards=[];
if(!Array.isArray(d.gr))d.gr=[];
if(!Array.isArray(d.extra))d.extra=[];
}

function addToDeck(id){
const d=state.decks[state.activeDeck];
if(!d)return;

ensureDeckArrays(d);

let arr=d.cards;

if(state.deckSection==='gr')arr=d.gr;
if(state.deckSection==='extra')arr=d.extra;

let x=arr.find(v=>String(v.id)===String(id));

if(x){
if(state.deckSection==='main'&&(Number(x.need)||0)>=4){
alert('同じカードは通常4枚までです。');
return;
}
x.need=(Number(x.need)||0)+1;
}else{
arr.push({id:String(id),need:1});
}

save();
renderDeckEditor();
}

function changeDeckQty(id,delta){
const d=state.decks[state.activeDeck];
if(!d)return;

ensureDeckArrays(d);

let arr=d.cards;
if(state.deckSection==='gr')arr=d.gr;
if(state.deckSection==='extra')arr=d.extra;

const x=arr.find(v=>String(v.id)===String(id));
if(!x)return;

x.need=(Number(x.need)||0)+delta;

if(x.need<=0){
arr.splice(arr.indexOf(x),1);
}

save();
renderDeckEditor();
}

function deckSectionTotal(d,section){
return deckCardsForSection(d,section)
.reduce((s,x)=>s+(Number(x.need)||0),0);
}

function pickerSortCards(list){
const mode=state.pickerSort;

return [...list].sort((a,b)=>{
if(mode==='name')
return cardName(a).localeCompare(cardName(b),'ja');

if(mode==='cost')
return costNum(a)-costNum(b)||cardName(a).localeCompare(cardName(b),'ja');

if(mode==='number')
return cardNumber(a).localeCompare(cardNumber(b),'ja');

if(mode==='owned')
return (state.owned[idOf(b)]||0)-(state.owned[idOf(a)]||0);

if(mode==='latest')
return cardNumber(b).localeCompare(cardNumber(a),'ja');

return 0;
});
}

function pickerFilteredCards(){
const d=state.decks[state.activeDeck];
if(!d)return[];

const q=normalizeSearch(state.deckSearch);

let list=state.cards.filter(c=>{
if(q&&!normalizeSearch(searchText(c)).includes(q))return false;

if(state.deckFilter==='owned'&&(state.owned[idOf(c)]||0)<=0)
return false;

if(state.deckFilter==='favorite'&&!isFav(c))
return false;

return true;
});

return pickerSortCards(list);
}

<div style="padding:10px">

<div class="deckFilterSection">
<h3>カード効果</h3>
<div class="deckFilterTwo">
<button class="btn secondary" data-effect="trigger">S・トリガー</button>
<button class="btn secondary" data-effect="draw">ドロー</button>
<button class="btn secondary" data-effect="search">サーチ</button>
<button class="btn secondary" data-effect="removal">除去</button>
<button class="btn secondary" data-effect="blocker">ブロッカー</button>
<button class="btn secondary" data-effect="ramp">マナ加速</button>
<button class="btn secondary" data-effect="discard">ハンデス</button>
<button class="btn secondary" data-effect="grave">墓地利用</button>
</div>
</div>

<div class="deckFilterSection">
<h3>コスト</h3>
<div class="rangeRow">
<input id="deckCostMin" type="number" min="0" placeholder="最小">
<input id="deckCostMax" type="number" min="0" placeholder="最大">
</div>
</div>

<div class="deckFilterSection">
<h3>文明</h3>
<div class="deckFilterTwo">
${['光','水','闇','火','自然','多色'].map(x=>`
<button class="filterChip" data-civ="${esc(x)}">${esc(x)}</button>
`).join('')}
</div>
</div>

<div class="sheetActions">
<button class="reset" id="filterReset">リセット</button>
<button class="apply" id="filterApply">適用</button>
</div>

</div>
</div>
`;

let selectedEffect='';
let selectedCiv='';

document.querySelectorAll('[data-effect]').forEach(b=>{
b.onclick=()=>{
selectedEffect=b.dataset.effect;
document.querySelectorAll('[data-effect]').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
};
});

document.querySelectorAll('[data-civ]').forEach(b=>{
b.onclick=()=>{
selectedCiv=b.dataset.civ;
document.querySelectorAll('[data-civ]').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
};
});

$('filterBack').onclick=()=>{
renderDeckEditor();
};

$('filterReset').onclick=()=>{
selectedEffect='';
selectedCiv='';
$('deckCostMin').value='';
$('deckCostMax').value='';
document.querySelectorAll('[data-effect],[data-civ]').forEach(x=>x.classList.remove('active'));
};

$('filterApply').onclick=()=>{
state.deckSearch='';
state.deckFilter='all';

const min=$('deckCostMin').value;
const max=$('deckCostMax').value;

const filtered=state.cards.filter(c=>{
if(selectedEffect&&!hasEffect(c,selectedEffect))return false;

const cost=costNum(c);

if(min!==''&&cost<Number(min))return false;
if(max!==''&&cost>Number(max))return false;

if(selectedCiv){
if(selectedCiv==='多色'){
if(civilizations(c).length<2)return false;
}else if(!civilizations(c).includes(selectedCiv)){
return false;
}
}

return true;
});

$('deckEditorView').innerHTML=`
<div class="deckEditor">
<div class="deckHeader">
<div class="deckHeadRow">
<button id="filteredBack">←</button>
<div class="deckTitle">絞り込み結果</div>
</div>
</div>

<div class="pickerStatus" style="padding:8px 10px">
${filtered.length.toLocaleString()}枚
</div>

<div class="pickerGrid">
${
filtered.slice(0,200).map(c=>`
<div class="pickerCard" data-filter-card="${esc(idOf(c))}">
${cardImage(c)
?`<img src="${cardImage(c)}" loading="lazy" referrerpolicy="no-referrer">`
:''}
<button class="pickerPlus" data-filter-add="${esc(idOf(c))}">＋</button>
</div>
`).join('')
||'<div class="empty" style="grid-column:1/-1">該当カードなし</div>'
}
</div>
</div>
`;

$('filteredBack').onclick=()=>{
renderDeckEditor();
};

document.querySelectorAll('[data-filter-add]').forEach(b=>{
b.onclick=()=>{
addToDeck(b.dataset.filterAdd);
};
});

document.querySelectorAll('[data-filter-card]').forEach(el=>{
el.onclick=e=>{
if(e.target.closest('[data-filter-add]'))return;
openCardDetail(el.dataset.filterCard);
};
});
};
}

function attachPickerTouch(){
document.querySelectorAll('#pickerGrid .pickerCard').forEach(el=>{
let sx=0;
let sy=0;
let dx=0;
let dy=0;
let moved=false;

el.addEventListener('touchstart',e=>{
sx=e.touches[0].clientX;
sy=e.touches[0].clientY;
dx=0;
dy=0;
moved=false;
},{passive:true});

el.addEventListener('touchmove',e=>{
dx=e.touches[0].clientX-sx;
dy=e.touches[0].clientY-sy;

if(Math.abs(dy)>10||Math.abs(dx)>10)moved=true;

if(dy<-10)el.classList.add('swiping');
},{passive:true});

el.addEventListener('touchend',()=>{
el.classList.remove('swiping');

if(moved&&dy<-45){
addToDeck(el.dataset.pickerCard);
return;
}

if(!moved){
openCardDetail(el.dataset.pickerCard);
}
},{passive:true});
});
}

async function loadCards(){
try{
const r=await fetch('./data/cards.json?'+Date.now(),{cache:'no-store'});

if(!r.ok)throw new Error('cards.json '+r.status);

const data=await r.json();

if(Array.isArray(data)){
state.cards=data;
}else if(Array.isArray(data.cards)){
state.cards=data.cards;
}else{
throw new Error('カードデータ形式が不明です');
}

$('status').textContent=
`公式カード ${state.cards.length.toLocaleString()} 枚`;

renderCards();
fillSettings();

}catch(e){
console.error(e);
$('status').textContent='カードデータを読み込めませんでした';
$('cards').innerHTML=`
<div class="empty">
カードデータの読み込みに失敗しました。<br>
<span class="small">${esc(e.message)}</span>
</div>`;
}
}

$('invTab').onclick=()=>{
state.activeDeck=null;
switchTab('inv');
};

$('favTab').onclick=()=>{
state.activeDeck=null;
switchTab('fav');
};

$('deckTab').onclick=()=>{
switchTab('deck');
};

loadCards();
</script>
</body>
</html>
