name: Test Duel Masters Pager

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Test official pager
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          URL = "https://dm.takaratomy.co.jp/card/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              print("=" * 60)
              print("公式カード検索を開きます")
              print("=" * 60)

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              print()
              print("現在のURL:")
              print(page.url)

              print()
              print("=" * 60)
              print("ページャーの調査")
              print("=" * 60)

              result = page.evaluate("""
              () => {
                  const elements =
                      Array.from(
                          document.querySelectorAll(
                              'a[data-page]'
                          )
                      );

                  return elements.map((el, index) => ({
                      index: index,
                      text: (el.innerText || '').trim(),
                      dataPage: el.getAttribute('data-page'),
                      className: el.className,
                      href: el.getAttribute('href'),
                      parentClass:
                          el.parentElement
                            ? el.parentElement.className
                            : '',
                      outerHTML:
                          el.outerHTML.substring(0, 500)
                  }));
              }
              """)

              print(
                  "data-pageを持つ要素数:",
                  len(result)
              )

              for item in result:
                  print()
                  print(
                      f"[{item['index']}] "
                      f"text={item['text']!r} "
                      f"data-page={item['dataPage']!r}"
                  )
                  print(
                      f"  class={item['className']!r}"
                  )
                  print(
                      f"  href={item['href']!r}"
                  )
                  print(
                      f"  parent={item['parentClass']!r}"
                  )
                  print(
                      f"  html={item['outerHTML']}"
                  )

              print()
              print("=" * 60)
              print("ページャー周辺のHTML")
              print("=" * 60)

              pager_html = page.evaluate("""
              () => {
                  const candidates = [
                      '.wp-pagenavi',
                      '#cardlist .wp-pagenavi',
                      '.pagination',
                      '.pager',
                      '[class*="pagenavi"]',
                      '[class*="pagination"]'
                  ];

                  for (const selector of candidates) {
                      const el =
                          document.querySelector(selector);

                      if (el) {
                          return {
                              selector: selector,
                              html:
                                  el.outerHTML.substring(
                                      0,
                                      10000
                                  )
                          };
                      }
                  }

                  return {
                      selector: null,
                      html: ''
                  };
              }
              """)

              print(
                  "見つかったコンテナ:",
                  pager_html["selector"]
              )

              print(
                  pager_html["html"]
              )

              print()
              print("=" * 60)
              print("2ページ目ボタンの確認")
              print("=" * 60)

              count = page.locator(
                  'a[data-page="2"]'
              ).count()

              print(
                  'a[data-page="2"] の数:',
                  count
              )

              if count > 0:
                  print(
                      "2ページ目ボタン:",
                      page.locator(
                          'a[data-page="2"]'
                      ).first.evaluate(
                          "(el) => el.outerHTML"
                      )
                  )

              print()
              print("=" * 60)
              print("診断終了")
              print("=" * 60)

              browser.close()
          PY
