name: Debug Duel Masters Page Request 2

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Inspect official search.js
        run: |
          python - <<'PY'
          import requests
          import re

          JS_URL = "https://dm.takaratomy.co.jp/common/js/search.js"

          print("=" * 80)
          print("公式 search.js を取得")
          print("=" * 80)

          r = requests.get(
              JS_URL,
              headers={
                  "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)"
              },
              timeout=30
          )

          print("HTTP:", r.status_code)
          print("文字数:", len(r.text))

          js = r.text
          lines = js.splitlines()

          # --------------------------------------------------
          # 先頭200行
          # --------------------------------------------------

          print("\n" + "=" * 80)
          print("【search.js 先頭200行】")
          print("=" * 80)

          for i, line in enumerate(lines[:200], 1):
              print(f"{i:04d}: {line}")

          # --------------------------------------------------
          # 重要キーワード周辺
          # --------------------------------------------------

          patterns = [
              "research",
              "$.ajax",
              "$.get",
              "$.post",
              "getJSON",
              "fetch(",
              "XMLHttpRequest",
              "pagenum",
              "data-page",
              ".page",
              "history.pushState",
              "history.replaceState",
              "param_json",
              "location.search",
              "非同期",
              "ページ取得",
          ]

          print("\n" + "=" * 80)
          print("【重要キーワード周辺】")
          print("=" * 80)

          ranges = []

          for pattern in patterns:
              for i, line in enumerate(lines):

                  if pattern.lower() in line.lower():

                      start = max(0, i - 20)
                      end = min(len(lines), i + 21)

                      # ほぼ同じ範囲は重複表示しない
                      duplicate = False

                      for a, b in ranges:
                          if start >= a and end <= b:
                              duplicate = True
                              break

                      if duplicate:
                          continue

                      ranges.append((start, end))

                      print("\n")
                      print("-" * 80)
                      print("KEYWORD:", pattern)
                      print("LINES:", start + 1, "-", end)
                      print("-" * 80)

                      for j in range(start, end):
                          print(f"{j + 1:04d}: {lines[j]}")

          # --------------------------------------------------
          # ページ関連だけを一覧表示
          # --------------------------------------------------

          print("\n" + "=" * 80)
          print("【ページ取得に関係しそうな行】")
          print("=" * 80)

          page_patterns = [
              "data-page",
              "pagenum",
              "research(",
              "$.ajax",
              "$.get(",
              "$.post(",
              "getJSON",
              "fetch(",
              "非同期",
              "ページ取得",
          ]

          for i, line in enumerate(lines, 1):

              if any(
                  p.lower() in line.lower()
                  for p in page_patterns
              ):
                  print(f"{i:04d}: {line}")

          print("\n" + "=" * 80)
          print("調査終了")
          print("=" * 80)
          PY
