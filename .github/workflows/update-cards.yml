name: Test Duel Masters Browser Pagination

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Test browser pagination
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          URL = "https://dm.takaratomy.co.jp/card/"

          def get_card_ids(page):
              links = page.locator('a[href*="/card/detail/?id="]').all()
              ids = []

              for link in links:
                  href = link.get_attribute("href")
                  if href:
                      m = re.search(r'id=([^&"]+)', href)
                      if m:
                          ids.append(m.group(1))

              return list(dict.fromkeys(ids))

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(
                  user_agent=(
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                      "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                      "Version/18.0 Mobile/15E148 Safari/604.1"
                  )
              )

              print("公式カード検索をブラウザで開きます")

              page.goto(URL, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(3000)

              ids1 = get_card_ids(page)

              print("")
              print("===== 1ページ目 =====")
              print("カード:", len(ids1), "枚")
              print("先頭:", ids1[:5])
              print("末尾:", ids1[-5:])

              # ページ送りリンクを探す
              links = page.locator("a").all()

              page2_href = None

              for link in links:
                  text = (link.inner_text() or "").strip()
                  href = link.get_attribute("href")

                  if text == "2" and href and "/card/" in href:
                      page2_href = href
                      print("")
                      print("2ページ目リンク発見:")
                      print(href)
                      break

              if not page2_href:
                  print("")
                  print("ページ2へのリンクが見つかりませんでした。")
                  print("現在のページURL:")
                  print(page.url)

                  print("")
                  print("ページ送り候補:")
                  for link in links:
                      text = (link.inner_text() or "").strip()
                      href = link.get_attribute("href")

                      if text in ["1", "2", "3", "4", "5", "最後のページ"]:
                          print("TEXT:", repr(text))
                          print("HREF:", href)

                  raise RuntimeError("2ページ目のリンクを取得できませんでした。")

              # 実際に2ページ目へ移動
              page.goto(
                  "https://dm.takaratomy.co.jp" + page2_href
                  if page2_href.startswith("/")
                  else page2_href,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(3000)

              ids2 = get_card_ids(page)

              print("")
              print("===== 2ページ目 =====")
              print("現在URL:", page.url)
              print("カード:", len(ids2), "枚")
              print("先頭:", ids2[:5])
              print("末尾:", ids2[-5:])

              same = ids1 == ids2

              print("")
              print("===== 結果 =====")
              print("1ページ目と2ページ目が同じ:", same)

              if same:
                  raise RuntimeError(
                      "ブラウザで移動しても1ページ目と2ページ目が同じです。"
                  )

              print("")
              print("SUCCESS: ブラウザでページ送りできました！")

              browser.close()
          PY
